# gitleaks configuration (F12): the default rules plus an allowlist of exact
# fake values that tests use on purpose. Values, not files (#56): a real secret
# added to one of these test files is still caught. CI scans the full history,
# so a value stays listed for as long as an old commit holds it.
#
# A new fixture gets `gitleaks:allow` in a comment on its line instead (the
# marker is in the line, so it survives the squash merge), see
# docs/development.md › Fake secrets in tests.
title = "olympos"

[extend]
useDefault = true

[[allowlists]]
description = "Fake values of tests: canaries that redaction and the scanners must catch, and test credentials"
regexes = [
  # internal/agent/sensitive_test.go, internal/sensitive/sensitive_test.go, test/e2e/m5_sensitive_test.go
  '''^AKIAQ3VZ7RMXK2JWDTPL$''',
  # internal/sensitive/sensitive_test.go
  '''^ghp_R4nd0mCanaryT0kenV4lue0123456789abXy$''',
  # internal/agent/sensitive_test.go, test/e2e/m5_sensitive_test.go: a PEM canary
  '''^-----BEGIN RSA PRIVATE KEY-----(\\n|\n)MIIEpAIBAAKCAQEA3Tz2mr7SZiAMfQyuvBjM2''',
  # internal/audit/testdata/kubescape-failure.log
  '''^eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJsb2ctY2FuYXJ5In0\.c2lnbmF0dXJlc2ln''',
  # internal/synthetic/expiry_test.go
  '''^olympos-canary-expiry-4c1d9e$''',
  # internal/synthetic/alerting_test.go
  '''^tok-9f8e7d6c5b4a$''',
  # internal/probe/client_test.go
  '''^tok-9f3a7c1e5b2d4e6f8a0b$''',
  # web/src/test/synthetic-settings.test.tsx
  '''^tok-7f3c-very-secret$''',
  # internal/ingest/sigv4_test.go: the SigV4 test secret
  '''^0123456789abcdef0123456789abcdef01234567$''',
  # internal/blob/s3_test.go: a wrong MinIO secret
  '''^WRONG-SECRET-123$''',
  # internal/backup/engines/clickhouse/native_run_test.go: the fake ingest secret
  '''^secret-canary-0123456789abcdefghijklmnop$''',
]

[[allowlists]]
description = "Azurite's well-known public development account key (documented by Microsoft)"
regexes = ['''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''']
