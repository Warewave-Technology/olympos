# Workloads of the second lab cluster (olympos-edge).
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: payments-pg, namespace: shop}
spec:
  serviceName: payments-pg
  selector: {matchLabels: {app: payments-pg}}
  template:
    metadata: {labels: {app: payments-pg, team: payments}}
    spec:
      initContainers:
      - name: certs
        image: busybox:1.36
        command: [sh, -c, "cp /tls/tls.crt /tls/tls.key /certs/ && chown 70:70 /certs/* && chmod 0600 /certs/tls.key"]
        volumeMounts: [{name: tls, mountPath: /tls}, {name: certs, mountPath: /certs}]
      containers:
      - name: pg
        image: postgres:15-alpine
        args: [-c, ssl=on, -c, ssl_cert_file=/certs/tls.crt, -c, ssl_key_file=/certs/tls.key]
        env:
        - {name: POSTGRES_USER, value: backup}
        - {name: POSTGRES_PASSWORD, value: edge-pg-password}
        - {name: POSTGRES_DB, value: payments}
        ports: [{containerPort: 5432, name: pg}]
        readinessProbe: {exec: {command: [pg_isready, -U, backup]}, periodSeconds: 3}
        volumeMounts: [{name: certs, mountPath: /certs}]
      volumes:
      - {name: tls, secret: {secretName: payments-pg-tls}}
      - {name: certs, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-pg
  namespace: shop
  annotations:
    olympos.io/backup: postgresql
    olympos.io/tls-server-name: payments-pg.shop.svc
spec:
  selector: {app: payments-pg}
  ports: [{name: pg, port: 5432}]
---
# An old image so Security has CVEs to show; no NetworkPolicy on purpose.
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront}}
    spec:
      containers:
      - name: web
        image: nginx:1.21.6
        ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart-cache, namespace: shop}
spec:
  selector: {matchLabels: {app: cart-cache}}
  template:
    metadata: {labels: {app: cart-cache}}
    spec:
      containers:
      - name: redis
        image: redis:6.2.6
---
apiVersion: v1
kind: Namespace
metadata: {name: secure}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: secure}
spec:
  podSelector: {}
  policyTypes: [Ingress]
