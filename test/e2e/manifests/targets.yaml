# Workloads Olympos should discover in the lab cluster (SPEC §5 annotations).
apiVersion: v1
kind: Namespace
metadata: {name: lab}
---
# PostgreSQL with TLS from the lab CA (secret pg-tls is created by run.sh).
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: orders-pg, namespace: lab}
spec:
  serviceName: orders-pg
  selector: {matchLabels: {app: orders-pg}}
  template:
    metadata: {labels: {app: orders-pg}}
    spec:
      initContainers:
      - name: certs
        image: busybox:1.36
        command: [sh, -c, "cp /tls/tls.crt /tls/tls.key /certs/ && chown 70:70 /certs/* && chmod 0600 /certs/tls.key"]
        volumeMounts: [{name: tls, mountPath: /tls}, {name: certs, mountPath: /certs}]
      containers:
      - name: pg
        image: postgres:16-alpine
        args: [-c, ssl=on, -c, ssl_cert_file=/certs/tls.crt, -c, ssl_key_file=/certs/tls.key]
        env:
        - {name: POSTGRES_USER, value: backup}
        - {name: POSTGRES_PASSWORD, value: CANARY-lab-pg-password}
        - {name: POSTGRES_DB, value: orders}
        ports: [{containerPort: 5432, name: pg}]
        readinessProbe: {exec: {command: [pg_isready, -U, backup]}, periodSeconds: 3}
        volumeMounts: [{name: certs, mountPath: /certs}]
      volumes:
      - {name: tls, secret: {secretName: pg-tls}}
      - {name: certs, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-pg
  namespace: lab
  annotations:
    olympos.io/backup: postgresql
    olympos.io/tls-server-name: orders-pg.lab.svc
spec:
  selector: {app: orders-pg}
  ports: [{name: pg, port: 5432}]
---
# Vault dev server (in-memory, http). Raft snapshots need integrated storage;
# the M3 e2e runs Vault with a raft config instead (see vault-raft below).
apiVersion: apps/v1
kind: Deployment
metadata: {name: vault, namespace: lab}
spec:
  selector: {matchLabels: {app: vault}}
  template:
    metadata: {labels: {app: vault}}
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.20
        args: [server, -config=/vault/olympos/raft.hcl]
        env:
        - {name: VAULT_ADDR, value: "https://127.0.0.1:8200"}
        - {name: VAULT_SKIP_VERIFY, value: "true"}   # local admin CLI in the pod only
        - {name: SKIP_SETCAP, value: "true"}
        ports: [{containerPort: 8200}]
        volumeMounts:
        - {name: config, mountPath: /vault/olympos}
        - {name: data, mountPath: /vault/data}
        - {name: tls, mountPath: /vault/tls, readOnly: true}
      volumes:
      - name: config
        configMap: {name: vault-raft}
      - name: tls
        secret: {secretName: vault-tls}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: vault-raft, namespace: lab}
data:
  raft.hcl: |
    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
    }
    api_addr     = "https://vault.lab.svc:8200"
    cluster_addr = "https://vault.lab.svc:8201"
    disable_mlock = true
    ui = false
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: lab
  annotations:
    olympos.io/vault: hashicorp
    olympos.io/backup: vault
    olympos.io/tls-server-name: vault.lab.svc
spec:
  selector: {app: vault}
  ports: [{name: https, port: 8200}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: openbao, namespace: lab}
spec:
  selector: {matchLabels: {app: openbao}}
  template:
    metadata: {labels: {app: openbao}}
    spec:
      containers:
      - name: bao
        image: openbao/openbao:2.4.1
        args: [server, -config=/openbao/olympos/raft.hcl]
        env:
        - {name: BAO_ADDR, value: "https://127.0.0.1:8200"}
        - {name: BAO_SKIP_VERIFY, value: "true"}   # local admin CLI in the pod only
        - {name: SKIP_SETCAP, value: "true"}
        ports: [{containerPort: 8200}]
        volumeMounts:
        - {name: config, mountPath: /openbao/olympos}
        - {name: data, mountPath: /openbao/data}
        - {name: tls, mountPath: /openbao/tls, readOnly: true}
      volumes:
      - name: config
        configMap: {name: openbao-raft}
      - {name: data, emptyDir: {}}
      - name: tls
        secret: {secretName: openbao-tls}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: openbao-raft, namespace: lab}
data:
  raft.hcl: |
    storage "raft" {
      path    = "/openbao/data"
      node_id = "bao-0"
    }
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/openbao/tls/tls.crt"
      tls_key_file  = "/openbao/tls/tls.key"
    }
    api_addr      = "https://openbao.lab.svc:8200"
    cluster_addr  = "https://openbao.lab.svc:8201"
    disable_mlock = true
    ui = false
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: lab
  annotations:
    olympos.io/vault: openbao
    olympos.io/backup: vault
    olympos.io/tls-server-name: openbao.lab.svc
spec:
  selector: {app: openbao}
  ports: [{name: https, port: 8200}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: metrics-ch, namespace: lab}
spec:
  selector: {matchLabels: {app: metrics-ch}}
  template:
    metadata: {labels: {app: metrics-ch}}
    spec:
      containers:
      - name: ch
        image: clickhouse/clickhouse-server:24.8
        env:
        - {name: CLICKHOUSE_USER, value: backup}
        - {name: CLICKHOUSE_PASSWORD, value: CANARY-lab-ch-password}
        - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
        ports: [{containerPort: 9000, name: native}]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-ch
  namespace: lab
  annotations:
    olympos.io/backup: clickhouse
    olympos.io/port: native
spec:
  selector: {app: metrics-ch}
  ports: [{name: native, port: 9000}, {name: http, port: 8123}]
---
# native-ch: the lab's native-ready ClickHouse (docs/clickhouse-backups.md):
# 24.8 with an embedded Keeper, trusting the Olympos CA through the config.d
# file docs/install.md shows (olympos-ingest-ca.xml), with
# select_from_system_db_requires_grant on and a backup user that has only the
# privileges docs/clickhouse-backups.md lists. The CA itself is in the
# ConfigMap olympos-ca, which the tests and the docs tour copy from the agent's
# olympos-agent-ca (Olympos gets a new CA with every reset; the pods restart to
# load it). Logins: admin (lab setup, SQL user management) and backup; the
# user default answers only on localhost (a dictionary's local source).
# TestM10ClickHouseNative owns the databases m10 and m10wire, the docs tour
# shop. Data on an emptyDir: a new pod is an empty server.
apiVersion: v1
kind: ConfigMap
metadata: {name: native-ch-config, namespace: lab}
data:
  olympos-ingest-ca.xml: |
    <clickhouse>
      <openSSL>
        <client>
          <caConfig>/etc/clickhouse-server/olympos-ca/ca.crt</caConfig>
        </client>
      </openSSL>
    </clickhouse>
  keeper.xml: |
    <clickhouse>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <raft_configuration><server><id>1</id><hostname>localhost</hostname><port>9234</port></server></raft_configuration>
      </keeper_server>
      <zookeeper><node><host>localhost</host><port>9181</port></node></zookeeper>
      <macros><shard>01</shard><replica>native-ch</replica></macros>
    </clickhouse>
  access.xml: |
    <clickhouse>
      <access_control_improvements>
        <select_from_system_db_requires_grant>true</select_from_system_db_requires_grant>
      </access_control_improvements>
    </clickhouse>
  # The backup user's grants are the list in docs/clickhouse-backups.md
  # ("The backup user's privileges"); TestM10ClickHouseNative compares them.
  users.xml: |
    <clickhouse>
      <users>
        <default>
          <networks replace="replace"><ip>::1</ip><ip>127.0.0.1</ip></networks>
        </default>
        <admin>
          <password>CANARY-lab-native-ch-admin-password</password>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
        </admin>
        <backup>
          <password>CANARY-lab-native-ch-password</password>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT BACKUP ON m10.*</query>
            <query>GRANT BACKUP ON m10wire.*</query>
            <query>GRANT BACKUP ON shop.*</query>
            <query>GRANT SELECT ON system.tables</query>
            <query>GRANT SELECT ON system.clusters</query>
            <query>GRANT SELECT ON system.parts</query>
            <query>GRANT SELECT ON system.processes</query>
            <query>GRANT SELECT ON system.backups</query>
          </grants>
        </backup>
      </users>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: native-ch, namespace: lab}
spec:
  selector: {matchLabels: {app: native-ch}}
  template:
    metadata: {labels: {app: native-ch}}
    spec:
      containers:
      - name: ch
        image: clickhouse/clickhouse-server:24.8
        ports: [{containerPort: 9000, name: native}, {containerPort: 8123, name: http}, {containerPort: 9181, name: keeper}]
        readinessProbe: {httpGet: {path: /ping, port: 8123}, periodSeconds: 3}
        volumeMounts:
        - {name: config, mountPath: /etc/clickhouse-server/config.d/olympos-ingest-ca.xml, subPath: olympos-ingest-ca.xml}
        - {name: config, mountPath: /etc/clickhouse-server/config.d/keeper.xml, subPath: keeper.xml}
        - {name: config, mountPath: /etc/clickhouse-server/config.d/access.xml, subPath: access.xml}
        - {name: config, mountPath: /etc/clickhouse-server/users.d/lab-users.xml, subPath: users.xml}
        - {name: olympos-ca, mountPath: /etc/clickhouse-server/olympos-ca, readOnly: true}
        - {name: data, mountPath: /var/lib/clickhouse}
      volumes:
      - name: config
        configMap: {name: native-ch-config}
      - name: olympos-ca
        configMap: {name: olympos-ca, optional: true}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: native-ch
  namespace: lab
  annotations:
    olympos.io/backup: clickhouse
    olympos.io/port: native
spec:
  selector: {app: native-ch}
  ports: [{name: native, port: 9000}, {name: http, port: 8123}, {name: keeper, port: 9181}]
---
# Restore targets (docs/restore.md "Restore from the UI"): new, empty servers
# that a backup of the lab's sources is restored into. Their data is an
# emptyDir (reset_olympos restarts them, which empties them again).
#
# restore-pg: PostgreSQL 16 with TLS from the lab CA (secret restore-pg-tls is
# created by run.sh). Same major as orders-pg, so a 16 -> 16 restore runs the
# real pg_restore 16 of the server image. Admin login postgres (a superuser).
apiVersion: apps/v1
kind: Deployment
metadata: {name: restore-pg, namespace: lab}
spec:
  selector: {matchLabels: {app: restore-pg}}
  template:
    metadata: {labels: {app: restore-pg}}
    spec:
      initContainers:
      - name: certs
        image: busybox:1.36
        command: [sh, -c, "cp /tls/tls.crt /tls/tls.key /certs/ && chown 70:70 /certs/* && chmod 0600 /certs/tls.key"]
        volumeMounts: [{name: tls, mountPath: /tls}, {name: certs, mountPath: /certs}]
      containers:
      - name: pg
        image: postgres:16-alpine
        args: [-c, ssl=on, -c, ssl_cert_file=/certs/tls.crt, -c, ssl_key_file=/certs/tls.key]
        env:
        - {name: POSTGRES_USER, value: postgres}
        - {name: POSTGRES_PASSWORD, value: CANARY-lab-restore-pg-password}
        ports: [{containerPort: 5432, name: pg}]
        readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}, periodSeconds: 3}
        volumeMounts: [{name: certs, mountPath: /certs}, {name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
      - {name: tls, secret: {secretName: restore-pg-tls}}
      - {name: certs, emptyDir: {}}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: restore-pg
  namespace: lab
  annotations:
    olympos.io/backup: postgresql
    olympos.io/tls-server-name: restore-pg.lab.svc
spec:
  selector: {app: restore-pg}
  ports: [{name: pg, port: 5432}]
---
# restore-ch: ClickHouse without TLS, like metrics-ch (the lab cluster's
# transfer mode must be compressed to restore into it). Admin login restore.
apiVersion: apps/v1
kind: Deployment
metadata: {name: restore-ch, namespace: lab}
spec:
  selector: {matchLabels: {app: restore-ch}}
  template:
    metadata: {labels: {app: restore-ch}}
    spec:
      containers:
      - name: ch
        image: clickhouse/clickhouse-server:24.8
        env:
        - {name: CLICKHOUSE_USER, value: restore}
        - {name: CLICKHOUSE_PASSWORD, value: CANARY-lab-restore-ch-password}
        - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
        ports: [{containerPort: 9000, name: native}]
        volumeMounts: [{name: data, mountPath: /var/lib/clickhouse}]
      volumes:
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: restore-ch
  namespace: lab
  annotations:
    olympos.io/backup: clickhouse
    olympos.io/port: native
spec:
  selector: {app: restore-ch}
  ports: [{name: native, port: 9000}, {name: http, port: 8123}]
---
# restore-native-ch: the ClickHouse 24.8 that native backups of native-ch are
# restored into (docs/restore.md "A native backup"). It trusts the Olympos CA
# the same way (it reads the backup through the ingest endpoint) and uses
# native-ch's Keeper, so a restore shows that it leaves the source's replicas
# alone. Admin login restore; the user default answers only on localhost.
apiVersion: v1
kind: ConfigMap
metadata: {name: restore-native-ch-config, namespace: lab}
data:
  keeper.xml: |
    <clickhouse>
      <zookeeper><node><host>native-ch.lab.svc</host><port>9181</port></node></zookeeper>
      <macros><shard>01</shard><replica>restore-native-ch</replica></macros>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <users>
        <default>
          <networks replace="replace"><ip>::1</ip><ip>127.0.0.1</ip></networks>
        </default>
        <restore>
          <password>CANARY-lab-restore-native-ch-password</password>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
        </restore>
      </users>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: restore-native-ch, namespace: lab}
spec:
  selector: {matchLabels: {app: restore-native-ch}}
  template:
    metadata: {labels: {app: restore-native-ch}}
    spec:
      containers:
      - name: ch
        image: clickhouse/clickhouse-server:24.8
        ports: [{containerPort: 9000, name: native}, {containerPort: 8123, name: http}]
        readinessProbe: {httpGet: {path: /ping, port: 8123}, periodSeconds: 3}
        volumeMounts:
        - {name: native-config, mountPath: /etc/clickhouse-server/config.d/olympos-ingest-ca.xml, subPath: olympos-ingest-ca.xml}
        - {name: config, mountPath: /etc/clickhouse-server/config.d/keeper.xml, subPath: keeper.xml}
        - {name: config, mountPath: /etc/clickhouse-server/users.d/lab-users.xml, subPath: users.xml}
        - {name: olympos-ca, mountPath: /etc/clickhouse-server/olympos-ca, readOnly: true}
        - {name: data, mountPath: /var/lib/clickhouse}
      volumes:
      - name: native-config
        configMap: {name: native-ch-config}
      - name: config
        configMap: {name: restore-native-ch-config}
      - name: olympos-ca
        configMap: {name: olympos-ca, optional: true}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: restore-native-ch
  namespace: lab
  annotations:
    olympos.io/backup: clickhouse
    olympos.io/port: native
spec:
  selector: {app: restore-native-ch}
  ports: [{name: native, port: 9000}, {name: http, port: 8123}]
---
# restore-vault: a new Vault (raft, TLS from the lab CA; secret
# restore-vault-tls is created by run.sh), initialized and unsealed by
# run.sh/env.sh with its own keys ($WORK/restore-vault-init.json). Not
# configured in Olympos: a snapshot is only restored into such a Vault.
# After a restore it holds the source's data: unseal it with the source's
# keys ($WORK/vault-init.json).
apiVersion: apps/v1
kind: Deployment
metadata: {name: restore-vault, namespace: lab}
spec:
  selector: {matchLabels: {app: restore-vault}}
  template:
    metadata: {labels: {app: restore-vault}}
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.20
        args: [server, -config=/vault/olympos/raft.hcl]
        env:
        - {name: VAULT_ADDR, value: "https://127.0.0.1:8200"}
        - {name: VAULT_SKIP_VERIFY, value: "true"}   # local admin CLI in the pod only
        - {name: SKIP_SETCAP, value: "true"}
        ports: [{containerPort: 8200}]
        volumeMounts:
        - {name: config, mountPath: /vault/olympos}
        - {name: data, mountPath: /vault/data}
        - {name: tls, mountPath: /vault/tls, readOnly: true}
      volumes:
      - name: config
        configMap: {name: restore-vault-raft}
      - name: tls
        secret: {secretName: restore-vault-tls}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: restore-vault-raft, namespace: lab}
data:
  raft.hcl: |
    storage "raft" {
      path    = "/vault/data"
      node_id = "restore-vault-0"
    }
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
    }
    api_addr      = "https://restore-vault.lab.svc:8200"
    cluster_addr  = "https://restore-vault.lab.svc:8201"
    disable_mlock = true
    ui = false
---
apiVersion: v1
kind: Service
metadata:
  name: restore-vault
  namespace: lab
  annotations:
    olympos.io/vault: hashicorp
    olympos.io/backup: vault
    olympos.io/tls-server-name: restore-vault.lab.svc
spec:
  selector: {app: restore-vault}
  ports: [{name: https, port: 8200}]
---
# Not annotated: must NOT be discovered.
apiVersion: v1
kind: Service
metadata: {name: not-a-target, namespace: lab}
spec:
  selector: {app: orders-pg}
  ports: [{port: 5432}]
