image: {repository: olympos-server, tag: e2e, pullPolicy: Never}
workloadIdentity: {enabled: false}
service: {type: NodePort, port: 80, nodePort: 30080}
gatewayService: {type: ClusterIP, annotations: {}}
# ClickHouse pods in the lab cluster dial the ingest endpoint here (olympos.ingest.url).
ingestService: {type: ClusterIP, port: 9444}
localKeyVault: {persistence: {enabled: true}}
# Olympos' own database: the chart's bundled PostgreSQL (default).
postgresql: {size: 1Gi}
olympos:
  devMode: true
  publicURL: http://127.0.0.1:28080
  agentGatewayURL: olympos-gateway.olympos.svc:8443
  bootstrapAdmins: ["00000000-0000-0000-0000-00000000ad01"]
  keyVault: {provider: local, name: lab}
  targetTLS: {caBundleFile: /etc/olympos/target-ca/ca.crt}
  # F18 e2e (M7): agent.offline after 20 s instead of 5 min.
  agents: {offlineAlertAfter: 20s}
  # Native ClickHouse backups (docs/install.md §5): the ingest endpoint on its
  # in-cluster Service olympos-ingest (ClusterIP, :9444), with a certificate
  # from the internal CA. native-ch and restore-native-ch trust that CA.
  ingest: {url: "https://olympos-ingest.olympos.svc:9444"}
extraVolumes:
- name: target-ca
  configMap: {name: target-ca}
extraVolumeMounts:
- {name: target-ca, mountPath: /etc/olympos/target-ca, readOnly: true}
nfsMounts:
- name: lab
  persistentVolumeClaim: {claimName: olympos-backups}
