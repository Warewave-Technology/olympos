name: release

# Tag v*: multi-arch images, binaries/tarballs/.deb/.rpm, SBOMs (SPDX +
# CycloneDX), cosign keyless signatures (GitHub OIDC), SLSA provenance, the
# Helm charts as signed OCI artifacts, and a GitHub release. Verify with the
# commands in docs/install.md "Verifying releases".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # GitHub release
  packages: write      # ghcr.io
  id-token: write      # cosign keyless + provenance
  attestations: write

env:
  REGISTRY: ghcr.io/warewave-technology
  # Keyless signatures go to the public Rekor log (repository, workflow, tag,
  # digests) and GitHub attestations need Enterprise Cloud for private
  # repositories: both run only while the repository is public. SBOMs,
  # checksums and the registry's buildx provenance are produced either way.
  SIGN: ${{ github.event.repository.private && 'false' || 'true' }}

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      # Two architectures of the server image (tools, pg_dump) in the
      # buildx cache; see e2e.yml.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: sigstore/cosign-installer@v3
        if: env.SIGN == 'true'
      - uses: anchore/sbom-action/download-syft@v0
      - name: Build, push, sign, attest
        env: {VERSION: "${{ github.ref_name }}"}
        run: |
          set -euo pipefail
          for c in server agent; do
            img=$REGISTRY/olympos-$c:${VERSION#v}
            docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/$c.Dockerfile \
              --build-arg VERSION=$VERSION --provenance=mode=max --sbom=true -t $img --push .
            digest=$(docker buildx imagetools inspect $img --format '{{json .Manifest}}' | jq -r .digest)
            ref=$REGISTRY/olympos-$c@$digest
            syft $ref -o spdx-json=sbom-$c.spdx.json -o cyclonedx-json=sbom-$c.cdx.json
            if [ "$SIGN" = true ]; then
              cosign sign --yes $ref
              cosign attest --yes --type spdxjson --predicate sbom-$c.spdx.json $ref
              cosign attest --yes --type cyclonedx --predicate sbom-$c.cdx.json $ref
            fi
            echo "$c=$digest" >> digests.txt
          done
      - uses: actions/upload-artifact@v4
        with: {name: image-sboms, path: "sbom-*.json\ndigests.txt"}

  packages:
    runs-on: ubuntu-24.04
    strategy:
      matrix: {arch: [amd64, arm64]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: sigstore/cosign-installer@v3
        if: env.SIGN == 'true'
      - uses: anchore/sbom-action/download-syft@v0
      - name: Binary, tarball, .deb, .rpm (release build)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          ./scripts/package.sh "${GITHUB_REF_NAME#v}" ${{ matrix.arch }}
      - name: SBOMs and signatures
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.deb *.rpm; do
            syft "$f" -o spdx-json="$f.spdx.json" -o cyclonedx-json="$f.cdx.json"
            if [ "$SIGN" = true ]; then cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; fi
          done
          sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS-${{ matrix.arch }}
      - uses: actions/attest-build-provenance@v2
        if: env.SIGN == 'true'
        with: {subject-path: "dist/*.tar.gz\ndist/*.deb\ndist/*.rpm"}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.json
            dist/SHA256SUMS-*

  charts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
        if: env.SIGN == 'true'
      - name: Package, push (OCI), sign
        run: |
          set -euo pipefail
          v=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          [ "$SIGN" != true ] || echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          for c in olympos-server olympos-agent; do
            helm package deploy/helm/$c --version "$v" --app-version "$v" -d charts/
            out=$(helm push charts/$c-$v.tgz oci://$REGISTRY/charts 2>&1); echo "$out"
            digest=$(echo "$out" | awk '/Digest:/ {print $2}')
            [ "$SIGN" != true ] || cosign sign --yes $REGISTRY/charts/$c@$digest
          done

  publish:
    needs: [images, packages, charts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: GitHub release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Verify: docs/install.md#verifying-releases" $prerelease out/*
