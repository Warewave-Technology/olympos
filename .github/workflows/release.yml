name: release

# Tag v*: multi-arch images (olympos-server, -agent, -probe),
# binaries/tarballs/.deb/.rpm, SBOMs (SPDX + CycloneDX), cosign keyless
# signatures (GitHub OIDC), SLSA provenance, the Helm charts as signed OCI
# artifacts, and a GitHub release. Verify with the commands in
# docs/install.md "Verifying releases".
#
# Pull requests and main pushes that touch the release inputs run the same
# jobs as a dry run (version v0.0.0-dryrun): everything is built and checked,
# nothing is pushed, signed or published. A release path that only runs on a
# tag is a release path nobody has tested.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .dockerignore
      - deploy/**
      - scripts/package.sh
      - scripts/fetch-tools.sh
      - scripts/release-notes.sh
      - CHANGELOG.md
      - go.mod
      - go.sum
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .dockerignore
      - deploy/**
      - scripts/package.sh
      - scripts/fetch-tools.sh
      - scripts/release-notes.sh
      - CHANGELOG.md
      - go.mod
      - go.sum
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write      # GitHub release
  packages: write      # ghcr.io
  id-token: write      # cosign keyless + provenance
  attestations: write

env:
  REGISTRY: ghcr.io/warewave-technology
  PUBLISH: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dryrun' }}
  # Keyless signatures go to the public Rekor log (repository, workflow, tag,
  # digests) and GitHub attestations need Enterprise Cloud for private
  # repositories: both run only for a tag of a public repository. SBOMs,
  # checksums and the registry's buildx provenance are produced either way.
  SIGN: ${{ github.ref_type == 'tag' && !github.event.repository.private && 'true' || 'false' }}
  CERT_ID: ^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # A final tag of a release that changes the security model needs an RC of
  # the same version with every such change in it (#60). Fails before
  # anything is built or published; RC tags and dry runs pass through.
  rc-rule:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Security-model changes shipped an RC first
        if: github.ref_type == 'tag'
        run: ./scripts/security-model-paths.sh --check "$GITHUB_REF_NAME"

  images:
    needs: [rc-rule]
    runs-on: ubuntu-24.04
    steps:
      # Two architectures of the server image (tools, pg_dump) in the
      # buildx cache; see e2e.yml.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - uses: anchore/sbom-action/download-syft@v0
        if: env.PUBLISH == 'true'
      - name: Build (both architectures); on a tag push, sign, attest
        run: |
          set -euo pipefail
          for c in server agent probe; do
            img=$REGISTRY/olympos-$c:${VERSION#v}
            out=(--output type=cacheonly)
            [ "$PUBLISH" != true ] || out=(--provenance=mode=max --sbom=true --push)
            docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/$c.Dockerfile \
              --build-arg VERSION=$VERSION -t $img "${out[@]}" .
            [ "$PUBLISH" = true ] || continue
            digest=$(docker buildx imagetools inspect $img --format '{{json .Manifest}}' | jq -r .digest)
            ref=$REGISTRY/olympos-$c@$digest
            syft $ref -o spdx-json=sbom-$c.spdx.json -o cyclonedx-json=sbom-$c.cdx.json
            if [ "$SIGN" = true ]; then
              cosign sign --yes $ref
              cosign attest --yes --type spdxjson --predicate sbom-$c.spdx.json $ref
              cosign attest --yes --type cyclonedx --predicate sbom-$c.cdx.json $ref
              # The commands in docs/install.md must work on what we just made.
              cosign verify $ref --certificate-identity-regexp "$CERT_ID" --certificate-oidc-issuer "$CERT_ISSUER" >/dev/null
            fi
            echo "$c=$digest" >> digests.txt
          done
      # Upstream kube-bench images are not signed: the release copies the
      # digest the agent pins to its own registry and signs it there
      # (docs/install.md › The kube-bench image). The check also fails a dry run
      # when the upstream tag was moved.
      - name: kube-bench; on a tag push, mirror and sign
        run: |
          set -euo pipefail
          scripts/kube-bench-pin.sh check
          [ "$PUBLISH" = true ] || exit 0
          scripts/kube-bench-pin.sh mirror $REGISTRY/kube-bench
          ref=$REGISTRY/kube-bench@$(scripts/kube-bench-pin.sh print | sed 's/.*@//')
          if [ "$SIGN" = true ]; then
            cosign sign --yes $ref
            cosign verify $ref --certificate-identity-regexp "$CERT_ID" --certificate-oidc-issuer "$CERT_ISSUER" >/dev/null
          fi
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with: {name: image-sboms, path: "sbom-*.json\ndigests.txt"}

  packages:
    needs: [rc-rule]
    runs-on: ubuntu-24.04
    strategy:
      matrix: {arch: [amd64, arm64]}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - uses: sigstore/cosign-installer@v3
        if: env.SIGN == 'true'
      - uses: anchore/sbom-action/download-syft@v0
      - name: Binary, tarball, .deb, .rpm (release build)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          ./scripts/package.sh "${VERSION#v}" ${{ matrix.arch }}
      - name: SBOMs, signatures, checksums
        run: |
          set -euo pipefail
          cd dist
          # GitHub turns "~" in asset names into "."; name the files that way
          # now so SHA256SUMS and the signature bundles match the downloads.
          # The version inside the package keeps "~" (pre-releases sort first).
          for f in *~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done
          for f in *.tar.gz *.deb *.rpm; do
            syft "$f" -o spdx-json="$f.spdx.json" -o cyclonedx-json="$f.cdx.json"
            if [ "$SIGN" = true ]; then
              cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
              cosign verify-blob "$f" --bundle "$f.sigstore.json" --certificate-identity-regexp "$CERT_ID" --certificate-oidc-issuer "$CERT_ISSUER"
            fi
          done
          sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS-${{ matrix.arch }}
      - name: Check the artifacts as a user would see them
        run: |
          set -euo pipefail
          cd dist
          v=${VERSION#v}; base=${v%%-*}; pre=""; [ "$base" = "$v" ] || pre=${v#*-}
          want=$base${pre:+~$pre}-1
          sums=SHA256SUMS-${{ matrix.arch }}
          # The command from docs/install.md "Verifying releases", verbatim.
          verify() { grep " $1\$" $sums > check.sha256 && sha256sum -c --strict check.sha256; }
          for f in *.tar.gz *.deb *.rpm; do
            out=$(verify "$f") && [ "$out" = "$f: OK" ] || { echo "documented check does not pass for $f: $out"; exit 1; }
          done
          # ... and fails when it checked nothing: a renamed download, a missing line.
          f=$(ls *.deb); mv "$f" renamed.deb
          if verify "$f" >/dev/null 2>&1; then echo "documented check passed for a missing file"; exit 1; fi
          mv renamed.deb "$f"
          if verify not-in-sums.deb >/dev/null 2>&1; then echo "documented check passed with no matching line"; exit 1; fi
          rm -f check.sha256
          sha256sum -c --strict $sums
          if ls | grep -q '~'; then echo "asset names must not contain ~ (GitHub renames them)"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
          deb=$(dpkg-deb -f *.deb Version); rpmv=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' *.rpm 2>/dev/null)
          [ "$deb" = "$want" ] || { echo "deb version $deb, want $want"; exit 1; }
          [ "$rpmv" = "$want" ] || { echo "rpm version $rpmv, want $want"; exit 1; }
          if [ -n "$pre" ]; then
            dpkg --compare-versions "$deb" lt "$base-1" || { echo "$deb does not sort before $base-1"; exit 1; }
          fi
          echo "packages: version $want, $(wc -l < SHA256SUMS-${{ matrix.arch }}) checksums"
      - uses: actions/attest-build-provenance@v4
        if: env.SIGN == 'true'
        with: {subject-path: "dist/*.tar.gz\ndist/*.deb\ndist/*.rpm"}
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.json
            dist/SHA256SUMS-*

  charts:
    needs: [rc-rule]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
        if: env.SIGN == 'true'
      - name: Release notes (upgrade notes from CHANGELOG.md)
        run: |
          set -euo pipefail
          tag=$VERSION
          # Dry run: the notes the next release (newest CHANGELOG version) would get.
          [ "$PUBLISH" = true ] || tag=v$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          ./scripts/release-notes.sh "$tag" | tee release-notes.md
      - name: Package; on a tag push, push (OCI) and sign
        run: |
          set -euo pipefail
          v=${VERSION#v}
          if [ "$PUBLISH" = true ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
            [ "$SIGN" != true ] || echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi
          for c in olympos-server olympos-agent; do
            helm lint deploy/helm/$c
            helm package deploy/helm/$c --version "$v" --app-version "$v" -d charts/
            [ "$PUBLISH" = true ] || continue
            out=$(helm push charts/$c-$v.tgz oci://$REGISTRY/charts 2>&1); echo "$out"
            digest=$(echo "$out" | awk '/Digest:/ {print $2}')
            if [ "$SIGN" = true ]; then
              cosign sign --yes $REGISTRY/charts/$c@$digest
              cosign verify $REGISTRY/charts/$c@$digest --certificate-identity-regexp "$CERT_ID" --certificate-oidc-issuer "$CERT_ISSUER" >/dev/null
            fi
          done

  publish:
    if: github.ref_type == 'tag'
    needs: [images, packages, charts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {path: out, merge-multiple: true}
      - name: GitHub release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md $prerelease out/*
