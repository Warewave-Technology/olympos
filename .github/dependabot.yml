# Weekly dependency updates (v0.1.0 final checklist C4). Minor and patch
# updates are grouped into one pull request per ecosystem; majors come one by
# one. Security updates are separate and immediate (repository setting).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-minor-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      web-minor-patch: {update-types: [minor, patch]}

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions-minor-patch: {update-types: [minor, patch]}

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly}
    groups:
      docker-minor-patch: {update-types: [minor, patch]}
    # The web build's Node major moves together with CI (setup-node) and
    # CONTRIBUTING, deliberately: Node 25+ images no longer ship corepack.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
