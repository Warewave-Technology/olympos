syntax = "proto3";

package olympos.v1;

option go_package = "github.com/Warewave-Technology/olympos/internal/gen/olympos/v1;olymposv1";

// AgentGateway is served by the Olympos server on :8443. The agent always
// dials out; the server never connects to a cluster.
//
// SECURITY: no message in this file may carry a credential (database
// password, Vault token, SAS token, Blob key, registry credential). This is
// enforced by internal/gateway/proto_test.go.
service AgentGateway {
  // Enroll exchanges a one-time bootstrap token + CSR for a client
  // certificate. Server-TLS only (no client cert yet).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Control is the long-lived control stream, one per agent (mTLS).
  rpc Control(stream AgentMessage) returns (stream ServerMessage);
  // Tunnel carries bytes for exactly one tunnel opened via OpenTunnel or
  // OpenAPIProxy (mTLS). The first agent->server frame carries tunnel_id.
  rpc Tunnel(stream TunnelFrame) returns (stream TunnelFrame);
  // RenewCert issues a fresh client certificate over the authenticated
  // channel (mTLS) for the same cluster identity.
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);
}

message EnrollRequest {
  string bootstrap_token = 1;
  bytes csr_der = 2;
  string agent_version = 3;
}

message EnrollResponse {
  string cluster_id = 1;
  bytes cert_der = 2;
  bytes ca_der = 3;
}

message RenewCertRequest {
  bytes csr_der = 1;
}

message RenewCertResponse {
  bytes cert_der = 1;
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    InventorySnapshot inventory = 2;
    InventoryDiff inventory_diff = 3;
    TargetUpsert target_upsert = 4;
    TargetDelete target_delete = 5;
    ResourceReport report = 6;
    TunnelAccepted tunnel_accepted = 7;
    TunnelRejected tunnel_rejected = 8;
    BenchStatus bench_status = 9;
    BenchResultChunk bench_result = 10;
    Pong pong = 11;
  }
}

message ServerMessage {
  oneof msg {
    OpenTunnel open_tunnel = 1;
    OpenAPIProxy open_api_proxy = 2;
    RunBench run_bench = 3;
    RequestResync resync = 4;
    Ping ping = 5;
  }
}

message Hello {
  string agent_version = 1;
  string cluster_id = 2;
  Capabilities capabilities = 3;
  string provider_override = 4; // Helm providerOverride (e.g. "onprem")
}

message Capabilities {
  bool bench_enabled = 1;
  int32 bench_max_parallel = 2;
  int32 max_tunnels = 3;
  repeated string bench_allowlist = 4;
  bool secrets_inventory = 5; // opt-in Secret inventory (F3)
}

// ---- inventory ----

message Node {
  string name = 1;
  string provider_id = 2;
  string kubelet_version = 3;
  string region = 4;
  string zone = 5;
  string instance_type = 6;
  int64 cpu_capacity_milli = 7;
  int64 mem_capacity_bytes = 8;
  int64 cpu_allocatable_milli = 9;
  int64 mem_allocatable_bytes = 10;
  repeated string roles = 11;
  bool ready = 12;
}

// Generations (F18): the agent numbers every inventory message with a
// monotonically increasing generation. A snapshot replaces the cluster's
// state (mark-and-sweep in one transaction) and sets the generation; each
// later diff/target message must carry exactly the next one, otherwise the
// server ignores it and sends RequestResync. 0 = agent without generations.
message InventorySnapshot {
  string api_version = 1; // kube-apiserver gitVersion
  repeated Node nodes = 2;
  repeated string namespaces = 3;
  repeated Target targets = 4; // full set of discovered targets
  uint64 generation = 5;
}

message InventoryDiff {
  string api_version = 1;
  repeated Node upserted_nodes = 2;
  repeated string deleted_nodes = 3;
  repeated string added_namespaces = 4;
  repeated string deleted_namespaces = 5;
  uint64 generation = 6;
}

// ---- discovery ----

message Target {
  string target_id = 1; // hex(sha256(cluster|ns|svc|port)[:16])
  string namespace = 2;
  string service = 3;
  int32 port = 4;
  string port_name = 5;
  string engine = 6;          // postgresql | clickhouse | vault (from olympos.io/backup)
  string vault_provider = 7;  // hashicorp | openbao (from olympos.io/vault)
  string tls_server_name = 8;
}

message TargetUpsert {
  Target target = 1;
  uint64 generation = 2;
}

message TargetDelete {
  string target_id = 1;
  uint64 generation = 2;
}

// ResourceReport is a full replacement of one resource kind as seen by the
// agent. Partial updates are not supported: the server diffs.
message ResourceReport {
  oneof report {
    KyvernoReport kyverno = 1;
    NetworkPolicyReport network_policies = 2;
    ImageReport images = 3;
    SensitiveDataReport sensitive_data = 4;
    SecretInventoryReport secret_inventory = 5;
  }
}

// ---- opt-in Secret inventory (F3) ----
// Metadata-only: the agent lists Secrets as PartialObjectMetadata and reads
// key names from managedFields. These messages MUST NOT carry a value or
// annotations (kubectl's last-applied-configuration holds the data);
// enforced by proto_test.go.

message ObjectOwner {
  string api_version = 1;
  string kind = 2;
  string name = 3;
}

message K8sSecret {
  string namespace = 1;
  string name = 2;
  string type = 3;                 // inferred (keys, SA annotation, helm label); "" unknown
  repeated string keys = 4;        // key NAMES from managedFields
  bool keys_unknown = 5;           // no managedFields: never read instead
  map<string, string> labels = 6;
  repeated ObjectOwner owners = 7;
  int64 created_unix = 8;
  repeated string referenced_by = 9; // e.g. Deployment/web, ServiceAccount/default (names only)
}

message SecretInventoryReport {
  repeated K8sSecret secrets = 1;
  bool truncated = 2;
}

// ---- sensitive data in ConfigMaps (F2) ----
// Scanned on the agent; values never leave the cluster. These messages MUST
// NOT carry a value, a prefix or suffix of one, or a hash of one: only
// where it is and which rule matched (enforced by proto_test.go).

message SensitiveDataItem {
  string namespace = 1;
  string config_map = 2;
  string key = 3;
  string rule_id = 4;          // gitleaks rule id, or key-name:<word>
  string rule_description = 5;
  string confidence = 6;       // high: matched a credential pattern | medium: key name only
  int64 value_length = 7;      // bytes, rounded up to a power of two (8..4096)
}

message SensitiveDataReport {
  string rules_version = 1;    // gitleaks version + Olympos key-name rules version
  int32 config_maps_scanned = 2;
  repeated SensitiveDataItem items = 3;
}

message KyvernoPolicy {
  string namespace = 1; // empty for cluster-scoped kinds
  string name = 2;
  string mode = 3;      // Enforce | Audit
  repeated string rules = 4;
  bool ready = 5;
  // ClusterPolicy | Policy (kyverno.io/v1, legacy) or ValidatingPolicy |
  // NamespacedValidatingPolicy | ImageValidatingPolicy |
  // NamespacedImageValidatingPolicy (policies.kyverno.io/v1, Kyverno ≥ 1.17).
  string kind = 6;
  // The policy object as JSON: apiVersion, kind, metadata (name, namespace
  // and policies.kyverno.io/* annotations only) and spec. No status,
  // managedFields or other annotations. Empty when spec_omitted.
  bytes object_json = 7;
  // The object was larger than the agent's per-policy cap (or the report's
  // total budget) and was not sent.
  bool spec_omitted = 8;
}

message KyvernoResult {
  string policy = 1;
  string rule = 2;
  string result = 3;    // pass | fail | warn | error | skip
  string severity = 4;
  string message = 5;
  string resource_kind = 6;
  string resource_namespace = 7;
  string resource_name = 8;
}

message KyvernoReport {
  bool installed = 1;
  repeated KyvernoPolicy policies = 2;
  repeated KyvernoResult results = 3;
}

message NetworkPolicy {
  string namespace = 1;
  string name = 2;
  bool selects_all_pods = 3;
  repeated string policy_types = 4;
  int32 ingress_rules = 5;
  int32 egress_rules = 6;
  // networking.k8s.io/v1 NetworkPolicySpec as JSON (empty when larger than
  // the agent's cap).
  bytes spec_json = 7;
}

// NamespaceLabels are a namespace's labels (namespaceSelector examples).
message NamespaceLabels {
  string name = 1;
  map<string, string> labels = 2;
}

// Workload is a Deployment, StatefulSet or DaemonSet with its pod template
// labels and container ports (podSelector examples). Nothing else from the
// workload spec is sent.
message Workload {
  string namespace = 1;
  string kind = 2;
  string name = 3;
  map<string, string> labels = 4;
  repeated int32 ports = 5;
}

message NetworkPolicyReport {
  repeated string namespaces = 1;
  repeated NetworkPolicy policies = 2;
  repeated NamespaceLabels namespace_labels = 3;
  // At most ~50 per namespace.
  repeated Workload workloads = 4;
}

message ImageUse {
  string image = 1;    // image string from spec (repo:tag)
  string digest = 2;   // sha256:... from status.containerStatuses[].imageID
  string namespace = 3;
  string workload_kind = 4;
  string workload_name = 5;
  string container = 6;
}

message ImageReport {
  repeated ImageUse uses = 1;
}

// ---- tunnels ----

message OpenTunnel {
  string tunnel_id = 1;
  string target_id = 2; // never host:port
  bool compressed = 3;  // transfer mode "compressed": zstd frames
}

message OpenAPIProxy {
  string tunnel_id = 1;
}

message TunnelAccepted {
  string tunnel_id = 1;
}

message TunnelRejected {
  string tunnel_id = 1;
  string reason = 2;
}

message TunnelFrame {
  string tunnel_id = 1;
  bytes data = 2;
  bool close = 3;
}

// ---- kube-bench ----

message RunBench {
  string run_id = 1;
  string node_name = 2;
  string benchmark = 3;
}

message BenchStatus {
  string run_id = 1;
  string node_name = 2;
  string state = 3; // accepted | rejected | running | succeeded | failed
  string message = 4;
}

// Result-bearing messages are buffered by the agent while disconnected and
// re-sent after reconnect; seq (1-based per run and node) lets the server
// drop duplicates and detect lost chunks. 0 = agent without seq.
message BenchResultChunk {
  string run_id = 1;
  string node_name = 2;
  bytes data = 3;
  bool last = 4;
  uint32 seq = 5;
}

message RequestResync {}

message Ping {
  int64 unix_nano = 1;
}

message Pong {
  int64 unix_nano = 1;
}
