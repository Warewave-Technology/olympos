# Local development config. NEVER use in production.
olympos:
  devMode: true
  publicURL: http://localhost:8080
  agentGatewayURL: localhost:8443
  bootstrapAdmins:
    - 00000000-0000-0000-0000-00000000ad01   # sign in via /auth/dev-login?oid=00000000-0000-0000-0000-00000000ad01&name=Dev%20Admin
  keyVault:
    provider: local
    name: local
    localDir: ./tmp/localkv
  database:
    dsn: postgres://olympos:olympos@127.0.0.1:55432/olympos_dev?sslmode=disable
  listen:
    http: 127.0.0.1:8080
    gateway: 127.0.0.1:8443
    metrics: 127.0.0.1:9090
