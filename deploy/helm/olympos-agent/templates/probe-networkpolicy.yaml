{{- $np := (.Values.probe | default dict).networkPolicy | default dict }}
{{- $cidrs := $np.egressCIDRs | default list }}
{{- if and (eq (include "olympos-probe.enabled" .) "true") $cidrs }}
{{- /* probe.networkPolicy.dns; these fallbacks equal the values.yaml defaults (old values have none). */}}
{{- $dnsSet := $np.dns | default dict }}
{{- $nsSel := $dnsSet.namespaceSelector | default (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")) }}
{{- $podSel := $dnsSet.podSelector | default (dict "matchLabels" (dict "k8s-app" "kube-dns")) }}
{{- $ports := $dnsSet.ports | default (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) }}
# Opt-in (probe.networkPolicy.egressCIDRs): the probe may reach only these
# CIDRs and the cluster DNS (probe.networkPolicy.dns, kube-dns by default).
# The host allowlist in Olympos applies either way; this adds the same limit
# at the network level.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: olympos-probe
  namespace: {{ .Release.Namespace }}
  labels: {{- include "olympos-probe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "olympos-probe.selector" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
  - to:
    {{- range $cidrs }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
  - to:
    - namespaceSelector: {{- toYaml $nsSel | nindent 8 }}
      podSelector: {{- toYaml $podSel | nindent 8 }}
    ports: {{- toYaml $ports | nindent 4 }}
{{- end }}
