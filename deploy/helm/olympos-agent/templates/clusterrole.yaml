# SPEC §4.2 — MUST be exactly these rules (golden-file tested), plus the
# read-only extras kubescape needs. No secrets (unless the opt-in Secret
# inventory is on: list/watch, never get), no write verbs, no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olympos-agent-{{ .Release.Namespace }}
  labels: {{- include "olympos-agent.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [nodes, namespaces, services, endpoints, pods]
  verbs: [get, list, watch]
- apiGroups: ["discovery.k8s.io"]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: ["apps"]
  resources: [deployments, statefulsets, daemonsets, replicasets]
  verbs: [get, list, watch]
- apiGroups: ["networking.k8s.io"]
  resources: [networkpolicies]
  verbs: [get, list, watch]
- apiGroups: ["kyverno.io"]
  resources: [clusterpolicies, policies]
  verbs: [get, list, watch]
- apiGroups: ["policies.kyverno.io"]
  resources: [validatingpolicies, namespacedvalidatingpolicies, imagevalidatingpolicies, namespacedimagevalidatingpolicies]
  verbs: [get, list, watch]
- apiGroups: ["wgpolicyk8s.io"]
  resources: [policyreports, clusterpolicyreports]
  verbs: [get, list, watch]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: [roles, rolebindings, clusterroles, clusterrolebindings]
  verbs: [get, list, watch]
# Read-only extras for kubescape/polaris and workload ownership (§4.2 note).
# ConfigMaps are read-only (polaris lists them; §4.2 forbids only writes).
- apiGroups: [""]
  resources: [configmaps, serviceaccounts, limitranges, resourcequotas, persistentvolumes, persistentvolumeclaims, replicationcontrollers]
  verbs: [get, list, watch]
- apiGroups: ["batch"]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
- apiGroups: ["networking.k8s.io"]
  resources: [ingresses]
  verbs: [get, list, watch]
- apiGroups: ["policy"]
  resources: [poddisruptionbudgets, podsecuritypolicies]
  verbs: [get, list, watch]
- apiGroups: ["autoscaling"]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
  verbs: [get, list, watch]
- apiGroups: ["apiextensions.k8s.io"]
  resources: [customresourcedefinitions]
  verbs: [get, list, watch]
{{- if .Values.secretsInventory.enabled }}
# Opt-in Secret inventory (F3): the agent only makes metadata-only requests
# (PartialObjectMetadata) and reads key names from managedFields. RBAC has no
# "metadata only" verb: this token could read values with a normal request,
# which is why the feature is off by default (docs/security-model.md).
- apiGroups: [""]
  resources: [secrets]
  verbs: [list, watch]
{{- end }}
- nonResourceURLs: ["/version", "/version/", "/api", "/api/*", "/apis", "/apis/*", "/openapi/*"]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olympos-agent-{{ .Release.Namespace }}
  labels: {{- include "olympos-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: olympos-agent-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: olympos-agent
  namespace: {{ .Release.Namespace }}
