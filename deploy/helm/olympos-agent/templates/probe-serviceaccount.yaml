{{- if eq (include "olympos-probe.enabled" .) "true" }}
# The probe never talks to the Kubernetes API (synthetic monitoring §2.1):
# no RoleBinding or ClusterRoleBinding names this ServiceAccount, and no
# token is mounted (here and on the pod). chart_test.go checks both.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: olympos-probe
  namespace: {{ .Release.Namespace }}
  labels: {{- include "olympos-probe.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
