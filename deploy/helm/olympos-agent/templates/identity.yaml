# The Secrets the agent may read/write (SPEC §4.4): its own identity and,
# with the probe enabled, the probe's (probe-identity.yaml), which it keeps
# for the probe. Existing data (enrolled cert/key) is preserved across upgrades.
# With identity.manageSecrets=false (Argo CD, Flux: helm template cannot look
# up) the chart renders neither Secret: they are created once on the cluster
# with the bootstrap token (docs/install.md, #59).
{{- if eq (include "olympos-agent.manageSecrets" .) "true" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "olympos-agent-identity" }}
apiVersion: v1
kind: Secret
metadata:
  name: olympos-agent-identity
  namespace: {{ .Release.Namespace }}
  labels: {{- include "olympos-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") }}
data: {{- toYaml $existing.data | nindent 2 }}
{{- else }}
stringData:
  bootstrap-token: {{ required "bootstrapToken is required on first install" .Values.bootstrapToken | quote }}
{{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: olympos-agent-identity
  namespace: {{ .Release.Namespace }}
  labels: {{- include "olympos-agent.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [secrets]
  {{- if eq (include "olympos-probe.enabled" .) "true" }}
  resourceNames: [olympos-agent-identity, olympos-probe-identity]
  {{- else }}
  resourceNames: [olympos-agent-identity]
  {{- end }}
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: olympos-agent-identity
  namespace: {{ .Release.Namespace }}
  labels: {{- include "olympos-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: olympos-agent-identity
subjects:
- kind: ServiceAccount
  name: olympos-agent
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olympos-agent-ca
  namespace: {{ .Release.Namespace }}
  labels: {{- include "olympos-agent.labels" . | nindent 4 }}
data:
  ca.crt: |
{{ required "serverCA is required" .Values.serverCA | b64dec | indent 4 }}
