# Agent gateway address (host:port). Generated by Olympos "Add cluster".
server: ""
# One-time bootstrap token (TTL 1 h). Only used on first install.
bootstrapToken: ""
# Base64-encoded PEM of the Olympos internal CA (pins the server).
serverCA: ""
# TLS server name override (defaults to the host of `server`).
serverName: ""
clusterName: ""
# Set for on-prem clusters: "onprem" (or azure/aws/gcp/oracle/huawei).
providerOverride: ""

image:
  repository: ghcr.io/warewave-technology/olympos-agent
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # prefer pinning by digest
  pullPolicy: IfNotPresent
imagePullSecrets: []

maxTunnels: 16

# Label the release namespace PSA "restricted" (set true when Helm should own it).
manageNamespace: false

# Credentials in ConfigMaps (F2): values are scanned on the agent with the
# gitleaks rules and never leave the cluster; only where a match is and the
# rule are reported (Security › Sensitive data). Globs, same defaults as the
# server's security.systemNamespaces.
sensitiveData:
  enabled: true
  excludeNamespaces: [kube-system, kube-public, kube-node-lease, olympos-system, olympos-bench]

bench:
  # kube-bench exception (SPEC §12.3). Renders the olympos-bench namespace,
  # its RBAC and the Kyverno PolicyException only when true.
  enabled: false
  maxParallel: 3
  namespace: olympos-bench
  # Image is pinned by digest inside the agent binary; this is used only for
  # the Kyverno PolicyException image match.
  imagePattern: "docker.io/aquasec/kube-bench:*@sha256:*"
  # Kyverno exceptions for the kube-bench pods (only needed when Kyverno
  # policies would block them in the olympos-bench namespace).
  kyverno:
    # Kyverno ≤ 1.19 with legacy kyverno.io policies: a kyverno.io/v2
    # PolicyException for all policies. Kyverno 1.20 rejects this kind.
    legacyException: false
    # Kyverno ≥ 1.17 CEL policies: policies.kyverno.io/v1 exceptions must
    # name each policy, e.g. [{name: require-run-as-nonroot, kind: ValidatingPolicy}].
    policyRefs: []

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
