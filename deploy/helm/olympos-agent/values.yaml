# Agent gateway address (host:port). Generated by Olympos "Add cluster".
server: ""
# One-time bootstrap token (TTL 1 h). Only used on first install.
bootstrapToken: ""
# Base64-encoded PEM of the Olympos internal CA (pins the server).
serverCA: ""
# TLS server name override (defaults to the host of `server`).
serverName: ""
clusterName: ""
# Set for on-prem clusters: "onprem" (or azure/aws/gcp/oracle/huawei).
providerOverride: ""

image:
  repository: ghcr.io/warewave-technology/olympos-agent
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # prefer pinning by digest
  pullPolicy: IfNotPresent
imagePullSecrets: []

maxTunnels: 16

# Label the release namespace PSA "restricted" (set true when Helm should own it).
manageNamespace: false

# Credentials in ConfigMaps (F2): values are scanned on the agent with the
# gitleaks rules and never leave the cluster; only where a match is and the
# rule are reported (Security › Sensitive data). Globs, same defaults as the
# server's security.systemNamespaces.
sensitiveData:
  enabled: true
  excludeNamespaces: [kube-system, kube-public, kube-node-lease, olympos-system, olympos-bench]

# Opt-in Secret inventory (F3): lists Secrets with their KEY NAMES only
# (metadata-only requests; key names from managedFields; values never
# requested). Kubernetes RBAC has no "metadata only" permission: enabling
# this grants list/watch on secrets, and a stolen agent token could read
# values with a normal request. Off by default.
secretsInventory:
  enabled: false

bench:
  # kube-bench exception (SPEC §12.3). Renders the olympos-bench namespace,
  # its RBAC and the Kyverno PolicyException only when true.
  enabled: false
  maxParallel: 3
  namespace: olympos-bench
  # The kube-bench image is pinned by digest inside the agent binary.
  # imageRepository pulls that same digest from a mirror instead of Docker
  # Hub: ghcr.io/warewave-technology/kube-bench (copied and signed by each
  # Olympos release) or your own copy. A repository only, no tag or digest.
  imageRepository: ""
  # Image match of the legacy Kyverno PolicyException; "" follows
  # imageRepository (<repository>:*@sha256:*).
  imagePattern: ""
  # Kyverno exceptions for the kube-bench pods (only needed when Kyverno
  # policies would block them in the olympos-bench namespace).
  kyverno:
    # Kyverno ≤ 1.19 with legacy kyverno.io policies: a kyverno.io/v2
    # PolicyException for all policies. Kyverno 1.20 rejects this kind.
    legacyException: false
    # Kyverno ≥ 1.17 CEL policies: policies.kyverno.io/v1 exceptions must
    # name each policy, e.g. [{name: require-run-as-nonroot, kind: ValidatingPolicy}].
    policyRefs: []

probe:
  # olympos-probe runs synthetic monitoring scenarios from inside the cluster
  # (docs/design/synthetic-monitoring.md). It dials out to the same gateway
  # as the agent, has no RBAC and no Kubernetes API token: the agent keeps
  # its identity in the Secret olympos-probe-identity. false opts out (the
  # cluster shows "Probe: not installed" and scenarios skip it).
  enabled: true
  # Runs are idempotent by run id; more replicas share the runs.
  replicas: 1
  image:
    repository: ghcr.io/warewave-technology/olympos-probe
    tag: ""          # defaults to .Chart.AppVersion
    digest: ""       # prefer pinning by digest
    pullPolicy: IfNotPresent
  # One-time probe token from Olympos "Install probe" (existing clusters).
  # The chart writes it into olympos-probe-identity, keeping the identity
  # there, and the agent enrolls the probe with it. A new cluster needs none:
  # the agent enrolls the probe with bootstrapToken. Without either, the
  # upgrade succeeds and the probe waits for an identity.
  bootstrapToken: ""
  # Runs this replica runs at once (OLYMPOS_PROBE_MAX_CONCURRENCY, 1-1000).
  maxConcurrency: 20
  networkPolicy:
    # Non-empty: a NetworkPolicy lets the probe reach only these CIDRs (and
    # the cluster DNS, below). Include the Olympos gateway (`server`) and every
    # allowlisted host; the allowlist in Olympos still applies.
    egressCIDRs: []
    # The cluster DNS the policy allows (the probe asks the nameserver in
    # the pod's resolv.conf). Unset or empty fields keep the defaults:
    #   namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    #   podSelector: {matchLabels: {k8s-app: kube-dns}}
    #   ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # A field you set replaces its default as a whole (the defaults are not
    # here because Helm would merge your labels into them). OpenShift:
    #   namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-dns}}
    #   podSelector: {matchLabels: {dns.operator.openshift.io/daemonset-dns: default}}
    #   ports: [{protocol: UDP, port: 5353}, {protocol: TCP, port: 5353}]
    # NodeLocal DNSCache answers on the node, not in a kube-dns pod: add the
    # nameserver address of the pod's resolv.conf to egressCIDRs (169.254.20.10/32,
    # or the kube-dns Service IP when the cache listens on it).
    dns:
      namespaceSelector: {}
      podSelector: {}
      ports: []
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
