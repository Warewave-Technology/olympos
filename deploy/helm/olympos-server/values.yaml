image:
  repository: ghcr.io/warewave-technology/olympos-server
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# v0.1 runs as a single replica: tunnels open only on the replica an agent
# is connected to. Availability comes from Kubernetes restarting the pod;
# agents reconnect automatically. Values > 1 fail unless
# experimental.multiReplica is true (not supported, planned for v0.2).
replicas: 1
experimental:
  multiReplica: false

# Rendered verbatim into config.yaml under `olympos:` (SPEC §2.1).
olympos:
  publicURL: https://olympos.contoso.internal
  agentGatewayURL: olympos-gw.contoso.internal:8443
  devMode: false
  entra:
    tenantID: ""
    clientID: ""
    clientSecretRef: ""        # kv://<vault>/<secret>
  bootstrapAdmins: []          # Entra object IDs; used only while the grants table is empty
  keyVault:
    provider: azure
    name: ""
    kekName: olympos-kek
    hmacSecretName: olympos-hmac
    managedIdentityClientID: ""
  database:
    # Used only with postgresql.bundled=false (external PostgreSQL, e.g.
    # Azure Database for PostgreSQL): kv://<vault>/olympos-db-dsn.
    dsnRef: ""
  slack:
    botTokenRef: ""
  deadMansSwitch:
    url: ""
  backup:
    globalConcurrency: 4
    perClusterConcurrency: 2
  changeRequests:
    ttl: 72h
  # The S3 endpoint native ClickHouse backups write to (docs/configuration.md).
  # Off until `url` is set: only then the chart opens the port, the Service,
  # the spill volume and the certificate mount.
  ingest:
    # How ClickHouse reaches the endpoint, e.g.
    # https://<release>-ingest.<namespace>.svc:9444 (the in-cluster Service).
    url: ""
    maxRuns: 4            # native runs at once; sizes the spill volume
    maxRunDuration: 6h
    maxRunBytes: 0        # bytes one run may write; 0 = automatic (docs/configuration.md)

# Olympos' own database. bundled: a single-instance PostgreSQL 16 in the
# same namespace (PVC, NetworkPolicy allowing only the server, generated
# password in a Secret kept across upgrades). Set bundled=false and
# olympos.database.dsnRef for an external database. Back the database up
# with the built-in olympos-self job (Backups) and see docs/restore-olympos.md.
postgresql:
  bundled: true
  # The bundled database's password. Empty: the chart generates one and keeps
  # it across upgrades with Helm's lookup. Argo CD, Flux and other tools that
  # render with helm template cannot look up and would change it on every
  # sync: create a Secret with the key `password` and name it here
  # (docs/install.md, "Install with Argo CD or Flux").
  existingSecret: ""
  image: docker.io/library/postgres:16.11-bookworm@sha256:a2420e9555e2224583fe84d0bb3f0b967e69354ae3a0be55a9c14e251388c4eb
  size: 8Gi
  storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}

# Azure Workload Identity: annotate the ServiceAccount with the MI client ID.
workloadIdentity:
  enabled: true
  clientID: ""

service:
  type: ClusterIP
  port: 80
  nodePort: null
gatewayService:
  # Agents dial this endpoint (mTLS). Usually an internal LoadBalancer.
  type: LoadBalancer
  port: 8443
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  nodePort: null
ingestService:
  # ClickHouse pods dial this endpoint (HTTPS, SigV4 per run). In-cluster by
  # default; use an internal LoadBalancer for ClickHouse outside the cluster.
  type: ClusterIP
  port: 9444
  annotations: {}
  nodePort: null
ingress:
  enabled: false
  className: ""
  host: olympos.contoso.internal
  tlsSecretName: ""
  annotations: {}

# Optional externally issued gateway certificate (kubernetes.io/tls Secret).
gatewayTLSSecret: ""

# Optional externally issued ingest certificate (kubernetes.io/tls Secret).
# Without it the internal CA issues one for the host of olympos.ingest.url:
# ClickHouse then has to trust the internal CA.
ingestTLSSecret: ""

# Dev/lab only: persistent directory for keyVault.provider=local.
localKeyVault:
  persistence:
    enabled: false
    size: 64Mi
    storageClass: ""

# trivy vulnerability + Java DBs (several GiB, growing). Keep it on a PVC:
# an emptyDir over its sizeLimit gets the whole server pod evicted.
trivyCache:
  size: 10Gi
  storageClass: ""
  persistent: true

resources:
  requests: {cpu: 200m, memory: 256Mi}
  limits: {memory: 1Gi}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
# Volumes for NFS backup destinations, mounted at /var/lib/olympos/nfs/<name>.
# Any Kubernetes volume source works, e.g.
#   - name: backup-nas
#     nfs: {server: nas.contoso.internal, path: /exports/olympos}
#   - name: lab
#     persistentVolumeClaim: {claimName: olympos-backups}
# Retention/WORM must be enforced by the storage (Olympos can delete there).
nfsMounts: []

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
