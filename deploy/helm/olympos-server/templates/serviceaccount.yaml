apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "olympos-server.labels" . | nindent 4 }}
  {{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.clientID }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientID | quote }}
  {{- end }}
# The server needs no Kubernetes API access in its own cluster.
automountServiceAccountToken: false
