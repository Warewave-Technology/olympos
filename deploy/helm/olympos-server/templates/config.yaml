apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "olympos-server.labels" . | nindent 4 }}
data:
  config.yaml: |
    olympos:
{{- $o := deepCopy .Values.olympos }}
{{- if .Values.postgresql.bundled }}
{{- if or .Values.olympos.database.dsnRef .Values.olympos.database.dsn }}
{{- fail "postgresql.bundled=true and olympos.database.dsn/dsnRef are both set: set postgresql.bundled=false to use an external database" }}
{{- end }}
{{- $_ := set $o "database" (dict "dsn" (printf "postgres://olympos@%s-postgresql.%s.svc:5432/olympos?sslmode=disable" .Release.Name .Release.Namespace) "passwordFile" "/etc/olympos/db/password") }}
{{- end }}
{{ toYaml $o | indent 6 }}
      experimental:
        multiReplica: {{ .Values.experimental.multiReplica }}
      listen:
        http: ":8080"
        gateway: ":8443"
        metrics: ":9090"
      {{- if .Values.gatewayTLSSecret }}
      gateway:
        tlsCertFile: /etc/olympos/gateway-tls/tls.crt
        tlsKeyFile: /etc/olympos/gateway-tls/tls.key
      {{- end }}
