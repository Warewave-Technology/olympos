apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "olympos-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "olympos-server.selector" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    {{- if .Values.service.nodePort }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {{- include "olympos-server.labels" . | nindent 4 }}
  {{- with .Values.gatewayService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gatewayService.type }}
  selector: {{- include "olympos-server.selector" . | nindent 4 }}
  ports:
  - name: gateway
    port: {{ .Values.gatewayService.port }}
    targetPort: gateway
    {{- if .Values.gatewayService.nodePort }}
    nodePort: {{ .Values.gatewayService.nodePort }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-metrics
  labels: {{- include "olympos-server.labels" . | nindent 4 }}
spec:
  selector: {{- include "olympos-server.selector" . | nindent 4 }}
  ports:
  - {name: metrics, port: 9090, targetPort: metrics}
