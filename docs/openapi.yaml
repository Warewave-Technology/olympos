openapi: 3.1.0
info:
  title: Olympos API
  version: "1.0"
  description: |
    REST API of the Olympos server (SPEC §16). JSON only.

    **Auth**: BFF session. The SPA never sees tokens. `GET /auth/login?return_to=/path` starts Entra sign-in;
    the server sets `olympos_session` (HttpOnly) and `olympos_csrf` (readable) cookies. Every state-changing
    request (POST/PUT/PATCH/DELETE) MUST send header `X-CSRF-Token: <olympos_csrf cookie>`. `POST /auth/logout` ends the session.
    In dev mode `GET /auth/dev-login?oid=<object-id>&name=&upn=` signs in a principal.

    **Errors**: `{"error": "...", "fields": {"name": "..."}}`. 401 = not signed in / session expired (SPA redirects to /login),
    403 = visible object but role does not allow, 404 = missing or outside the caller's scope (never 403), 409 = conflict,
    422 = validation (`fields` per input).

    **Lists** return `{"items": [...]}`. Times are RFC 3339. Sizes in bytes. CPU in millicores.

    **Secret values are never returned** by any endpoint. Write-only fields are marked `writeOnly`.
servers:
  - url: /api/v1
tags:
  - {name: identity}
  - {name: clusters}
  - {name: notifications}
  - {name: backups}
  - {name: vaults}
  - {name: approvals}
  - {name: audit}
  - {name: security}
  - {name: activity}
  - {name: synthetic}

paths:
  /me:
    get:
      tags: [identity]
      responses:
        "200": {description: Current user, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}

  /dashboard:
    get:
      tags: [clusters]
      responses:
        "200": {description: Fleet overview, content: {application/json: {schema: {$ref: "#/components/schemas/Dashboard"}}}}

  /clusters:
    get:
      tags: [clusters]
      responses:
        "200": {description: Clusters in scope, content: {application/json: {schema: {$ref: "#/components/schemas/ClusterList"}}}}
    post:
      tags: [clusters]
      summary: Add cluster (admin, scope all). Returns the one-time Helm install command (token TTL 1 h).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"}
                labels: {type: object, additionalProperties: {type: string}}
                bench_enabled: {type: boolean}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/InstallResponse"}}}}
  /clusters/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [clusters]
      responses:
        "200": {description: Cluster, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}
    patch:
      tags: [clusters]
      summary: Update labels, provider override, transfer mode, egress rate (admin, scope all).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                labels: {type: object, additionalProperties: {type: string}}
                provider_override: {type: string, enum: ["", azure, aws, gcp, oracle, huawei, onprem]}
                transfer_mode: {type: string, enum: [e2e-tls, compressed]}
                egress_rate_per_gb: {type: number, minimum: 0}
                clear_egress_rate: {type: boolean}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}
    delete:
      tags: [clusters]
      summary: Revoke the cluster (cert serial denied, streams dropped). Irreversible.
      responses:
        "204": {description: Revoked}
  /clusters/{id}/token:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [clusters]
      summary: Issue a fresh bootstrap token / install command (invalidates unused ones).
      responses:
        "200": {description: Install command, content: {application/json: {schema: {$ref: "#/components/schemas/InstallResponse"}}}}
  /clusters/{id}/probe-token:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [clusters]
      summary: >-
        "Install probe" for a cluster whose agent runs without the probe (admin, scope all): a one-time probe-only
        token (1 h) and the command `helm upgrade olympos-agent <chart> -n olympos-system --reuse-values [--set
        <k=v> for each of the server's OLYMPOS_AGENT_INSTALL_SETS] --set probe.enabled=true --set
        probe.bootstrapToken=<token>`. The agent enrolls the probe with it. Earlier
        tokens lose their unused probe role (an install token keeps its agent role).
      responses:
        "200": {description: Install command, content: {application/json: {schema: {$ref: "#/components/schemas/InstallResponse"}}}}
        "409": {description: "The cluster is revoked, or still pending: its add cluster command already installs the probe (ruling P24)"}
  /clusters/{id}/probe:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [clusters]
      summary: >-
        Revoke the probe alone (admin on the cluster): its certificates are denied, its streams dropped, the
        unused probe roles of the cluster's tokens withdrawn. The agent is untouched; "Install probe" enrolls a
        new one.
      responses:
        "204": {description: Revoked}
        "409": {description: "The cluster is revoked, or it has no probe (\"no probe installed\"; nothing changes)"}
  /clusters/{id}/nodes:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [clusters]
      responses:
        "200":
          description: Nodes
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Node"}}}}}}
  /targets:
    get:
      tags: [clusters]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [candidate, configured, gone]}}
        - {name: engine, in: query, schema: {type: string, enum: [postgresql, clickhouse, vault]}}
      responses:
        "200":
          description: Discovered targets
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Target"}}}}}}

  /targets/{id}/accept-tls-name:
    parameters: [{name: id, in: path, required: true, schema: {type: string}, description: Target id}]
    post:
      tags: [clusters]
      summary: >-
        Accept a changed olympos.io/tls-server-name as the verified TLS name (admin on the target's cluster).
        name must be the pending name the caller reviewed.
      requestBody:
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}
      responses:
        "204": {description: Accepted}
        "409": {description: The name changed again; reload and review it}

  # ------------------------------------------------------------ access
  /grants:
    get:
      tags: [identity]
      responses:
        "200":
          description: Active grants
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Grant"}}}}}}
    post:
      tags: [identity]
      summary: Grant roles to a person by Entra object ID (admin, scope all). vault-approver, admin and synthetic-editor refused for guests (422).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [object_id, roles]
              properties:
                object_id: {type: string, format: uuid}
                roles: {type: array, items: {$ref: "#/components/schemas/Role"}}
                scope: {type: string, description: '"all" or a label selector over cluster labels, e.g. "env=prod,team in (a,b)"'}
      responses:
        "201": {description: Created, content: {application/json: {schema: {type: object, properties: {ids: {type: array, items: {type: string}}}}}}}
  /grants/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [identity]
      responses:
        "204": {description: Revoked}
        "409": {description: Last admin with scope all}
  /principals/search:
    get:
      tags: [identity]
      summary: Directory (Graph) lookup, min 2 chars.
      parameters: [{name: q, in: query, required: true, schema: {type: string}}]
      responses:
        "200":
          description: People
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/DirectoryUser"}}}}}}

  # ------------------------------------------------------------ notifications (M2)
  /notifications/channels:
    get:
      tags: [notifications]
      responses:
        "200":
          description: Channels
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Channel"}}}}}}
    post:
      tags: [notifications]
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ChannelInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
  /notifications/channels/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [notifications]
      responses:
        "200": {description: Channel, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
    patch:
      tags: [notifications]
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ChannelInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
    delete:
      tags: [notifications]
      responses:
        "204": {description: Deleted (routes to it are removed)}
        "409": {description: Used as override channel by backup jobs or audit schedules}
  /notifications/channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [notifications]
      summary: Send a test message to the channel now.
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string}}}}}}
  /notifications/routes:
    get:
      tags: [notifications]
      responses:
        "200": {description: Event catalog and routing, content: {application/json: {schema: {$ref: "#/components/schemas/Routes"}}}}
    put:
      tags: [notifications]
      summary: Replace all routes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                routes: {type: array, items: {$ref: "#/components/schemas/Route"}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/Routes"}}}}

  # ------------------------------------------------------------ destinations (M2)
  /destinations:
    get:
      tags: [backups]
      responses:
        "200":
          description: Destinations
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Destination"}}}}}}
    post:
      tags: [backups]
      summary: Create destination (admin, scope all). Runs the destination test first; 422 if the test fails. A credential that can delete is saved with a warning (never silently).
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationInput"}}}}
      responses:
        "201": {description: Created (check `warnings`), content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}
        "409": {description: Name already used}
        "422": {description: Invalid input (fields) or destination test failed (test), content: {application/json: {schema: {$ref: "#/components/schemas/DestinationTestFailed"}}}}
  /destinations/mounts:
    get:
      tags: [backups]
      summary: Volumes mounted into the server that NFS destinations may use.
      responses:
        "200":
          description: Mounts
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/DestinationMount"}}}}}}
  /destinations/test:
    post:
      tags: [backups]
      summary: Test an unsaved destination (probe write, read, tag, delete-refused check, SAS parse).
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationInput"}}}}
      responses:
        "200": {description: Report, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationTest"}}}}
  /destinations/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [backups]
      responses:
        "200": {description: Destination, content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}
    patch:
      tags: [backups]
      summary: Partial update (absent fields keep their value; omit `sas` to keep the current SAS). Re-runs the destination test like create.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationInput"}}}}
      responses:
        "200": {description: Updated (check `warnings`), content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}
        "409": {description: Name already used}
        "422":
          description: "Invalid input (`fields`), destination test failed (`test`), or the new location is already used by another member of a group this destination is in (`fields`, keyed by the changed location field: path, bucket, account, container, endpoint_override or prefix)."
          content: {application/json: {schema: {oneOf: [{$ref: "#/components/schemas/DestinationTestFailed"}, {$ref: "#/components/schemas/FieldErrors"}]}}}
    delete:
      tags: [backups]
      responses:
        "204": {description: Deleted}
        "409": {description: "Used by backup jobs, a member of a destination group, or holds copies of backup runs (`copies` > 0): such a destination is kept so the restore commands of those runs stay valid."}
  /destinations/{id}/test:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [backups]
      responses:
        "200": {description: Report, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationTest"}}}}

  /destination-groups:
    get:
      tags: [backups]
      summary: Destination groups (readable by any role, like destinations). Members are in position order; `jobs` is only a count.
      responses:
        "200":
          description: Destination groups
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/DestinationGroup"}}}}}}
    post:
      tags: [backups]
      summary: Create a destination group (admin, scope all). A backup job that targets a group writes one dump to every member. 2 to 4 distinct destinations, any mix of kinds; two members must not write to the same location.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationGroupInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationGroup"}}}}
        "403": {description: Not an admin with scope all}
        "422": {description: "Invalid input (fields: name, description, member_ids)"}
  /destination-groups/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [backups]
      responses:
        "200": {description: Destination group, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationGroup"}}}}
        "404": {description: Unknown group}
    patch:
      tags: [backups]
      summary: Partial update (absent fields keep their value). `member_ids` replaces the member list and its order; existing backups are not copied to an added destination, and nothing is deleted from a removed one.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationGroupInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationGroup"}}}}
        "422": {description: "Invalid input (fields: name, description, member_ids)"}
    delete:
      tags: [backups]
      responses:
        "204": {description: Deleted (the member destinations stay)}
        "409": {description: Used by backup jobs}

  # ------------------------------------------------------------ backups (M2)
  /backup/jobs:
    get:
      tags: [backups]
      parameters:
        - {name: target_id, in: query, schema: {type: string}}
      responses:
        "200":
          description: Jobs in scope
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/BackupJob"}}}}}}
    post:
      tags: [backups]
      summary: Create a job (operator on the target's cluster; 404 when the target is outside the caller's scope). Usually created disabled, then dry-run, then enabled. Sets the target to `configured`.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/BackupJobInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/BackupJob"}}}}
        "422": {description: "Validation (cron, timezone, credential.*, destination_id, destination_group_id, ...). Exactly one of destination_id and destination_group_id is required: destination_id gets \"choose a destination or a destination group\" for both or neither."}
  /backup/jobs/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [backups]
      responses:
        "200": {description: Job, content: {application/json: {schema: {$ref: "#/components/schemas/BackupJob"}}}}
    patch:
      tags: [backups]
      summary: Partial update. target_id cannot change. A new credential replaces (and deletes) the old one. Enabling or changing the schedule restarts it from now.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/BackupJobInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/BackupJob"}}}}
    delete:
      tags: [backups]
      summary: Delete the job (soft delete; runs and blobs are kept, the job's credential is removed, queued runs fail).
      responses: {"204": {description: Deleted}}
  /backup/jobs/{id}/run:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [backups]
      summary: Queue a manual run, or a dry run with trigger=test (small test backup, e.g. schema-only for Postgres).
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {trigger: {type: string, enum: [manual, test], default: manual}}}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {$ref: "#/components/schemas/BackupRun"}}}}
        "409": {description: "A run of this job is already queued or running, or the target is gone. A repair waiting for its not_before does not count."}
  /backup/clusters:
    get:
      tags: [backups]
      summary: Per-cluster backup summary.
      responses:
        "200":
          description: One row per cluster in read scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        targets: {type: integer}
                        candidates: {type: integer, description: targets without a job}
                        jobs: {type: integer}
                        jobs_enabled: {type: integer}
                        last_24h: {type: object, description: "original runs by outcome (repair runs are not counted); a partial run whose repair succeeded counts as succeeded; partial = wrote some of its copies and its repairs did not complete them", properties: {succeeded: {type: integer}, failed: {type: integer}, missed: {type: integer}, partial: {type: integer}}}
                        last_success_at: {type: [string, "null"], format: date-time, description: finish time of the newest restorable run (succeeded or partial)}
                        bytes_30d: {type: integer}
  /backup/runs:
    get:
      tags: [backups]
      parameters:
        - {name: job_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        "200":
          description: Runs newest first
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/BackupRun"}}}}}}
  /backup/runs/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [backups]
      parameters:
        - {name: copy, in: query, schema: {type: string, format: uuid}, description: "Destination id of the copy to build the restore guide from: the run's own copy there, else the newest copy a repair completed there. Default: the first succeeded copy of the run in member order."}
      responses:
        "200": {description: "Run; restore = ready-to-copy restore commands for a succeeded or partial run (F19), else null. The commands are built from a succeeded copy of the run and that copy's destination.", content: {application/json: {schema: {allOf: [{$ref: "#/components/schemas/BackupRun"}, {type: object, properties: {restore: {$ref: "#/components/schemas/RestoreGuide"}, next_repair_at: {type: [string, "null"], format: date-time, description: "Partial run with a repair queued: when the repair starts (its not_before), else null"}}}]}}}}
        "422": {description: "copy is not a destination id, or the run has no successful copy in that destination"}
  /backup/test-connection:
    post:
      tags: [backups]
      summary: >-
        Real connection check through the tunnel (operator on the target's cluster). Shows version, TLS and privileges.
        Never echoes the password. Records the target's detected_version/tls_ok and opens or resolves its tls.missing finding.
        The cluster's agent must be connected to the replica serving the request (else error "agent_offline").
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: {type: string}
                credential: {$ref: "#/components/schemas/CredentialInput"}
                credential_id: {type: string, description: "Existing credential of a job on this same target (instead of credential)"}
                engine_options: {type: object, description: Same as BackupJobInput.engine_options}
      responses:
        "200": {description: Result, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectionTest"}}}}
  /backup/self:
    get:
      tags: [backups]
      summary: The built-in olympos-self job (Olympos' own database) and its last 20 runs. Global read.
      parameters:
        - {name: copy, in: query, schema: {type: string, format: uuid}, description: "Destination id of the copy to build the restore guide from (the guide is for the latest succeeded or partial original run): that run's own copy there, else the newest copy a repair completed there. Default: the first succeeded copy of the run in member order."}
      responses:
        "200": {description: Self-backup, content: {application/json: {schema: {$ref: "#/components/schemas/SelfBackup"}}}}
        "422": {description: "copy is not a destination id, or the latest restorable run has no successful copy in that destination"}
    put:
      tags: [backups]
      summary: Configure the olympos-self job (global admin). There is no DELETE; the job is built in.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination_id: {type: string, description: "Write to one destination. Exactly one of destination_id and destination_group_id when the job is first configured; later, setting one clears the other and leaving both out keeps the current one."}
                destination_group_id: {type: string, description: "Write the dump to every destination of a group (docs/design/destination-groups.md)."}
                cron: {type: string, description: "Default 30 2 * * *"}
                timezone: {type: string}
                retention: {$ref: "#/components/schemas/Retention"}
                enabled: {type: boolean}
                notify_channel_id: {type: [string, "null"]}
      responses:
        "200": {description: Self-backup, content: {application/json: {schema: {$ref: "#/components/schemas/SelfBackup"}}}}
        "403": {description: Not a global admin}
        "422": {description: "Field errors (destination_id: neither or both of destination_id and destination_group_id, or an unknown destination; destination_group_id: an unknown group)"}
  /backup/self/run:
    post:
      tags: [backups]
      summary: Queue a manual olympos-self run (global operate).
      responses:
        "202": {description: Queued, content: {application/json: {schema: {type: object, properties: {run_id: {type: string}}}}}}
        "409": {description: "Not configured yet, or a run is already queued/running (a repair waiting for its not_before does not count)"}
  /backup/schedule-preview:
    get:
      tags: [backups]
      parameters:
        - {name: cron, in: query, required: true, schema: {type: string}}
        - {name: timezone, in: query, schema: {type: string, default: UTC}}
        - {name: count, in: query, schema: {type: integer, default: 5}}
      responses:
        "200":
          description: Next run times (count max 50)
          content: {application/json: {schema: {type: object, properties: {next: {type: array, items: {type: string, format: date-time}}, description: {type: string}}}}}
        "422": {description: "Invalid cron (fields.cron) or time zone (fields.timezone)"}

  # ------------------------------------------------------------ vaults (M3)
  /vaults:
    get:
      tags: [vaults]
      responses:
        "200":
          description: Discovered and configured vaults in scope
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Vault"}}}}}}
  /vaults/search:
    get:
      tags: [vaults]
      summary: Find vaults and secret paths across every vault the caller can read (name, cluster, namespace, provider, indexed paths).
      parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 2}}]
      responses:
        "200":
          description: Matches, vault matches first, max 50
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        match: {type: string, enum: [vault, path]}
                        vault_id: {type: string}
                        vault_name: {type: string}
                        provider: {type: string}
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        namespace: {type: string}
                        mount: {type: string, description: "path matches only"}
                        path: {type: string, description: "path matches only"}
                        keys: {type: integer}
  /vaults/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [vaults]
      responses:
        "200": {description: Vault, content: {application/json: {schema: {$ref: "#/components/schemas/Vault"}}}}
  /vaults/{id}/inspect:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [vaults]
      summary: "Admin. Before configure, list KV mounts using the pasted root token (token used once, never stored). TLS only."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [root_token]
              properties:
                root_token: {type: string, writeOnly: true}
                ca_bundle: {type: string, description: "Optional PEM bundle to verify the vault's TLS certificate (e2e-tls mode), not stored by inspect"}
      responses:
        "200":
          description: Mounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  sealed: {type: boolean}
                  storage_type: {type: string, description: "e.g. raft (required for snapshot backups)"}
                  mounts: {type: array, items: {$ref: "#/components/schemas/KVMount"}}
        "400": {description: Root token sent over plain HTTP}
        "403": {description: Not admin on the vault's cluster}
        "422": {description: Token rejected by Vault, or invalid CA bundle}
        "502": {description: Vault unreachable through the tunnel}
  /vaults/{id}/configure:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [vaults]
      summary: "Admin. Creates policy `olympos` + AppRole `olympos`, stores secret_id in Key Vault, verifies login, discards the root token."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [root_token, mounts]
              properties:
                root_token: {type: string, writeOnly: true}
                mounts: {type: array, items: {type: string}, description: 'KV v2 mount paths to manage, e.g. "secret/". KV v1 mounts are rejected (read-only, keys not listed).'}
                ca_bundle: {type: string, description: "Optional PEM bundle stored on the vault and used to verify its certificate end-to-end (not secret)"}
      responses:
        "200": {description: Configured, content: {application/json: {schema: {$ref: "#/components/schemas/Vault"}}}}
        "400": {description: Root token sent over plain HTTP}
        "403": {description: Not admin on the vault's cluster}
        "409": {description: Vault sealed/uninitialized, gone, or approle/ path used by another auth method}
        "422": {description: "Invalid mounts (`fields.mounts`), token rejected, invalid CA bundle"}
        "502": {description: A Vault step failed (safe message)}
  /vaults/{id}/refresh:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [vaults]
      summary: Refresh the secret index (and drift detection) now. operator, vault-maker or vault-approver in scope.
      responses:
        "202": {description: Started}
        "403": {description: Viewer}
        "409": {description: Vault not configured}
  /vaults/{id}/tree:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [vaults]
      parameters: [{name: mount, in: query, schema: {type: string}}]
      responses:
        "200":
          description: Indexed secret paths (from vault_secret_index)
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/SecretSummary"}}}}}}
  /vaults/{id}/secrets/{path}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: path, in: path, required: true, schema: {type: string}, description: "Secret path below the mount, may contain slashes"}
      - {name: mount, in: query, required: true, schema: {type: string}}
    get:
      tags: [vaults]
      summary: Keys and versions only (from the index; key names come from KV v2 subkeys). Values are never returned.
      responses:
        "404": {description: Not indexed, or vault outside scope}
        "200": {description: Secret, content: {application/json: {schema: {$ref: "#/components/schemas/SecretDetail"}}}}

  # ------------------------------------------------------------ change requests (M3)
  /change-requests:
    get:
      tags: [approvals]
      parameters:
        - {name: mine, in: query, schema: {type: boolean}}
        - {name: waiting_for_me, in: query, schema: {type: boolean}}
        - {name: status, in: query, schema: {type: string}}
        - {name: vault_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 200}}
      responses:
        "200":
          description: Change requests in read scope, newest first (items without events)
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ChangeRequest"}}}}}}
    post:
      tags: [approvals]
      summary: "vault-maker in scope. New values are sealed at submit (envelope, AAD change_items:<id>); only HMAC fingerprints are ever shown. Expires after changeRequests.ttl (default 72h)."
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequestInput"}}}}
      responses:
        "201": {description: Opened, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: Not vault-maker on the vault's cluster}
        "404": {description: Vault missing or outside scope}
        "409": {description: Vault not configured}
        "422": {description: "Validation: justification >= 10 chars, managed KV v2 mount, key required (except destroy_history), value required for create/replace and forbidden for delete/destroy_history, versions for destroy_history only, one base_version per path"}
  /change-requests/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [approvals]
      responses:
        "200": {description: Change request with trail, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
  /change-requests/{id}/approve:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: "vault-approver in scope, maker ≠ checker by (tenant_id, object_id) (no bypass, admin included), never a guest. Applies immediately: items on one path → one PATCH (merge-patch, options.cas = base_version); new path → POST cas 0; destroy_history → POST destroy."
      requestBody: {content: {application/json: {schema: {type: object, properties: {comment: {type: string}}}}}}
      responses:
        "200": {description: Approved (status applied or failed; failure has a safe message such as a check-and-set conflict), content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: 'Own request ("You opened this request"), guest, or not an approver'}
        "404": {description: Missing or outside scope}
        "409": {description: Already decided or expired}
  /change-requests/{id}/reject:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: Same rules as approve. A comment is required.
      requestBody: {content: {application/json: {schema: {type: object, required: [comment], properties: {comment: {type: string}}}}}}
      responses:
        "200": {description: Rejected, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: Own request, guest, or not an approver}
        "409": {description: Already decided or expired}
        "422": {description: Comment missing}
  /change-requests/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: Maker withdraws a pending request.
      responses:
        "200": {description: Cancelled, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: Not the maker}
        "409": {description: Not pending}

  # ------------------------------------------------------------ restores
  /restores:
    get:
      tags: [approvals]
      summary: "Restore requests visible to the caller (read on the backup's cluster; read on the target's cluster alone is not enough), newest first."
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, running, succeeded, failed, rejected, expired, cancelled]}}
        - {name: waiting_for_me, in: query, description: "1 or true: pending requests the caller may approve", schema: {type: string}}
        - {name: mine, in: query, description: "1 or true: requests the caller opened", schema: {type: string}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, default: 200}}
      responses:
        "200":
          description: Restore requests
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/RestoreRequest"}}}}}}
    post:
      tags: [approvals]
      summary: >-
        Open a restore of a succeeded or partial run's copy into a new, discovered target (docs/design/ui-restore.md).
        Needs read on the backup's cluster and operate on the target's cluster. The open-time checks run first
        (see /restores/check); the target's credential is then stored (envelope, or a Key Vault reference) and a
        Vault token sealed (AAD restore_requests:<id>); both are wiped when the request ends. Pending requests
        expire after changeRequests.ttl (default 72h); approved requests that do not start within 24h expire.
        break_glass (admin on both clusters, members only) starts the request at once, records the maker as the
        decider and emits restore.break_glass.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RestoreInput"}}}}
      responses:
        "201": {description: Opened (pending, or approved with break_glass), content: {application/json: {schema: {$ref: "#/components/schemas/RestoreRequest"}}}}
        "403": {description: "Missing read on the backup's cluster or operate on the target's; break-glass without admin on both clusters or by a guest"}
        "409": {description: "Break-glass: another restore into this target is approved or running"}
        "422":
          description: >-
            A check failed (fields name it): unknown run or target (also outside scope), run not succeeded/partial,
            dry run, no succeeded copy in copy_destination_id, the backup's own target, another engine, target gone,
            a Vault configured in Olympos, databases not in the backup, a selected database exists on the target
            with data in it, Vault not initialized/sealed/token without snapshot-force, credential or vault_token
            missing, justification 10–2000 chars, agent_offline, the target check failed, or "restores of <engine>
            are not available yet".
          content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}
  /restores/check:
    post:
      tags: [approvals]
      summary: >-
        Run the open-time checks of a restore for the dialog without storing anything: the run and copy, the
        target, the databases in the backup, and (when the input is complete) the target inspected over its
        tunnel with the given credential, which tests it. Nothing is written to the target. Same permissions as
        opening; justification is not checked. Every inspection of the target (here or when opening) is
        recorded in the activity log as restore.checked, with the scrubbed reason when it failed.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RestoreInput"}}}}
      responses:
        "200": {description: "Checks ran: ok, or ok=false with error and fields", content: {application/json: {schema: {$ref: "#/components/schemas/RestoreCheck"}}}}
        "403": {description: Not allowed to open this restore}
        "422": {description: Unknown run or target (also outside scope), content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
  /restores/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [approvals]
      responses:
        "200": {description: Restore request, content: {application/json: {schema: {$ref: "#/components/schemas/RestoreRequest"}}}}
        "404": {description: "Missing, or the caller lacks read on the backup's cluster"}
  /restores/{id}/approve:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: "Another person than the maker (by tenant_id, object_id; no bypass, admin included), never a guest, with operate on both the backup's and the target's cluster. The backup worker starts the restore when the target's agent is connected; it must start within 24h."
      requestBody: {content: {application/json: {schema: {type: object, properties: {comment: {type: string}}}}}}
      responses:
        "200": {description: Approved, content: {application/json: {schema: {$ref: "#/components/schemas/RestoreRequest"}}}}
        "403": {description: 'Own request ("You opened this request"), guest, or operate missing on a cluster'}
        "404": {description: Missing or outside scope}
        "409": {description: "Not pending, expired (it is expired now), or another restore into the target is approved or running"}
  /restores/{id}/reject:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: Same rules as approve. A comment is required. The credential and token are wiped.
      requestBody: {content: {application/json: {schema: {type: object, required: [comment], properties: {comment: {type: string}}}}}}
      responses:
        "200": {description: Rejected, content: {application/json: {schema: {$ref: "#/components/schemas/RestoreRequest"}}}}
        "403": {description: Own request, guest, or operate missing on a cluster}
        "404": {description: Missing or outside scope}
        "409": {description: Not pending or expired}
        "422": {description: Comment missing}
  /restores/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: The maker withdraws a pending request, or an approved one that has not started (the target is free again). The credential and token are wiped.
      responses:
        "200": {description: Cancelled, content: {application/json: {schema: {$ref: "#/components/schemas/RestoreRequest"}}}}
        "403": {description: Not the maker}
        "404": {description: Missing or outside scope}
        "409": {description: Running or ended}

  # ------------------------------------------------------------ audit (M4)
  /audit/settings:
    get:
      tags: [audit]
      summary: Where raw Kubescape, Polaris and kube-bench reports are stored (any role). `raw_destination` is null when they are not stored.
      responses:
        "200": {description: Settings, content: {application/json: {schema: {$ref: "#/components/schemas/AuditSettings"}}}}
    put:
      tags: [audit]
      summary: Choose the raw reports destination, or null to stop storing them (admin with scope all). Recorded as `audit.settings_changed`.
      requestBody: {content: {application/json: {schema: {type: object, required: [raw_destination_id], properties: {raw_destination_id: {type: string, format: uuid, nullable: true}}}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/AuditSettings"}}}}
        "403": {description: Not admin with scope all}
        "422": {description: "Unknown destination (`fields`: raw_destination_id)"}
  /audit/schedules:
    get:
      tags: [audit]
      summary: List audit schedules (any role). `clusters` and `last_run` only count clusters the caller can read.
      responses:
        "200":
          description: Schedules
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditSchedule"}}}}}}
    post:
      tags: [audit]
      summary: Create a schedule (operator with scope all — schedules are global objects). `tool` is required.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/AuditScheduleInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/AuditSchedule"}}}}
        "403": {description: Not operator with scope all}
        "422": {description: "Validation (`fields`: tool, frameworks, scope_selector, cron, timezone, notify_channel_id)"}
  /audit/schedules/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    patch:
      tags: [audit]
      summary: Update a schedule (operator with scope all). Omitted fields are kept; `notify_channel_id` null clears it. `tool` cannot change (422). Changing cron/timezone or re-enabling restarts the schedule from now.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/AuditScheduleInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/AuditSchedule"}}}}
        "403": {description: Not operator with scope all}
        "422": {description: Validation}
    delete:
      tags: [audit]
      summary: Delete a schedule (operator with scope all). Run history is kept (schedule_id becomes null); queued runs fail with "schedule deleted".
      responses: {"204": {description: Deleted}}
  /audit/schedules/{id}/run:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [audit]
      summary: |
        Queue a manual run. With `cluster_id`: operator on that cluster (404 outside scope, 403 if only viewer).
        Without: every cluster in the schedule scope on which the caller is operator. kube-bench only runs on clusters
        whose agent advertised the bench capability (422 otherwise). A pending run for the same schedule and cluster is
        returned instead of queuing a duplicate.
      requestBody: {content: {application/json: {schema: {type: object, properties: {cluster_id: {type: string, description: "Only this cluster (default: every cluster in the schedule scope)"}}}}}}
      responses:
        "202":
          description: Queued runs
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditRun"}}}}}}
        "403": {description: Visible cluster but not operator}
        "404": {description: Unknown schedule, or cluster outside the caller's scope}
        "422": {description: "Cluster not enrolled, kube-bench not enabled on the agent, or no eligible cluster"}
  /audit/clusters:
    get:
      tags: [audit]
      summary: Per-cluster audit summary (latest run per tool, open findings by severity).
      responses:
        "200":
          description: One row per cluster in read scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        provider: {type: string}
                        bench_enabled: {type: boolean}
                        last_runs:
                          type: array
                          items: {type: object, properties: {tool: {type: string}, run_id: {type: string}, status: {type: string}, score: {type: [number, "null"]}, finished_at: {type: [string, "null"], format: date-time}, new_findings: {type: integer}}}
                        open_findings: {type: object, properties: {critical: {type: integer}, high: {type: integer}, medium: {type: integer}, low: {type: integer}}}
  /audit/runs:
    get:
      tags: [audit]
      summary: Runs on clusters the caller can read, newest first.
      parameters:
        - {name: schedule_id, in: query, schema: {type: string}}
        - {name: cluster_id, in: query, schema: {type: string}}
        - {name: tool, in: query, schema: {type: string, enum: [kubescape, polaris, kube-bench]}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 500}}
      responses:
        "200":
          description: Runs newest first
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditRun"}}}}}}
  /audit/runs/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [audit]
      responses:
        "200": {description: "Run incl. kube-bench node results and `log`", content: {application/json: {schema: {$ref: "#/components/schemas/AuditRun"}}}}
        "404": {description: Unknown run or cluster outside the caller's scope}
  /findings:
    get:
      tags: [audit]
      summary: Findings on clusters the caller can read; most severe and newest first. A `cluster` outside scope yields an empty list.
      parameters:
        - {name: source, in: query, schema: {type: string, enum: [kubescape, polaris, kube-bench, kyverno, netpol, tls, vault-drift, transfer]}}
        - {name: status, in: query, schema: {type: string, enum: [open, resolved]}}
        - {name: cluster, in: query, schema: {type: string, description: Cluster id or name}}
        - {name: run_id, in: query, schema: {type: string, description: Findings first seen in this run ("new")}}
        - {name: limit, in: query, schema: {type: integer, default: 200, maximum: 1000}}
      responses:
        "200":
          description: Findings
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Finding"}}}}}}

  # ------------------------------------------------------------ security (M5)
  /images:
    get:
      tags: [security]
      description: |
        Running images deduplicated by digest. Only images used in clusters the caller can read are listed;
        `clusters`/`workloads` count only those clusters.
      parameters:
        - {name: cluster, in: query, schema: {type: string}, description: Cluster ID or name (out of scope → empty list)}
        - {name: severity, in: query, schema: {type: string, enum: [critical, high]}, description: "critical: critical > 0; high: critical + high > 0"}
        - {name: status, in: query, schema: {type: string, enum: [pending, scanning, scanned, missing_credential, failed]}}
        - {name: q, in: query, schema: {type: string}, description: Substring of repo or tag, or digest prefix}
      responses:
        "200":
          description: Images by digest in scope
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Image"}}}}}}
        "422": {description: Invalid filter}
  /images/scan:
    post:
      tags: [security]
      summary: Queue a rescan of every running image now (Security › Scan now; operator).
      responses: {"202": {description: Queued}}
  /images/{digest}:
    parameters: [{name: digest, in: path, required: true, schema: {type: string}, description: "sha256:..."}]
    get:
      tags: [security]
      responses:
        "200": {description: Image with usage (visible clusters only) and vulnerabilities, content: {application/json: {schema: {$ref: "#/components/schemas/ImageDetail"}}}}
        "404": {description: Unknown digest, or not running in any cluster the caller can read}
  /images/{digest}/scan:
    parameters: [{name: digest, in: path, required: true, schema: {type: string}}]
    post:
      tags: [security]
      description: Queue a rescan. Requires operator on at least one cluster running the image.
      responses:
        "202": {description: Queued, content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [queued]}}}}}}
        "403": {description: Visible but the role does not allow scans}
        "404": {description: Unknown or out of scope}
  /security/kyverno:
    get:
      tags: [security]
      parameters: [{name: cluster, in: query, schema: {type: string}, description: Cluster ID or name}]
      responses:
        "200":
          description: Kyverno policies per cluster (most failures first) and Kyverno install state per cluster
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KyvernoPolicy"}}
                  clusters: {type: array, items: {$ref: "#/components/schemas/KyvernoCluster"}}
  /security/netpol:
    get:
      tags: [security]
      parameters: [{name: cluster, in: query, schema: {type: string}, description: Cluster ID or name}]
      responses:
        "200":
          description: NetworkPolicy default-deny status per namespace
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/NetpolNamespace"}}}}}}
  /security/clusters:
    get:
      tags: [security]
      summary: Per-cluster security summary (cluster overview of the Security page).
      responses:
        "200":
          description: One row per cluster in read scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        provider: {type: string}
                        status: {type: string}
                        images: {type: integer}
                        workloads: {type: integer}
                        critical: {type: integer, description: critical CVEs across the cluster's images}
                        high: {type: integer}
                        images_with_critical: {type: integer}
                        not_scanned: {type: integer}
                        kyverno_installed: {type: boolean}
                        kyverno_policies: {type: integer}
                        kyverno_failures: {type: integer}
                        namespaces: {type: integer}
                        namespaces_without_default_deny: {type: integer}
                        sensitive_data: {type: integer, description: "Open sensitive-data findings (credential-like values in ConfigMaps, F2)"}
                        sensitive_data_high: {type: integer, description: "Of which matched a credential pattern"}
  /security/secrets:
    get:
      tags: [security]
      summary: Opt-in Secret inventory (F3) — names and key names only, never values.
      parameters:
        - {name: cluster, in: query, schema: {type: string}, description: Cluster ID or name}
      responses:
        "200":
          description: Clusters with the capability and their Secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters: {type: array, items: {type: object, properties: {cluster_id: {type: string}, cluster_name: {type: string}, enabled: {type: boolean}}}}
                  fix: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        namespace: {type: string}
                        name: {type: string}
                        type: {type: string, description: "inferred; empty when unknown"}
                        keys: {type: array, items: {type: string}, description: key names from managedFields}
                        keys_unknown: {type: boolean}
                        referenced_by: {type: array, items: {type: string}}
                        managed_by: {type: string}
                        created_at: {type: [string, "null"], format: date-time}
                        first_seen_at: {type: string, format: date-time}
                        last_referenced_at: {type: [string, "null"], format: date-time}
                        findings: {type: array, items: {type: string, enum: [secret.unused, secret.unmanaged, secret.legacy_sa_token]}}
  /security/kyverno/policy:
    get:
      tags: [security]
      summary: One Kyverno policy with its spec and current violations.
      parameters:
        - {name: cluster, in: query, required: true, schema: {type: string}}
        - {name: kind, in: query, required: true, schema: {type: string}}
        - {name: namespace, in: query, schema: {type: string}}
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KyvernoPolicy"
                  - type: object
                    properties:
                      spec: {type: [object, "null"], description: "The policy spec as stored in the cluster (metadata trimmed). null when the agent did not send it (older agent, or spec_omitted)"}
                      yaml: {type: string, description: "The whole object as YAML (apiVersion, kind, name, namespace, policies.kyverno.io/* annotations, spec); empty when spec is null"}
                      spec_omitted: {type: boolean, description: "The policy object exceeded the agent's size cap (64 KiB per policy, 8 MiB per report) and was not sent"}
                      violations:
                        type: array
                        description: "Non-passing results (fail, error, warn) in the current policy reports, fails first, at most 2000"
                        items: {type: object, properties: {rule: {type: string}, result: {type: string}, severity: {type: string}, message: {type: string}, resource_kind: {type: string}, resource_namespace: {type: string}, resource_name: {type: string}}}
        "404": {description: "Unknown policy or kind, missing parameter, or cluster outside the caller's read scope"}
  /security/netpol/namespace:
    get:
      tags: [security]
      summary: NetworkPolicies of one namespace with specs, plus labels for the policy simulator.
      parameters:
        - {name: cluster, in: query, required: true, schema: {type: string}}
        - {name: namespace, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Namespace
          content:
            application/json:
              schema:
                type: object
                properties:
                  cluster_id: {type: string}
                  cluster_name: {type: string}
                  namespace: {type: string}
                  namespace_labels: {type: object, additionalProperties: {type: string}}
                  default_deny: {type: boolean}
                  excluded: {type: boolean}
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        spec: {type: [object, "null"], description: "networking.k8s.io/v1 NetworkPolicySpec as in the cluster; null when the agent did not send it (older agent, or larger than 32 KiB)"}
                        yaml: {type: string, description: "The whole NetworkPolicy as YAML; empty when spec is null"}
                  workloads:
                    type: array
                    description: "Workloads in the namespace with their pod template labels (example data for the simulator)"
                    items: {type: object, properties: {kind: {type: string, enum: [Deployment, StatefulSet, DaemonSet]}, name: {type: string}, labels: {type: object, additionalProperties: {type: string}}, ports: {type: array, items: {type: integer}, description: container ports}}}
                  other_namespaces:
                    type: array
                    description: "Other namespaces of the cluster with labels (namespaceSelector examples)"
                    items: {type: object, properties: {name: {type: string}, labels: {type: object, additionalProperties: {type: string}}}}
        "404": {description: "Unknown namespace, missing parameter, or cluster outside the caller's read scope"}
  /registries:
    get:
      tags: [security]
      description: |
        Readable by every signed-in user with a grant. `images` and `unmatched` only consider images running in
        clusters the caller can read. Passwords are never returned.
      responses:
        "200":
          description: Registry credentials (no secrets) and unmatched registries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Registry"}}
                  unmatched: {type: array, items: {$ref: "#/components/schemas/UnmatchedRegistry"}}
    post:
      tags: [security]
      description: Admin with scope `all`. Requeues images in missing_credential/failed for a scan.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Registry"}}}}
        "403": {description: Not a global admin}
        "422": {description: Validation (incl. duplicate host_pattern)}
  /registries/test:
    post:
      tags: [security]
      summary: Test an unsaved registry credential with a manifest pull (Test pull). Never echoes the password.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string}}}}}}
  /registries/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    patch:
      tags: [security]
      description: |
        Admin with scope `all`. Omitted fields are unchanged. `password` replaces the credential
        (`{"source": "none"}` removes it); `username` alone renames the existing credential.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Registry"}}}}
        "404": {description: Not found}
        "422": {description: Validation}
    delete:
      tags: [security]
      description: Admin with scope `all`. Deletes the registry and its credential.
      responses: {"204": {description: Deleted}, "404": {description: Not found}}

  # ------------------------------------------------------------ activity
  /activity:
    get:
      tags: [activity]
      parameters:
        - {name: action, in: query, schema: {type: string}, description: "Prefix, e.g. backup. or cr."}
        - {name: object_type, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string}, description: "Go duration, e.g. 24h, 168h"}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: Cursor (at of last item)}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200":
          description: Entries newest first
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ActivityEntry"}}}}}}

  # ------------------------------------------------------------ synthetic monitoring
  # docs/design/synthetic-monitoring.md. A scenario is seen by readers with scope all and by anyone who reads a
  # cluster it runs on now; results, runs and alerts only for the clusters the caller reads. Writes to scenarios
  # need synthetic-editor (or admin): scope all for run_on all, otherwise the role on every cluster the selector
  # matches now (and at least one). The allowlist and the credentials are admin (scope all) only; editors and
  # readers with scope all see them. Every write is in the activity log.
  /synthetic/overview:
    get:
      tags: [synthetic]
      summary: Monitoring › Synthetic. KPIs, the scenario × cluster matrix over the clusters the caller reads, 24 h availability and p95.
      responses:
        "200": {description: Overview, content: {application/json: {schema: {$ref: "#/components/schemas/SyntheticOverview"}}}}
  /synthetic/scenarios:
    get:
      tags: [synthetic]
      summary: Scenarios the caller sees, by name.
      responses:
        "200":
          description: Scenarios
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ScenarioSummary"}}}}}}
    post:
      tags: [synthetic]
      summary: >-
        Create a scenario. Step positions are numbered by the server in the order given. Checked: the model and
        its limits (≤ 10 steps, interval ≥ 30 s, timeout ≤ 60 s and ≤ interval, ≤ 2 retries, body ≤ 64 KiB);
        every host (URL, DNS name, TCP/TLS host, SNI) against the allowlist, never an IP literal, localhost or the
        Kubernetes API; a step's credential bound to the step's host; a variable that carries a credential only
        sent within that credential's bound hosts; the request caps (120 per minute per scenario per cluster,
        600 per cluster, oldest scenarios first); the caller's scope (see above).
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ScenarioInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Scenario"}}}}
        "403": {description: "No synthetic-editor role, or the scenario would run on clusters outside it (run_on all needs scope all)"}
        "422":
          description: >-
            Fields name what is refused. A host no rule matches: "Host X is not allowed. Add a rule in Settings ›
            Synthetic monitoring." (admins) or "Host X is not allowed. Ask an admin to add it to the synthetic
            allowlist." (others). A cap: interval_seconds, naming the clusters.
          content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}
  /synthetic/scenarios/preview:
    post:
      tags: [synthetic]
      summary: >-
        The editor's live line ("Runs on 9 of 10 clusters") and cap check for a draft, saving nothing. Only the
        targeting must be valid. id: the scenario being edited (its stored version is not counted). Editors only.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/ScenarioInput"}
                - {type: object, properties: {id: {type: string, format: uuid}}}
      responses:
        "200": {description: Preview, content: {application/json: {schema: {$ref: "#/components/schemas/ScenarioPreview"}}}}
        "422": {description: Invalid targeting, content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
  /synthetic/scenarios/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [synthetic]
      summary: >-
        A scenario with its steps and alert rule. Without synthetic-editor, a step that uses a credential has
        http.headers and http.body null and hidden true.
      responses:
        "200": {description: Scenario, content: {application/json: {schema: {$ref: "#/components/schemas/Scenario"}}}}
        "404": {description: Not found or not seen}
    put:
      tags: [synthetic]
      summary: >-
        Replace a scenario (checked as on create; the caller must be allowed both the stored and the new
        clusters). Omitted alerts, enabled and store_responses keep their stored values. A scenario read with
        GET can be sent back as it is: its read-only fields (id, targets, requests_per_minute, can_edit,
        created_by, created_by_name, created_at, updated_at, alerts.channel_name, alerts.critical_channel_name,
        and each step's position, credential and hidden) are ignored.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ScenarioInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Scenario"}}}}
        "403": {description: Outside the caller's synthetic-editor scope}
        "422": {description: Validation, content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
    patch:
      tags: [synthetic]
      summary: Pause or resume a scenario. Resuming checks the request caps again.
      requestBody:
        content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Scenario"}}}}
        "403": {description: Outside the caller's synthetic-editor scope}
        "422": {description: Over a request cap, content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
    delete:
      tags: [synthetic]
      summary: Delete a scenario with its runs and alerts.
      responses: {"204": {description: Deleted}, "403": {description: Outside the caller's scope}, "404": {description: Not found}}
  /synthetic/scenarios/{id}/run:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [synthetic]
      summary: >-
        Run now: one manual run on cluster_id, or on every cluster the scenario runs on now with an online
        probe. Manual runs count toward alerting. Same permission as editing the scenario. The body is optional.
      requestBody:
        content: {application/json: {schema: {type: object, properties: {cluster_id: {type: string, format: uuid}}}}}
      responses:
        "202":
          description: Runs queued
          content: {application/json: {schema: {type: object, properties: {run_ids: {type: array, items: {type: string, format: uuid}}}}}}
        "409": {description: "The scenario is paused, the cluster's probe is not online, or no cluster can run it now"}
        "422": {description: "cluster_id unknown, or not a cluster the scenario runs on"}
        "429": {description: A request cap blocks the run}
  /synthetic/scenarios/{id}/clusters:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [synthetic]
      summary: >-
        The scenario on each cluster the caller reads: state, last counted run, p50/p95 and availability over
        24 h, and a timeline of 48 buckets of 30 minutes (the last one holds now).
      responses:
        "200": {description: Clusters, content: {application/json: {schema: {$ref: "#/components/schemas/ScenarioClusters"}}}}
  /synthetic/scenarios/{id}/alerts:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [synthetic]
      summary: Alert history, firing first, newest first. Cluster alerts of the clusters the caller reads, and fleet alerts.
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
      responses:
        "200":
          description: Alerts
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/SyntheticAlert"}}}}}}
  /synthetic/test-runs:
    post:
      tags: [synthetic]
      summary: >-
        "Run once" from the editor: run a draft on one cluster. Never alerts. The draft is checked as a save
        checks its steps, hosts and credentials (not the targeting or the caps). The caller needs synthetic-editor
        on the cluster (and on the scenario, when scenario.id names a saved one). At most 6 per user per minute on each server replica.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [scenario, cluster_id]
              properties:
                scenario:
                  allOf:
                    - {$ref: "#/components/schemas/ScenarioInput"}
                    - {type: object, properties: {id: {type: string, format: uuid, description: The saved scenario the draft edits}}}
                cluster_id: {type: string, format: uuid}
      responses:
        "202":
          description: Queued
          content: {application/json: {schema: {type: object, properties: {run_id: {type: string, format: uuid}}}}}
        "403": {description: Not synthetic-editor on the cluster}
        "409": {description: The cluster's probe is not online}
        "422": {description: Validation (cluster_id unknown or not readable), content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
        "429": {description: Too many test runs}
  /synthetic/runs:
    get:
      tags: [synthetic]
      summary: Runs on the clusters the caller reads, newest first.
      parameters:
        - {name: scenario_id, in: query, schema: {type: string, format: uuid}}
        - {name: cluster_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [scheduled, running, passed, failed, error, skipped]}}
        - {name: test, in: query, schema: {type: boolean}}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: Cursor (scheduled_for of the last item)}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        "200":
          description: Runs
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/SyntheticRun"}}}}}}
        "422": {description: Invalid filter, content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
  /synthetic/runs/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [synthetic]
      summary: >-
        Run detail: per-step timings, assertion results, the redacted response excerpt (kept 7 days), and the
        requests for "Copy as curl" (hidden as in GET /synthetic/scenarios/{id}).
      responses:
        "200": {description: Run, content: {application/json: {schema: {$ref: "#/components/schemas/SyntheticRunDetail"}}}}
        "404": {description: Not found, or the cluster is not readable}
  /synthetic/allowlist:
    get:
      tags: [synthetic]
      summary: The host allowlist, with how many scenarios reach a host each rule matches.
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AllowRule"}}
                  version: {type: integer, description: Moves with every change; runs carry it to the probe}
        "403": {description: Neither synthetic-editor nor a reader with scope all}
    post:
      tags: [synthetic]
      summary: Add a rule (admin, scope all). Recorded, and announced as synthetic.allowlist_changed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pattern, kind]
              properties:
                pattern: {type: string, example: "*.prod.wrw.com"}
                kind: {type: string, enum: [exact, wildcard, suffix]}
                note: {type: string, maxLength: 500}
      responses:
        "201": {description: Added, content: {application/json: {schema: {$ref: "#/components/schemas/AllowRule"}}}}
        "422": {description: "Invalid pattern (IP literals, localhost and the Kubernetes API are refused; suffix and wildcard need two labels), or the rule exists", content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
  /synthetic/allowlist/check:
    post:
      tags: [synthetic]
      summary: Check a host (or a URL's host) against the allowlist and the always-denied names. Editors only.
      requestBody:
        content: {application/json: {schema: {type: object, required: [host], properties: {host: {type: string}}}}}
      responses:
        "200": {description: Result, content: {application/json: {schema: {$ref: "#/components/schemas/HostCheck"}}}}
  /synthetic/allowlist/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [synthetic]
      summary: >-
        Remove a rule (admin, scope all). Refused while a scenario reaches a host that only this rule allows, or a
        credential's bound hosts or token URL need it. Recorded, and announced as synthetic.allowlist_changed.
      responses:
        "204": {description: Removed}
        "404": {description: Not found}
        "409": {description: Still needed, content: {application/json: {schema: {$ref: "#/components/schemas/InUse"}}}}
  /synthetic/credentials:
    get:
      tags: [synthetic]
      summary: Credentials scenarios may use. Never their secret.
      responses:
        "200":
          description: Credentials
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/SyntheticCredential"}}}}}}
        "403": {description: Neither synthetic-editor nor a reader with scope all}
    post:
      tags: [synthetic]
      summary: >-
        Create a credential (admin, scope all). The secret is stored like a backup credential (envelope, or a Key
        Vault reference) and never returned. Every bound host must be inside the allowlist; an OAuth2 token URL is
        https, allowlisted and inside the bound hosts.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/SyntheticCredentialInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/SyntheticCredential"}}}}
        "422": {description: Validation, content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
  /synthetic/credentials/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    put:
      tags: [synthetic]
      summary: >-
        Replace a credential's metadata (admin, scope all); with secret, rotate it (rotated_at). The kind cannot
        change. New bound hosts that would break a scenario using the credential are refused (409).
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/SyntheticCredentialInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/SyntheticCredential"}}}}
        "404": {description: Not found}
        "409": {description: Scenarios would break, content: {application/json: {schema: {$ref: "#/components/schemas/InUse"}}}}
        "422": {description: "Validation (expires_at must be in the future, or null)", content: {application/json: {schema: {$ref: "#/components/schemas/FieldErrors"}}}}
    delete:
      tags: [synthetic]
      summary: Delete a credential and its secret (admin, scope all). Refused while a scenario uses it.
      responses:
        "204": {description: Deleted}
        "404": {description: Not found}
        "409": {description: In use, content: {application/json: {schema: {$ref: "#/components/schemas/InUse"}}}}

components:
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}

  schemas:
    Role: {type: string, enum: [viewer, operator, vault-maker, vault-approver, admin, synthetic-editor]}

    Principal:
      type: object
      properties:
        id: {type: string}
        tenant_id: {type: string}
        object_id: {type: string}
        upn: {type: string}
        display_name: {type: string}
        user_type: {type: string}
        account_enabled: {type: boolean}

    Me:
      type: object
      properties:
        principal: {$ref: "#/components/schemas/Principal"}
        is_guest: {type: boolean}
        roles: {type: array, items: {$ref: "#/components/schemas/Role"}}
        grants: {type: array, items: {type: object, properties: {role: {$ref: "#/components/schemas/Role"}, scope: {type: string}}}}
        permissions:
          type: object
          description: Booleans that decide which controls are rendered (hidden, not disabled).
          properties:
            read: {type: boolean}
            operate: {type: boolean}
            operate_global: {type: boolean}
            vault_make: {type: boolean}
            vault_approve: {type: boolean}
            admin: {type: boolean}
            admin_global: {type: boolean}
            synthetic_edit: {type: boolean, description: "synthetic-editor or admin on some scope: show the scenario controls"}
            synthetic_edit_global: {type: boolean, description: "the same with scope all: scenarios that run on all clusters"}
        csrf_token: {type: string}
        dev_mode: {type: boolean}

    Grant:
      type: object
      properties:
        id: {type: string}
        principal: {$ref: "#/components/schemas/Principal"}
        is_guest: {type: boolean}
        role: {$ref: "#/components/schemas/Role"}
        scope: {type: string}
        granted_by: {type: [string, "null"]}
        granted_by_name: {type: string}
        granted_at: {type: string, format: date-time}
        stale: {type: boolean}

    DirectoryUser:
      type: object
      properties:
        object_id: {type: string}
        display_name: {type: string}
        upn: {type: string}
        mail: {type: string}
        user_type: {type: string}
        account_enabled: {type: boolean}
        is_guest: {type: boolean}

    Cluster:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        labels: {type: object, additionalProperties: {type: string}, description: "Always includes the reserved, read-only olympos.io/cluster=<name>. Other olympos.io/ keys are refused (422)."}
        provider: {type: string, enum: ["", azure, aws, gcp, oracle, huawei, onprem]}
        provider_label: {type: string, example: Azure}
        provider_override: {type: string}
        region: {type: string}
        api_version: {type: string, example: v1.31.4}
        status: {type: string, enum: [pending, online, offline, revoked]}
        last_seen_at: {type: [string, "null"], format: date-time}
        agent_version: {type: string}
        bench_enabled: {type: boolean}
        transfer_mode: {type: string, enum: [e2e-tls, compressed]}
        egress_rate_per_gb: {type: [number, "null"]}
        cert_expires_at: {type: [string, "null"], format: date-time}
        probe_status: {type: string, enum: [not_installed, pending, online, offline, revoked], description: "The synthetic monitoring probe. pending: enrolled, not connected yet"}
        probe_version: {type: string}
        probe_last_seen_at: {type: [string, "null"], format: date-time}
        nodes: {type: integer}
        nodes_ready: {type: integer}
        cpu_milli: {type: integer}
        mem_bytes: {type: integer}
        min_kubelet: {type: string}
        version_skew: {type: boolean}
        eol: {type: boolean}
        inventory_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        zones: {type: array, items: {type: string}, description: "Optional. Distinct node zones (dashboard Region / zones column)."}
        instance_types:
          type: array
          description: "Optional. Node count per instance type (dashboard Node sizes column)."
          items: {type: object, properties: {instance_type: {type: string}, count: {type: integer}}}
        backup_wire_bytes_30d: {type: integer, description: "Optional. Wire bytes of backup runs in the last 30 days (Settings › Clusters egress estimate)."}
        backup_bytes_30d: {type: integer, description: "Optional. Uncompressed bytes of the same runs (shows the compression gain)."}
    ClusterList:
      type: object
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Cluster"}}
    InstallResponse:
      type: object
      properties:
        cluster: {$ref: "#/components/schemas/Cluster"}
        command: {type: string, description: "Multi-line helm command containing the one-time token"}
        expires_at: {type: string, format: date-time}
    Node:
      type: object
      properties:
        name: {type: string}
        provider_id: {type: string}
        kubelet_version: {type: string}
        region: {type: string}
        zone: {type: string}
        instance_type: {type: string}
        cpu_milli: {type: integer}
        mem_bytes: {type: integer}
        roles: {type: array, items: {type: string}}
        ready: {type: boolean}
        seen_at: {type: string, format: date-time}
    Target:
      type: object
      properties:
        id: {type: string, description: 32 hex chars}
        cluster_id: {type: string}
        cluster_name: {type: string}
        namespace: {type: string}
        service: {type: string}
        port: {type: integer}
        port_name: {type: string}
        engine: {type: string, enum: ["", postgresql, clickhouse, vault]}
        vault_provider: {type: string, enum: ["", hashicorp, openbao]}
        tls_server_name: {type: string}
        detected_version: {type: string}
        tls_ok: {type: [boolean, "null"], description: null = not probed yet}
        status: {type: string, enum: [candidate, configured, gone]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}

    Dashboard:
      type: object
      properties:
        attention:
          type: array
          description: Needs-attention strip; hide the section when empty.
          items:
            type: object
            properties:
              kind: {type: string, enum: [agent_offline, backup_failed, backup_missed, backup_partial, approvals, eol, critical_cves, self_backup_unset, self_backup_failed, self_backup_partial, kek_purgeable, kek_recovery_unknown]}
              severity: {type: string, enum: [crit, warn]}
              label: {type: string}
              detail: {type: string}
              link: {type: string, description: SPA path}
        totals:
          type: object
          properties:
            clusters: {type: integer}
            agents_online: {type: integer}
            nodes: {type: integer}
            cpu_milli: {type: integer}
            mem_bytes: {type: integer}
            versions: {type: integer}
            version_min: {type: string}
            version_max: {type: string}
            skew_clusters: {type: integer}
            offline_agents: {type: integer}
            offline_detail: {type: string}
        version_matrix:
          type: array
          items: {type: object, properties: {minor: {type: string, example: "1.31"}, clusters: {type: integer}, eol: {type: boolean}}}
        providers:
          type: array
          items: {type: object, properties: {provider: {type: string}, label: {type: string}, clusters: {type: integer}, nodes: {type: integer}}}
        clusters: {type: array, items: {$ref: "#/components/schemas/Cluster"}}
        refreshed_at: {type: [string, "null"], format: date-time}

    # ---------------------------------------------------- notifications
    Channel:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [slack]}
        name: {type: string, example: "#platform-alerts"}
        slack_channel_id: {type: string, example: C0123ABCD}
        routes: {type: array, items: {type: string}, description: Event types routed here}
        created_at: {type: string, format: date-time}
    ChannelInput:
      type: object
      required: [name, slack_channel_id]
      properties:
        name: {type: string}
        slack_channel_id: {type: string}
    Route:
      type: object
      properties:
        event_type: {type: string}
        channel_ids: {type: array, items: {type: string}}
    Routes:
      type: object
      properties:
        catalog:
          type: array
          items:
            type: object
            properties:
              event_type: {type: string, example: backup.failed}
              description: {type: string}
              opt_in: {type: boolean, description: true for backup.succeeded}
        routes: {type: array, items: {$ref: "#/components/schemas/Route"}}

    # ---------------------------------------------------- destinations
    SecretSourceInput:
      type: object
      description: Either a Key Vault reference (recommended) or a value stored envelope-encrypted in Olympos.
      required: [source]
      properties:
        source: {type: string, enum: [keyvault_ref, stored]}
        ref: {type: string, example: "kv://kv-platform-weu/backup-sas"}
        value: {type: string, writeOnly: true}
    DestinationInput:
      type: object
      description: |
        One of three kinds (SPEC §10.3, extended — docs/spec-changes.md). `kind` defaults to azure_blob.
        - **azure_blob**: account, container, prefix, auth managed_identity | sas_token (+ sas), endpoint_override
          (Azurite, sovereign clouds, private DNS names; e.g. http://azurite.olympos.svc:10000/devstoreaccount1).
        - **s3**: bucket, region, prefix, endpoint_override (any S3-compatible service: MinIO, Ceph RGW, Wasabi,
          NetApp StorageGRID…; empty = AWS), path_style, auth access_key with access_key_id + secret_key.
        - **nfs**: path — a directory below one of the server's mounted volumes (`GET /destinations/mounts`),
          prefix. The server process can delete there; the test reports can_delete=true (use storage-side
          snapshots / WORM for retention protection).
        PATCH is partial: omitted fields are unchanged; `kind` cannot change.
      required: [name]
      properties:
        name: {type: string}
        kind: {type: string, enum: [azure_blob, s3, nfs], default: azure_blob}
        prefix: {type: string}
        endpoint_override: {type: string, description: "azure_blob and s3: custom endpoint URL (http or https)"}
        # azure_blob
        account: {type: string, example: stolymposbackups}
        container: {type: string}
        auth: {type: string, enum: [managed_identity, sas_token, access_key, none], description: "azure_blob: managed_identity | sas_token; s3: access_key; nfs: none"}
        sas: {$ref: "#/components/schemas/SecretSourceInput"}
        # s3
        bucket: {type: string}
        region: {type: string, example: eu-central-1, description: "s3: default us-east-1"}
        path_style: {type: boolean, description: "s3: path-style addressing (most S3-compatible services need it)"}
        access_key_id: {type: string, description: "s3: not secret, shown in the UI"}
        secret_key: {$ref: "#/components/schemas/SecretSourceInput"}
        # nfs
        path: {type: string, example: /var/lib/olympos/nfs/backup-nas/olympos}
    Destination:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [azure_blob, s3, nfs]}
        prefix: {type: string}
        endpoint_override: {type: string}
        account: {type: string}
        container: {type: string}
        auth: {type: string, enum: [managed_identity, sas_token, access_key, none]}
        sas_source: {type: string, enum: ["", keyvault_ref, stored]}
        sas_ref: {type: string}
        sas_expires_at: {type: [string, "null"], format: date-time}
        sas_permissions: {type: string, example: rcwt}
        bucket: {type: string}
        region: {type: string}
        path_style: {type: boolean}
        access_key_id: {type: string}
        secret_key_source: {type: string, enum: ["", keyvault_ref, stored]}
        secret_key_ref: {type: string}
        path: {type: string}
        last_test_at: {type: [string, "null"], format: date-time}
        last_test_ok: {type: [boolean, "null"]}
        last_test: {$ref: "#/components/schemas/DestinationTest"}
        jobs: {type: integer}
        groups: {type: integer, description: Number of destination groups this destination is a member of}
        copies: {type: integer, description: "Number of backup runs with a copy record (succeeded or failed) on this destination. A destination with copies cannot be deleted: the records keep those runs' restore commands pointing at it."}
        created_at: {type: string, format: date-time}
        warnings: {type: array, items: {type: string}, description: "Only on create/patch responses: things the admin must see (credential can delete, account SAS, expiry < 14 days)"}
    DestinationGroupInput:
      type: object
      description: Create requires `name` and `member_ids`; patch takes any of them.
      properties:
        name: {type: string, maxLength: 80}
        description: {type: string, maxLength: 500}
        member_ids:
          type: array
          minItems: 2
          maxItems: 4
          items: {type: string, format: uuid}
          description: Destination ids in order (the first is the default restore copy). Distinct, existing, and no two writing to the same location (same kind, location and prefix).
    DestinationGroup:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        members:
          type: array
          description: In position order.
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              kind: {type: string, enum: [azure_blob, s3, nfs]}
        jobs: {type: integer, description: "Number of backup jobs that use the group (deleted jobs included). Never the jobs themselves."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DestinationMount:
      type: object
      description: A volume mounted into the server for NFS destinations (Helm value nfsMounts).
      properties:
        name: {type: string, example: backup-nas}
        path: {type: string, example: /var/lib/olympos/nfs/backup-nas}
        writable: {type: boolean}
    DestinationTest:
      type: object
      properties:
        ok: {type: boolean, description: Write/read/tag succeeded}
        can_delete: {type: boolean, description: true = WARNING, credential can delete blobs}
        steps:
          type: array
          items:
            type: object
            properties:
              name: {type: string, enum: [write, read, tag, delete_refused, sas_permissions, sas_expiry, endpoint, path]}
              ok: {type: boolean}
              detail: {type: string}
        sas:
          type: [object, "null"]
          properties:
            permissions: {type: string}
            expires_at: {type: [string, "null"], format: date-time}
            missing: {type: array, items: {type: string}, description: "required of r,c,w,t not granted"}
            extra: {type: array, items: {type: string}, description: "e.g. d, l"}
            scope: {type: string, enum: [container, account, service, unknown]}
            user_delegation: {type: boolean, description: User delegation SAS (works with allowSharedKeyAccess=false)}
            stored_policy: {type: string, description: Stored access policy name (si) when used}
            notes: {type: array, items: {type: string}}
        error: {type: string}
        probe_path: {type: string, description: "{prefix}/.olympos-probe/<uuid>"}
    FieldErrors:
      type: object
      description: A 422 body that names the refused fields.
      properties:
        error: {type: string}
        fields: {type: object, additionalProperties: {type: string}, description: Field name to the reason it was refused}
    DestinationTestFailed:
      type: object
      properties:
        error: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        test: {$ref: "#/components/schemas/DestinationTest"}

    # ---------------------------------------------------- backups
    CredentialInput:
      type: object
      required: [source, username]
      properties:
        source: {type: string, enum: [keyvault_ref, stored]}
        ref: {type: string, description: "kv://<vault>/<secret>; the secret holds the password"}
        username: {type: string}
        password: {type: string, writeOnly: true}
    Retention:
      type: object
      properties:
        daily: {type: integer, default: 7}
        weekly: {type: integer, default: 4}
        monthly: {type: integer, default: 12}
    BackupJobInput:
      type: object
      properties:
        target_id: {type: string}
        credential: {$ref: "#/components/schemas/CredentialInput"}
        destination_id: {type: string, description: "Write to one destination. Exactly one of destination_id and destination_group_id. On PATCH, setting one clears the other."}
        destination_group_id: {type: string, description: "Write to every destination of a group (docs/design/destination-groups.md)."}
        engine_options:
          type: object
          description: "postgresql: {databases: [..] (empty = all), globals: true, tls_ca_pem: PEM bundle to verify the target (default system roots)}; clickhouse: {databases: [..], tables: [..]}; vault: {}"
        cron: {type: string, example: "0 2 * * *"}
        timezone: {type: string, example: Europe/Istanbul}
        retention: {$ref: "#/components/schemas/Retention"}
        enabled: {type: boolean}
        notify_channel_id: {type: [string, "null"]}
        notify_on_success: {type: boolean, description: "Also send backup.succeeded for this job (wizard step 3; default false). Routed like other events; the job's channel overrides the routing."}
    BackupJob:
      type: object
      properties:
        id: {type: string}
        target: {$ref: "#/components/schemas/Target"}
        engine: {type: string}
        credential: {type: object, properties: {id: {type: string}, source: {type: string}, ref: {type: string}, username: {type: string}}}
        destination: {type: [object, "null"], description: "Set for a job that writes to one destination, else null.", properties: {id: {type: string}, name: {type: string}}}
        destination_group: {type: [object, "null"], description: "Set for a job that writes to a destination group, else null.", properties: {id: {type: string}, name: {type: string}, members: {type: array, items: {type: string}, description: "Member destination names in position order"}}}
        engine_options: {type: object}
        cron: {type: string}
        timezone: {type: string}
        retention: {$ref: "#/components/schemas/Retention"}
        enabled: {type: boolean}
        paused_reason: {type: string, description: "e.g. target_gone"}
        notify_channel_id: {type: [string, "null"]}
        notify_on_success: {type: boolean}
        next_run_at: {type: [string, "null"], format: date-time}
        last_run: {oneOf: [{$ref: "#/components/schemas/BackupRun"}, {type: "null"}], description: "Latest non-test run; a repair waiting for its not_before is skipped"}
        destinations_last_success:
          type: array
          description: "Per current destination of the job (its destination, or its group's members in position order): when the job last wrote a successful copy there. Repairs count, dry runs do not. A succeeded run from before destination groups counts for the job's destination."
          items: {$ref: "#/components/schemas/DestinationLastSuccess"}
        estimated_monthly_bytes: {type: integer, description: wire bytes of recent runs × frequency}
        estimated_monthly_cost: {type: [number, "null"], description: "estimated_monthly_bytes / GiB x cluster egress_rate_per_gb (when set)"}
        created_at: {type: string, format: date-time}
    DestinationLastSuccess:
      type: object
      properties:
        destination_id: {type: string, format: uuid}
        name: {type: string}
        last_success_at: {type: [string, "null"], format: date-time, description: "When the latest successful copy there finished; null if there is none"}
    RestoreGuide:
      type: [object, "null"]
      properties:
        doc: {type: string, description: "docs/restore.md anchor or docs/restore-olympos.md"}
        steps:
          type: array
          items: {type: object, properties: {title: {type: string}, commands: {type: string}, note: {type: string}}}
        copies:
          type: array
          description: "The succeeded copies of the run in member order (a failed copy is never listed, even when its data blob landed), then, for an original run, the succeeded copies its repairs completed later, by repair start. The selected one is what the steps are built from (blob path, destination, and the manifest of the run that wrote it). copy=<destination id> selects the run's own copy there, else the newest repair copy there. A repair run's guide lists its own copies only."
          items:
            type: object
            properties:
              destination_id: {type: string, format: uuid}
              name: {type: string}
              kind: {type: string, enum: [azure_blob, s3, nfs]}
              selected: {type: boolean}
              run_id: {type: string, format: uuid, description: "The run that wrote this copy: the guide's run, or one of its repairs (the copy was completed later by a repair)"}
              taken_at: {type: [string, "null"], format: date-time, description: "When the run that wrote this copy started"}
    AuditSettings:
      type: object
      properties:
        raw_destination:
          type: object
          nullable: true
          properties: {id: {type: string, format: uuid}, name: {type: string}, kind: {type: string, enum: [azure_blob, s3, nfs]}}
    SelfBackup:
      type: object
      properties:
        configured: {type: boolean, description: "false until an admin chose a destination (Dashboard Needs attention: self_backup_unset)"}
        job:
          oneOf:
          - type: "null"
          - type: object
            properties:
              id: {type: string}
              destination_id: {type: [string, "null"], description: "Set when the job writes to one destination"}
              destination_group_id: {type: [string, "null"], description: "Set when the job writes to every destination of a group"}
              destination_name: {type: string, description: "Name of the destination or the group"}
              cron: {type: string}
              timezone: {type: string}
              retention: {$ref: "#/components/schemas/Retention"}
              enabled: {type: boolean}
              notify_channel_id: {type: [string, "null"]}
              created_at: {type: string, format: date-time}
        runs: {type: array, items: {$ref: "#/components/schemas/BackupRun"}, description: "With copies, repair_of and destination_name like job runs; repairs are runs of the same job"}
        restore: {$ref: "#/components/schemas/RestoreGuide", description: "Restore commands for the latest succeeded or partial original run (never a repair, which holds only the copies it completed), or null"}
        destinations_last_success: {type: array, items: {$ref: "#/components/schemas/DestinationLastSuccess"}, description: "Like BackupJob.destinations_last_success, for the olympos-self job (empty until configured)"}
    BackupRun:
      type: object
      properties:
        id: {type: string}
        job_id: {type: string}
        target_service: {type: string}
        cluster_name: {type: string}
        engine: {type: string}
        trigger: {type: string, enum: [schedule, manual, test]}
        status: {type: string, enum: [queued, running, succeeded, failed, missed, partial], description: "partial = a destination group run that wrote some but not all of its copies"}
        scheduled_for: {type: [string, "null"], format: date-time}
        tier: {type: string, enum: ["", daily, weekly, monthly, test], description: "GFS tier = blob index tag olympos-tier (test for dry runs)"}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        bytes: {type: integer}
        wire_bytes: {type: integer}
        blob_path: {type: string}
        sha256: {type: string}
        error: {type: string, description: "Secrets scrubbed; agent_disconnected: … when the agent was gone (retried after the reconnect, see attempt)"}
        attempt: {type: integer, description: "Counts every run queued for one activation (or manual request): 1 = the first; +1 for each retry after an agent disconnect (F18, retried below attempt 3, inside half the interval to the next activation) and for each repair of a partial run (repair_of set)"}
        created_at: {type: string, format: date-time}
        repair_of: {type: [string, "null"], format: uuid, description: "The run whose missing copies this run completes"}
        not_before: {type: [string, "null"], format: date-time, description: "A queued run is not started before then; set on repairs (5 min after the partial run, 30 min after the first repair, 2 h after the second), null = as soon as a worker is free"}
        destination_name: {type: string, description: "The destination the run wrote to when it wrote to exactly one, else the job's destination or group name"}
        copies:
          type: array
          description: "One result per destination, in the order the run wrote them; empty for runs from before destination groups."
          items:
            type: object
            properties:
              destination_id: {type: string, format: uuid}
              destination_name: {type: string}
              destination_kind: {type: string, enum: [azure_blob, s3, nfs]}
              status: {type: string, enum: [succeeded, failed]}
              blob_path: {type: string, description: "May be set on a failed copy (the data blob landed, the manifest did not); it is not a restore source."}
              bytes: {type: integer}
              sha256: {type: string}
              tier: {type: string}
              error: {type: string}
    ConnectionTest:
      type: object
      properties:
        ok: {type: boolean}
        server_version: {type: string}
        tls: {type: boolean}
        privileges: {type: array, items: {type: object, properties: {name: {type: string}, ok: {type: boolean}, detail: {type: string}}}}
        databases: {type: array, items: {type: string}}
        error: {type: string}

    # ---------------------------------------------------- vaults
    KVMount:
      type: object
      properties:
        path: {type: string, example: "secret/"}
        version: {type: integer, enum: [1, 2]}
        managed: {type: boolean}
        description: {type: string}
    Vault:
      type: object
      properties:
        id: {type: string}
        target: {$ref: "#/components/schemas/Target"}
        cluster_labels: {type: object, additionalProperties: {type: string}, description: Olympos labels of the vault's cluster (filtering)}
        provider: {type: string, enum: [hashicorp, openbao]}
        version: {type: string}
        status: {type: string, enum: [discovered, configured, error, gone]}
        kv_mounts: {type: array, items: {$ref: "#/components/schemas/KVMount"}}
        configured_by_name: {type: string}
        configured_at: {type: [string, "null"], format: date-time}
        secret_id_rotated_at: {type: [string, "null"], format: date-time}
        last_index_at: {type: [string, "null"], format: date-time}
        secrets: {type: integer}
        drift: {type: integer, description: open vault-drift findings}
        last_error: {type: string}
        tls_server_name: {type: string, description: "Name verified in the vault's certificate (default <svc>.<ns>.svc)"}
        transfer_mode: {type: string, enum: [e2e-tls, compressed]}
        ca_bundle_set: {type: boolean}
    SecretSummary:
      type: object
      properties:
        mount: {type: string}
        path: {type: string}
        keys: {type: integer}
        current_version: {type: integer}
        updated_time: {type: [string, "null"], format: date-time}
        managed: {type: boolean, description: false = latest version not written by Olympos (drift)}
    SecretDetail:
      type: object
      properties:
        mount: {type: string}
        path: {type: string}
        keys: {type: array, items: {type: string}}
        current_version: {type: integer}
        updated_time: {type: [string, "null"], format: date-time}
        managed: {type: boolean}
        versions:
          type: array
          items:
            type: object
            properties:
              version: {type: integer}
              created_time: {type: string, format: date-time}
              deletion_time: {type: string}
              destroyed: {type: boolean}
              by_olympos: {type: boolean}
              keys: {type: integer, description: "Optional. Number of keys in that version (destroy-history dialog)."}
        pending_change_requests: {type: integer}
        updated_by_name: {type: string, description: "Optional. Who wrote the current version (maker of the applied CR, or 'outside Olympos')."}
        key_info:
          type: array
          description: "Optional. Per-key metadata for the keys table. Never contains values."
          items:
            type: object
            properties:
              key: {type: string}
              version: {type: integer, description: Version in which the key last changed}
              updated_time: {type: [string, "null"], format: date-time}
              pending_cr_id: {type: [string, "null"]}
              pending_cr_label: {type: string}
              last_cr_id: {type: [string, "null"]}
              last_cr_label: {type: string}
    ChangeItemInput:
      type: object
      required: [mount, path, op]
      properties:
        mount: {type: string}
        path: {type: string}
        key: {type: string, description: Required except for destroy_history}
        op: {type: string, enum: [create, replace, delete, destroy_history]}
        value: {type: string, writeOnly: true, description: create/replace only}
        base_version: {type: integer, description: "Version the maker saw (cas); 0 for a new secret path"}
        versions: {type: array, items: {type: integer}, description: destroy_history only}
    ChangeRequestInput:
      type: object
      required: [vault_id, justification, items]
      properties:
        vault_id: {type: string}
        justification: {type: string, minLength: 10}
        items: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ChangeItemInput"}}
    ChangeRequest:
      type: object
      properties:
        id: {type: string}
        number: {type: string, description: "Optional. Short display number, e.g. CR-0142."}
        vault: {type: object, properties: {id: {type: string}, name: {type: string}, cluster_name: {type: string}, provider: {type: string}, version: {type: string}}}
        maker: {$ref: "#/components/schemas/Principal"}
        checker: {oneOf: [{$ref: "#/components/schemas/Principal"}, {type: "null"}]}
        justification: {type: string}
        status: {type: string, enum: [pending, approved, applying, applied, rejected, expired, failed, cancelled], description: "applying = approved and committed, the outcome of the Vault write is being recorded or reconciled (settled within ~3 minutes)"}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        decision_comment: {type: string}
        applied_at: {type: [string, "null"], format: date-time}
        failure: {type: string}
        failure_code: {type: string, enum: ["", apply_error, apply_unknown, conflict], description: "apply_unknown = the outcome was lost and the vault shows no new version (nothing changed, open a new request); conflict = the vault shows changes Olympos cannot attribute"}
        can_approve: {type: boolean, description: Caller may approve/reject}
        approve_disabled_reason: {type: string, description: 'e.g. "You opened this request"'}
        can_cancel: {type: boolean}
        eligible_approvers: {type: integer, description: "Optional. People with vault-approver in scope, excluding the maker."}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              mount: {type: string}
              path: {type: string}
              key: {type: [string, "null"]}
              op: {type: string}
              base_version: {type: integer}
              versions: {type: array, items: {type: integer}}
              fingerprint: {type: string, example: "hm:3f9a·c210·77be"}
        events:
          type: array
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              kind: {type: string, enum: [opened, notified, approved, rejected, applied, failed, expired, cancelled], description: "notified = Slack link sent (details.channel)"}
              actor_name: {type: string}
              details: {type: object}

    # ---------------------------------------------------- restores
    RestoreInput:
      type: object
      required: [run_id, target_id, justification]
      properties:
        run_id: {type: string, format: uuid}
        copy_destination_id: {type: [string, "null"], format: uuid, description: "The copy to read (group runs); default: the copy the run's restore guide selects"}
        target_id: {type: string, description: A discovered target of the same engine, in any cluster, never the backup's own}
        databases: {type: array, items: {type: string}, description: "PostgreSQL, ClickHouse: databases in the backup to restore; empty = all. Vault: none"}
        globals: {type: [boolean, "null"], description: "PostgreSQL only: restore roles from globals.sql (default on; off without a superuser credential)"}
        tls_ca_pem: {type: string, description: "PEM CA bundle to verify the target's certificate (shown to the checker)"}
        credential: {$ref: "#/components/schemas/CredentialInput", description: "PostgreSQL, ClickHouse: the target's admin login"}
        vault_token: {type: string, writeOnly: true, description: "Vault/OpenBao: a token of the new Vault that may call sys/storage/raft/snapshot-force; surrounding whitespace is trimmed; sealed until the request ends"}
        justification: {type: string, description: "10–2000 characters, checked before the target is contacted (not checked by /restores/check)"}
        break_glass: {type: boolean, description: Admins on both clusters start the request without a checker}
    RestoreOptions:
      type: object
      properties:
        globals: {type: boolean, description: PostgreSQL roles are restored}
        superuser: {type: boolean, description: "PostgreSQL: the credential is a superuser (owners and privileges are kept)"}
        tls_ca_pem: {type: string}
        notes: {type: array, items: {type: string}, description: "Open-time findings: existing empty databases restored into, no superuser"}
        server_version: {type: string}
    RestoreTargetReport:
      type: object
      properties:
        existing: {type: object, additionalProperties: {type: boolean}, description: "Selected databases that exist on the target: true when they hold user objects"}
        superuser: {type: boolean}
        initialized: {type: boolean, description: "Vault/OpenBao: the target is initialized"}
        sealed: {type: boolean, description: "Vault/OpenBao: the target is sealed"}
        can_snapshot_force: {type: boolean, description: "Vault/OpenBao: the token holds update and sudo (or root) on sys/storage/raft/snapshot-force"}
        standby: {type: boolean, description: "Vault/OpenBao: the target is an HA node that is not the active node (sys/leader ha_enabled and not is_self); the request is refused until it points at the active node"}
        capabilities_denied: {type: boolean, description: "Vault/OpenBao: sys/capabilities-self refused the token (HTTP 401/403), so its capabilities could not be read; the token needs the default policy (or access to sys/capabilities-self)"}
        server_version: {type: string}
    RestoreCheck:
      type: object
      properties:
        ok: {type: boolean}
        error: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        engine: {type: string, enum: [postgresql, clickhouse, vault]}
        copy_destination_id: {type: [string, "null"], format: uuid}
        copy_run_id: {type: [string, "null"], format: uuid, description: The run that wrote the copy (the run or one of its repairs)}
        databases_in_backup: {type: [array, "null"], items: {type: string}}
        databases: {type: [array, "null"], items: {type: string}, description: What would be restored}
        options: {$ref: "#/components/schemas/RestoreOptions"}
        report: {oneOf: [{$ref: "#/components/schemas/RestoreTargetReport"}, {type: "null"}]}
    RestoreRequest:
      type: object
      description: Never carries a password or a token.
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, running, succeeded, failed, rejected, expired, cancelled]}
        engine: {type: string, enum: [postgresql, clickhouse, vault]}
        source:
          type: object
          properties:
            run_id: {type: string, format: uuid}
            copy_run_id: {type: string, format: uuid}
            target_id: {type: string}
            cluster_id: {type: string, format: uuid}
            cluster_name: {type: string}
            namespace: {type: string}
            service: {type: string}
            destination_id: {type: string, format: uuid}
            destination_name: {type: string}
            destination_kind: {type: string}
        target:
          type: object
          properties:
            id: {type: string}
            cluster_id: {type: string, format: uuid}
            cluster_name: {type: string}
            namespace: {type: string}
            service: {type: string}
            port: {type: integer}
            vault_provider: {type: string}
        databases: {type: array, items: {type: string}}
        options: {$ref: "#/components/schemas/RestoreOptions"}
        credential:
          oneOf:
            - {type: "null"}
            - {type: object, properties: {source: {type: string, enum: [keyvault_ref, stored]}, ref: {type: string}, username: {type: string}}}
          description: The target login's public part; null once the request has ended (the credential is deleted)
        has_vault_token: {type: boolean}
        maker: {$ref: "#/components/schemas/Principal"}
        checker: {oneOf: [{$ref: "#/components/schemas/Principal"}, {type: "null"}]}
        justification: {type: string}
        break_glass: {type: boolean, description: "Started by the maker without a checker; the maker is the decider and checker stays null"}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: When a pending request expires}
        decided_at: {type: [string, "null"], format: date-time}
        decision_comment: {type: string}
        approved_expires_at: {type: [string, "null"], format: date-time, description: When an approved request that has not started expires (approval + 24h)}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        progress: {type: object}
        result: {type: object}
        error: {type: string}
        can_approve: {type: boolean}
        approve_disabled_reason: {type: string}
        can_cancel: {type: boolean}

    # ---------------------------------------------------- audit
    AuditScheduleInput:
      type: object
      properties:
        tool: {type: string, enum: [kubescape, polaris, kube-bench]}
        frameworks:
          type: array
          items: {type: string, enum: [nsa, cis, mitre]}
          description: kubescape only (default all three). "cis" maps to kubescape's CIS framework for the cluster's provider (AKS, EKS, else generic).
        scope_selector: {type: string, default: all, description: '"all" or a label selector over cluster labels, e.g. env=prod'}
        cron: {type: string, description: 5-field cron or @daily etc.}
        timezone: {type: string, default: UTC, description: IANA zone}
        enabled: {type: boolean, default: true}
        notify_channel_id: {type: [string, "null"], description: Overrides routing for audit.new_findings}
    AuditSchedule:
      allOf:
        - $ref: "#/components/schemas/AuditScheduleInput"
        - type: object
          properties:
            id: {type: string}
            next_run_at: {type: [string, "null"], format: date-time}
            clusters: {type: integer, description: clusters currently matched by scope (and visible to the caller; kube-bench counts only bench-enabled clusters)}
            last_run: {oneOf: [{$ref: "#/components/schemas/AuditRun"}, {type: "null"}]}
            created_at: {type: string, format: date-time}
    AuditRun:
      type: object
      properties:
        id: {type: string}
        schedule_id: {type: [string, "null"], description: null once the schedule was deleted}
        tool: {type: string, enum: [kubescape, polaris, kube-bench]}
        cluster_id: {type: string}
        cluster_name: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, missed], description: "missed = the agent did not come back within the retry window (F18)"}
        scheduled_for: {type: [string, "null"], format: date-time, description: null for manual runs}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        score: {type: [number, "null"], description: "0–100: kubescape compliance score, polaris score, kube-bench pass/(pass+fail)"}
        new_findings: {type: integer}
        resolved_findings: {type: integer}
        raw_blob_path: {type: string, description: "Blob path of the raw JSON report ({prefix}/audit/{cluster}/{tool}/{run_id}.json); empty when not stored"}
        error: {type: string, description: 'Short reason, e.g. "agent_offline" or "kubescape failed: framework ''cis-v1.23-t1.0.1'' not found"'}
        log: {type: string, description: "Run detail (GET /audit/runs/{id}) only: captured console output of a failed kubescape/polaris run (redacted, last 256 KiB); empty otherwise. Absent in lists."}
        details:
          type: object
          description: >-
            trigger (schedule|manual), frameworks, summary, findings_total, raw_report (why it was not stored),
            nodes_succeeded/nodes_failed/partial and control_plane ("Control plane N/A · managed") for kube-bench
        created_at: {type: string, format: date-time}
        bench_nodes:
          type: array
          description: kube-bench only (run detail)
          items:
            type: object
            properties:
              node_name: {type: string}
              benchmark: {type: string, example: aks-1.8}
              state: {type: string, enum: [pending, accepted, rejected, running, succeeded, failed]}
              pass: {type: integer}
              fail: {type: integer}
              warn: {type: integer}
              info: {type: integer}
              control_plane_na: {type: boolean, description: 'Managed cluster: show "Control plane N/A · managed" (control plane checks are never counted as failed or missing)'}
              message: {type: string}
              cluster_name: {type: string, description: "Optional. Set when one run covers several clusters."}
              duration_s: {type: number, description: "Optional. Job duration."}
              checks:
                type: array
                description: Every kube-bench result for the node (control plane sections are omitted on managed clusters)
                items:
                  type: object
                  properties:
                    id: {type: string, example: "4.2.1"}
                    section: {type: string, example: "4.2"}
                    section_text: {type: string, example: Kubelet}
                    node_type: {type: string, example: node}
                    description: {type: string}
                    status: {type: string, enum: [PASS, FAIL, WARN, INFO]}
                    scored: {type: boolean}
                    remediation: {type: string}
                    actual_value: {type: string}
                    expected_result: {type: string}
                    reason: {type: string}
    Finding:
      type: object
      properties:
        id: {type: string}
        source: {type: string}
        cluster_id: {type: string}
        cluster_name: {type: string}
        control_id: {type: string, description: 'kubescape "C-0016", polaris check ID, kube-bench "<benchmark>:<test>" e.g. "cis-1.12:4.2.6"'}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        resource_ref: {type: string, description: '"<ns>/<Kind>/<name>", "<Kind>/<name>" (cluster-scoped), polaris adds "/container:<name>", kube-bench "node/<name>"'}
        title: {type: string}
        details: {type: object}
        status: {type: string, enum: [open, resolved]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
        first_seen_run_id: {type: [string, "null"]}

    # ---------------------------------------------------- security
    Image:
      type: object
      properties:
        digest: {type: string}
        repo: {type: string, description: "Normalized repository, e.g. docker.io/library/nginx"}
        tags: {type: array, items: {type: string}}
        clusters: {type: integer}
        workloads: {type: integer}
        critical: {type: integer, description: distinct CVEs}
        high: {type: integer}
        medium: {type: integer}
        low: {type: integer}
        fixable: {type: integer, description: critical/high CVEs with a fixed version}
        scan_status: {type: string, enum: [pending, scanning, scanned, missing_credential, unavailable, failed], description: "unavailable = the digest is not in the registry (locally built or retagged, e.g. kind node images); failed = transient error, retried automatically (scan_attempts, next_retry_at)"}
        scan_error: {type: string, description: "Why the last scan did not succeed (also on list items)"}
        scan_attempts: {type: integer}
        scanned_by: {type: string, enum: ["", digest, tag], description: "tag = the running digest is not in the registry; the registry's image with the same tag was scanned instead (results may differ from what runs). vuln.critical events are emitted for digest scans only."}
        scan_note: {type: string, description: "Set with scanned_by=tag, e.g. \"Scanned by tag v1.37.0 — the running digest is not in the registry (built or retagged locally), so results are for the registry's image with that tag.\""}
        next_retry_at: {type: [string, "null"], format: date-time}
        last_scanned_at: {type: [string, "null"], format: date-time}
        registry: {type: string, description: "Matching registry host_pattern, \"public\" (anonymous pull), or \"\" (no credential)"}
    ImageDetail:
      allOf:
        - $ref: "#/components/schemas/Image"
        - type: object
          properties:
            usage:
              type: array
              items: {type: object, properties: {cluster_id: {type: string}, cluster_name: {type: string}, namespace: {type: string}, workload_kind: {type: string}, workload_name: {type: string}, container: {type: string}, image: {type: string, description: image string from the pod spec}}}
            vulns:
              type: array
              items: {type: object, properties: {cve_id: {type: string}, severity: {type: string, enum: [critical, high, medium, low, unknown]}, package: {type: string}, installed: {type: string}, fixed_in: {type: string}, title: {type: string}}}
            scan_error: {type: string}
    KyvernoPolicy:
      type: object
      properties:
        cluster_id: {type: string}
        cluster_name: {type: string}
        kind: {type: string, enum: [ClusterPolicy, Policy, ValidatingPolicy, NamespacedValidatingPolicy, ImageValidatingPolicy, NamespacedImageValidatingPolicy]}
        namespace: {type: string, description: empty = ClusterPolicy}
        name: {type: string}
        mode: {type: string, enum: [Enforce, Audit], description: Enforce when any validate rule (or namespace override) enforces}
        rules: {type: integer}
        rule_names: {type: array, items: {type: string}}
        fail_count: {type: integer}
        ready: {type: boolean}
    KyvernoCluster:
      type: object
      properties:
        cluster_id: {type: string}
        cluster_name: {type: string}
        installed: {type: boolean, description: false when the Kyverno CRDs are absent}
        policies: {type: integer}
        fail_count: {type: integer}
        reported_at: {type: string, format: date-time}
    NetpolNamespace:
      type: object
      properties:
        cluster_id: {type: string}
        cluster_name: {type: string}
        namespace: {type: string}
        policy_count: {type: integer}
        default_deny: {type: boolean, description: "a policy selects all pods, policyTypes include Ingress, no ingress rules"}
        excluded: {type: boolean, description: system namespace}
    RegistryInput:
      type: object
      description: "POST requires host_pattern. username and password go together."
      properties:
        host_pattern:
          type: string
          example: "*.azurecr.io"
          description: >
            Registry host ("acr.contoso.io", "*.azurecr.io") or host/path ("ghcr.io/contoso/*"). The most specific
            match wins. A wildcard host must end in a registry domain ("*" and "*.io" are rejected).
        username: {type: string}
        password:
          type: object
          description: Write-only registry password or token. Either a Key Vault reference or a value stored envelope-encrypted.
          required: [source]
          properties:
            source: {type: string, enum: [keyvault_ref, stored, none], description: "none (PATCH only) removes the credential"}
            ref: {type: string, example: "kv://kv-platform-weu/acr-pull"}
            value: {type: string, writeOnly: true}
    Registry:
      type: object
      properties:
        id: {type: string}
        host_pattern: {type: string}
        username: {type: string}
        credential_source: {type: string, enum: ["", keyvault_ref, stored], description: '"" = anonymous pull'}
        credential_ref: {type: string, description: kv:// reference (keyvault_ref only)}
        images: {type: integer, description: running images (in the caller's scope) matched by this registry}
        created_at: {type: string, format: date-time}
    UnmatchedRegistry:
      type: object
      properties:
        host: {type: string}
        images: {type: integer, description: images in missing_credential}
        example_repo: {type: string}

    ActivityEntry:
      type: object
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        actor_id: {type: [string, "null"]}
        actor_name: {type: string}
        actor_kind: {type: string, enum: [user, system, agent]}
        action: {type: string, example: cr.approved}
        object_type: {type: string}
        object_id: {type: string}
        cluster_id: {type: [string, "null"]}
        details: {type: object}

    # ------------------------------------------------------------ synthetic monitoring
    SyntheticCellState:
      type: string
      enum: [failing, degraded, passing, probe_offline, not_installed, excluded, paused, no_data]
      description: >-
        failing: the cluster alert fires. degraded: the last counted run failed or errored, the alert does not
        fire (yet). probe_offline: offline, or enrolled and not connected yet. not_installed: no probe (or revoked).
        Excluded wins over paused, paused over the probe, the probe over the alert.
    SyntheticStep:
      type: object
      description: "Exactly one of dns, http, tcp, tls, the one kind names. ${name} variables come from earlier extracts; never in a host."
      required: [kind]
      properties:
        position: {type: integer, description: Ignored on input; the server numbers steps in order}
        kind: {type: string, enum: [dns, http, tcp, tls]}
        dns: {type: object, properties: {name: {type: string}, record_type: {type: string, enum: [A, AAAA, CNAME, TXT]}}}
        http:
          type: object
          properties:
            method: {type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]}
            url: {type: string, example: "https://api.prod.wrw.com/v1/items/${item}"}
            headers: {type: [object, "null"], additionalProperties: {type: string}, description: "null when hidden"}
            body: {type: [string, "null"], maxLength: 65536, description: "null when hidden"}
            body_type: {type: string, enum: [text, json]}
            follow_redirects: {type: boolean, description: At most 5}
        tcp: {type: object, properties: {host: {type: string}, port: {type: integer}}}
        tls: {type: object, properties: {host: {type: string}, port: {type: integer}, sni: {type: string}}}
        credential_id: {type: string, format: uuid, description: HTTP steps only}
        credential:
          type: object
          readOnly: true
          description: The credential's name and kind, never its value (Copy as curl puts $TOKEN in its place)
          properties: {id: {type: string, format: uuid}, name: {type: string}, kind: {type: string}, header_name: {type: string}}
        assertions:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              subject: {type: string, description: "status_code, latency_ms, header:<Name>, body, json:<path>, tls_days_left, record_count, record, connects, chain_valid, hostname_matches, tls_version"}
              operator: {type: string, enum: [equals, not_equals, contains, matches, less_than, greater_than, exists, length_greater_than]}
              value: {type: string}
        extracts:
          type: array
          maxItems: 10
          items: {type: object, properties: {name: {type: string}, source: {type: string, enum: [json_path, header, regex]}, expr: {type: string}}}
        hidden: {type: boolean, readOnly: true, description: "The caller may not see this step's headers and body (it uses a credential)"}
    ScenarioAlertRule:
      type: object
      properties:
        cluster_fail_after: {type: integer, minimum: 1, maximum: 1000, default: 3}
        fleet_critical_clusters: {type: integer, minimum: 1, maximum: 1000, default: 3}
        recovery_after: {type: integer, minimum: 1, maximum: 1000, default: 2}
        send_recovery: {type: boolean, default: true}
        channel_id: {type: [string, "null"], format: uuid, description: "null: the routes of the synthetic.* events decide"}
        critical_channel_id: {type: [string, "null"], format: uuid, description: "null: channel_id"}
        channel_name: {type: string, readOnly: true}
        critical_channel_name: {type: string, readOnly: true}
    ScenarioInput:
      type: object
      required: [name, type, interval_seconds, timeout_seconds, steps]
      properties:
        name: {type: string, maxLength: 200}
        type: {type: string, enum: [http_flow, http, dns, tcp, tls], description: "A single-step type has exactly one step of its kind"}
        owner_selector: {type: string, example: team=payments, description: "A display and filter label (key=value), not a scope"}
        interval_seconds: {type: integer, minimum: 30}
        timeout_seconds: {type: integer, minimum: 1, maximum: 60, description: "Deadline of the whole run; at most the interval"}
        step_retries: {type: integer, minimum: 0, maximum: 2}
        enabled: {type: boolean, default: true}
        store_responses: {type: boolean, default: true}
        run_on: {type: string, enum: [all, selector], default: all}
        run_on_selector: {type: string, example: "env=prod", description: "Label selector over the cluster labels (olympos.io/cluster=<name> selects one)"}
        exclude_selectors: {type: array, items: {type: string}}
        steps: {type: array, maxItems: 10, items: {$ref: "#/components/schemas/SyntheticStep"}}
        alerts: {$ref: "#/components/schemas/ScenarioAlertRule"}
    ScenarioTargets:
      type: object
      description: Where the scenario runs, among the clusters the caller reads
      properties:
        runs_on: {type: integer}
        of: {type: integer}
        clusters: {type: array, items: {type: string}}
        excluded: {type: array, items: {type: string}}
    Scenario:
      allOf:
        - {$ref: "#/components/schemas/ScenarioInput"}
        - type: object
          properties:
            id: {type: string, format: uuid}
            alerts: {$ref: "#/components/schemas/ScenarioAlertRule"}
            targets: {$ref: "#/components/schemas/ScenarioTargets"}
            requests_per_minute: {type: number, description: Worst case per cluster}
            can_edit: {type: boolean}
            created_by: {type: [string, "null"], format: uuid}
            created_by_name: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ScenarioSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string}
        owner_selector: {type: string}
        interval_seconds: {type: integer}
        timeout_seconds: {type: integer}
        enabled: {type: boolean}
        run_on: {type: string}
        run_on_selector: {type: string}
        exclude_selectors: {type: array, items: {type: string}}
        steps: {type: integer}
        targets: {$ref: "#/components/schemas/ScenarioTargets"}
        can_edit: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ScenarioPreview:
      allOf:
        - {$ref: "#/components/schemas/ScenarioTargets"}
        - type: object
          properties:
            requests_per_minute: {type: number}
            scenario_cap: {type: number}
            cluster_cap: {type: number}
            over_scenario_cap: {type: boolean}
            over_limit:
              type: array
              description: Clusters where the per-cluster cap blocks the scenario, with what all scenarios there ask for
              items: {type: object, properties: {cluster: {type: string}, requests_per_minute: {type: number}}}
    SyntheticCell:
      type: object
      properties:
        cluster_id: {type: string, format: uuid}
        state: {$ref: "#/components/schemas/SyntheticCellState"}
        last_run_id: {type: [string, "null"], format: uuid}
        last_status: {type: [string, "null"], enum: [passed, failed, error, null]}
        last_finished_at: {type: [string, "null"], format: date-time}
        failed_step: {type: [integer, "null"]}
        failure_reason: {type: string, description: "Probe codes (host_not_allowed, ip_denied, redirect_blocked, dns_error, connect_error, tls_error, timeout, assertion_failed, invalid_request, credential_error, runner_panic) or server codes (credential_expired, dispatch_error, no_result, invalid_result, ...)"}
        consecutive_failures: {type: integer}
        blocked_reason: {type: string, description: "rate_limit: a request cap keeps the scheduler from running it there"}
    SyntheticOverview:
      type: object
      properties:
        kpis:
          type: object
          properties:
            scenarios: {type: integer}
            active: {type: integer}
            paused: {type: integer}
            failing_scenarios: {type: integer}
            failing_clusters: {type: integer}
            degraded_scenarios: {type: integer}
            degraded_clusters: {type: integer}
            probes_online: {type: integer}
            probes_total: {type: integer}
            probes_offline: {type: array, items: {type: string}}
            probes_not_installed: {type: array, items: {type: string}}
        clusters:
          type: array
          description: The matrix columns, by name
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              probe_status: {type: string, enum: [not_installed, pending, online, offline, revoked]}
              probe_version: {type: string}
              probe_last_seen_at: {type: [string, "null"], format: date-time}
        scenarios:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              type: {type: string}
              owner_selector: {type: string}
              interval_seconds: {type: integer}
              enabled: {type: boolean}
              steps: {type: integer}
              status: {type: string, enum: [failing, degraded, passing, paused, no_data]}
              failing_clusters: {type: integer}
              degraded_clusters: {type: integer}
              cells: {type: array, items: {$ref: "#/components/schemas/SyntheticCell"}}
              runs_24h: {type: integer}
              availability_24h: {type: [number, "null"], description: "Percent of counted runs that passed, two decimals"}
              p95_ms_24h: {type: [integer, "null"]}
              can_edit: {type: boolean}
    ScenarioClusters:
      type: object
      properties:
        window_start: {type: string, format: date-time}
        bucket_minutes: {type: integer, example: 30}
        buckets: {type: integer, example: 48}
        items:
          type: array
          items:
            type: object
            properties:
              cluster_id: {type: string, format: uuid}
              cluster_name: {type: string}
              probe_status: {type: string}
              state: {$ref: "#/components/schemas/SyntheticCellState"}
              last_run:
                type: [object, "null"]
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string}
                  finished_at: {type: string, format: date-time}
                  failed_step: {type: [integer, "null"]}
                  failure_reason: {type: string}
              consecutive_failures: {type: integer}
              consecutive_passes: {type: integer}
              blocked_reason: {type: string}
              runs_24h: {type: integer}
              availability_24h: {type: [number, "null"]}
              p50_ms: {type: [integer, "null"]}
              p95_ms: {type: [integer, "null"]}
              timeline:
                type: array
                items:
                  type: object
                  properties:
                    start: {type: string, format: date-time}
                    runs: {type: integer}
                    passed: {type: integer}
                    failed: {type: integer}
                    state: {type: string, enum: [passed, failed, no_data]}
    SyntheticAlert:
      type: object
      properties:
        id: {type: string, format: uuid}
        fleet: {type: boolean}
        cluster_id: {type: [string, "null"], format: uuid}
        cluster_name: {type: string}
        state: {type: string, enum: [firing, resolved]}
        reason: {type: string, description: "The failure reason of the run that opened it; no_longer_monitored when it resolved without a run"}
        opened_at: {type: string, format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
        duration_seconds: {type: [integer, "null"]}
        last_run_id: {type: [string, "null"], format: uuid}
        failed_step: {type: [integer, "null"]}
        clusters: {type: array, items: {type: string}, description: "Fleet alert: the failing clusters (that the caller reads) when it opened"}
        clusters_total: {type: integer}
        still_failing: {type: [integer, "null"]}
        notified: {type: boolean}
    SyntheticRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        scenario_id: {type: [string, "null"], format: uuid, description: "null for a test run of an unsaved draft"}
        scenario_name: {type: string}
        cluster_id: {type: string, format: uuid}
        cluster_name: {type: string}
        scheduled_for: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        status: {type: string, enum: [scheduled, running, passed, failed, error, skipped]}
        failed_step: {type: [integer, "null"]}
        failure_reason: {type: string, description: "Skipped: probe_offline, probe_disconnected, scenario_disabled, credential_unavailable, not_dispatched, probe_busy, allowlist_stale, credentials_unreadable, invalid_scenario, rejected"}
        total_ms: {type: [integer, "null"]}
        test: {type: boolean}
        manual: {type: boolean}
        probe_version: {type: string}
    SyntheticRunDetail:
      allOf:
        - {$ref: "#/components/schemas/SyntheticRun"}
        - type: object
          properties:
            scenario_type: {type: string}
            remote_ip: {type: string}
            probe_ip: {type: string, description: The probe's egress address}
            allowlist_version: {type: integer}
            requested_by_name: {type: string}
            consecutive_failures: {type: integer, description: "Failed or errored run: how many in a row it ends"}
            alert:
              type: [object, "null"]
              description: The cluster alert this run opened or resolved
              properties:
                id: {type: string, format: uuid}
                state: {type: string}
                opened_at: {type: string, format: date-time}
                resolved_at: {type: [string, "null"], format: date-time}
            definition: {type: string, enum: [test, saved, none], description: "Where the requests come from: the test run's draft, the scenario as saved now, or none (deleted)"}
            steps:
              type: array
              items:
                type: object
                properties:
                  position: {type: integer}
                  status: {type: string, description: Empty when the probe reported nothing for the step}
                  status_code: {type: [integer, "null"]}
                  timings: {type: [object, "null"], properties: {dns_us: {type: integer}, connect_us: {type: integer}, tls_us: {type: integer}, ttfb_us: {type: integer}, download_us: {type: integer}, total_us: {type: integer}}}
                  assertions:
                    type: array
                    items: {type: object, properties: {subject: {type: string}, operator: {type: string}, expected: {type: string}, actual: {type: string}, passed: {type: boolean}}}
                  excerpt: {type: [string, "null"], description: "First 2 KiB of the response, redacted on the probe and the server"}
                  extracted_names: {type: array, items: {type: string}, description: Names only; values are never stored}
                  error: {type: string}
                  request: {oneOf: [{$ref: "#/components/schemas/SyntheticStep"}, {type: "null"}]}
    AllowRule:
      type: object
      properties:
        id: {type: string, format: uuid}
        pattern: {type: string, description: "Normalized: lower case, IDNA, no trailing dot"}
        kind: {type: string, enum: [exact, wildcard, suffix]}
        note: {type: string}
        scenarios: {type: integer, description: Scenarios that reach a host the rule matches}
        created_by: {type: [string, "null"], format: uuid}
        created_by_name: {type: string}
        created_at: {type: string, format: date-time}
    HostCheck:
      type: object
      properties:
        host: {type: string, description: Normalized when it could be}
        allowed: {type: boolean}
        rule: {oneOf: [{$ref: "#/components/schemas/AllowRule"}, {type: "null"}], description: The first rule that matches}
        also: {type: array, items: {$ref: "#/components/schemas/AllowRule"}, description: Other rules that match}
        denied_reason: {type: string, enum: ["", ip_literal, always_denied, invalid_host, no_rule]}
        message: {type: string}
    InUse:
      type: object
      description: A 409 that names what still needs the object
      properties:
        error: {type: string}
        scenarios: {type: array, items: {type: string}}
        credentials: {type: array, items: {type: string}}
    SyntheticCredentialInput:
      type: object
      required: [name, kind, bound_hosts]
      properties:
        name: {type: string, maxLength: 200}
        kind: {type: string, enum: [bearer, basic, header, oauth2_client_credentials]}
        bound_hosts:
          type: array
          minItems: 1
          maxItems: 20
          description: The only hosts the credential is attached to; each inside the allowlist
          items: {type: object, required: [pattern, kind], properties: {pattern: {type: string}, kind: {type: string, enum: [exact, wildcard, suffix]}}}
        secret:
          allOf: [{$ref: "#/components/schemas/CredentialInput"}]
          description: >-
            Required on create; on update it rotates the secret. password is the token, password or client
            secret. username: the login (basic) or the client id (oauth2_client_credentials); none for bearer and
            header.
        header_name: {type: string, example: X-Api-Key, description: "Header credentials only. Not Host, Content-Length, Transfer-Encoding, Connection, Cookie, Upgrade, TE, Trailer, Keep-Alive, Proxy-Connection, Content-Type, Accept-Encoding, Range or If-Range (422)."}
        oauth_token_url: {type: string, description: "oauth2_client_credentials only: https, allowlisted, inside bound_hosts"}
        oauth_scopes: {type: string}
        expires_at: {type: [string, "null"], format: date-time, description: "In the future (create and update); null for none. synthetic.credential_expiring fires 14 and 3 days before"}
    SyntheticCredential:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string}
        bound_hosts: {type: array, items: {type: object, properties: {pattern: {type: string}, kind: {type: string}}}}
        header_name: {type: string}
        oauth_token_url: {type: string}
        oauth_scopes: {type: string}
        source: {type: string, enum: [stored, keyvault_ref]}
        expires_at: {type: [string, "null"], format: date-time}
        expired: {type: boolean}
        rotated_at: {type: [string, "null"], format: date-time}
        scenarios: {type: array, items: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}}}}
        resolve_failures_24h: {type: integer, description: "Runs of the scenarios using it skipped in 24 h because the server could not resolve a credential (credential_unavailable); an upper bound when a scenario uses several"}
        last_resolve_failed_at: {type: [string, "null"], format: date-time}
        created_by: {type: [string, "null"], format: uuid}
        created_by_name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
