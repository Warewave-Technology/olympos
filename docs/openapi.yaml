openapi: 3.1.0
info:
  title: Olympos API
  version: "1.0"
  description: |
    REST API of the Olympos server (SPEC §16). JSON only.

    **Auth**: BFF session. The SPA never sees tokens. `GET /auth/login?return_to=/path` starts Entra sign-in;
    the server sets `olympos_session` (HttpOnly) and `olympos_csrf` (readable) cookies. Every state-changing
    request (POST/PUT/PATCH/DELETE) MUST send header `X-CSRF-Token: <olympos_csrf cookie>`. `POST /auth/logout` ends the session.
    In dev mode `GET /auth/dev-login?oid=<object-id>&name=&upn=` signs in a principal.

    **Errors**: `{"error": "...", "fields": {"name": "..."}}`. 401 = not signed in / session expired (SPA redirects to /login),
    403 = visible object but role does not allow, 404 = missing or outside the caller's scope (never 403), 409 = conflict,
    422 = validation (`fields` per input).

    **Lists** return `{"items": [...]}`. Times are RFC 3339. Sizes in bytes. CPU in millicores.

    **Secret values are never returned** by any endpoint. Write-only fields are marked `writeOnly`.
servers:
  - url: /api/v1
tags:
  - {name: identity}
  - {name: clusters}
  - {name: notifications}
  - {name: backups}
  - {name: vaults}
  - {name: approvals}
  - {name: audit}
  - {name: security}
  - {name: activity}

paths:
  /me:
    get:
      tags: [identity]
      responses:
        "200": {description: Current user, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}

  /dashboard:
    get:
      tags: [clusters]
      responses:
        "200": {description: Fleet overview, content: {application/json: {schema: {$ref: "#/components/schemas/Dashboard"}}}}

  /clusters:
    get:
      tags: [clusters]
      responses:
        "200": {description: Clusters in scope, content: {application/json: {schema: {$ref: "#/components/schemas/ClusterList"}}}}
    post:
      tags: [clusters]
      summary: Add cluster (admin, scope all). Returns the one-time Helm install command (token TTL 1 h).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"}
                labels: {type: object, additionalProperties: {type: string}}
                bench_enabled: {type: boolean}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/InstallResponse"}}}}
  /clusters/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [clusters]
      responses:
        "200": {description: Cluster, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}
    patch:
      tags: [clusters]
      summary: Update labels, provider override, transfer mode, egress rate (admin, scope all).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                labels: {type: object, additionalProperties: {type: string}}
                provider_override: {type: string, enum: ["", azure, aws, gcp, oracle, huawei, onprem]}
                transfer_mode: {type: string, enum: [e2e-tls, compressed]}
                egress_rate_per_gb: {type: number, minimum: 0}
                clear_egress_rate: {type: boolean}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}
    delete:
      tags: [clusters]
      summary: Revoke the cluster (cert serial denied, streams dropped). Irreversible.
      responses:
        "204": {description: Revoked}
  /clusters/{id}/token:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [clusters]
      summary: Issue a fresh bootstrap token / install command (invalidates unused ones).
      responses:
        "200": {description: Install command, content: {application/json: {schema: {$ref: "#/components/schemas/InstallResponse"}}}}
  /clusters/{id}/nodes:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [clusters]
      responses:
        "200":
          description: Nodes
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Node"}}}}}}
  /targets:
    get:
      tags: [clusters]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [candidate, configured, gone]}}
        - {name: engine, in: query, schema: {type: string, enum: [postgresql, clickhouse, vault]}}
      responses:
        "200":
          description: Discovered targets
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Target"}}}}}}

  # ------------------------------------------------------------ access
  /grants:
    get:
      tags: [identity]
      responses:
        "200":
          description: Active grants
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Grant"}}}}}}
    post:
      tags: [identity]
      summary: Grant roles to a person by Entra object ID (admin, scope all). vault-approver/admin refused for guests (422).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [object_id, roles]
              properties:
                object_id: {type: string, format: uuid}
                roles: {type: array, items: {$ref: "#/components/schemas/Role"}}
                scope: {type: string, description: '"all" or a label selector over cluster labels, e.g. "env=prod,team in (a,b)"'}
      responses:
        "201": {description: Created, content: {application/json: {schema: {type: object, properties: {ids: {type: array, items: {type: string}}}}}}}
  /grants/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [identity]
      responses:
        "204": {description: Revoked}
        "409": {description: Last admin with scope all}
  /principals/search:
    get:
      tags: [identity]
      summary: Directory (Graph) lookup, min 2 chars.
      parameters: [{name: q, in: query, required: true, schema: {type: string}}]
      responses:
        "200":
          description: People
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/DirectoryUser"}}}}}}

  # ------------------------------------------------------------ notifications (M2)
  /notifications/channels:
    get:
      tags: [notifications]
      responses:
        "200":
          description: Channels
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Channel"}}}}}}
    post:
      tags: [notifications]
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ChannelInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
  /notifications/channels/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [notifications]
      responses:
        "200": {description: Channel, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
    patch:
      tags: [notifications]
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ChannelInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
    delete:
      tags: [notifications]
      responses:
        "204": {description: Deleted (routes to it are removed)}
        "409": {description: Used as override channel by backup jobs or audit schedules}
  /notifications/channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [notifications]
      summary: Send a test message to the channel now.
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string}}}}}}
  /notifications/routes:
    get:
      tags: [notifications]
      responses:
        "200": {description: Event catalog and routing, content: {application/json: {schema: {$ref: "#/components/schemas/Routes"}}}}
    put:
      tags: [notifications]
      summary: Replace all routes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                routes: {type: array, items: {$ref: "#/components/schemas/Route"}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/Routes"}}}}

  # ------------------------------------------------------------ destinations (M2)
  /destinations:
    get:
      tags: [backups]
      responses:
        "200":
          description: Destinations
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Destination"}}}}}}
    post:
      tags: [backups]
      summary: Create destination (admin, scope all). Runs the destination test first; 422 if the test fails. A credential that can delete is saved with a warning (never silently).
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationInput"}}}}
      responses:
        "201": {description: Created (check `warnings`), content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}
        "409": {description: Name already used}
        "422": {description: Invalid input (fields) or destination test failed (test), content: {application/json: {schema: {$ref: "#/components/schemas/DestinationTestFailed"}}}}
  /destinations/mounts:
    get:
      tags: [backups]
      summary: Volumes mounted into the server that NFS destinations may use.
      responses:
        "200":
          description: Mounts
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/DestinationMount"}}}}}}
  /destinations/test:
    post:
      tags: [backups]
      summary: Test an unsaved destination (probe write, read, tag, delete-refused check, SAS parse).
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationInput"}}}}
      responses:
        "200": {description: Report, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationTest"}}}}
  /destinations/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [backups]
      responses:
        "200": {description: Destination, content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}
    patch:
      tags: [backups]
      summary: Partial update (absent fields keep their value; omit `sas` to keep the current SAS). Re-runs the destination test like create.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/DestinationInput"}}}}
      responses:
        "200": {description: Updated (check `warnings`), content: {application/json: {schema: {$ref: "#/components/schemas/Destination"}}}}
        "409": {description: Name already used}
        "422": {description: Invalid input or destination test failed, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationTestFailed"}}}}
    delete:
      tags: [backups]
      responses:
        "204": {description: Deleted}
        "409": {description: Used by backup jobs}
  /destinations/{id}/test:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [backups]
      responses:
        "200": {description: Report, content: {application/json: {schema: {$ref: "#/components/schemas/DestinationTest"}}}}

  # ------------------------------------------------------------ backups (M2)
  /backup/jobs:
    get:
      tags: [backups]
      parameters:
        - {name: target_id, in: query, schema: {type: string}}
      responses:
        "200":
          description: Jobs in scope
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/BackupJob"}}}}}}
    post:
      tags: [backups]
      summary: Create a job (operator on the target's cluster; 404 when the target is outside the caller's scope). Usually created disabled, then dry-run, then enabled. Sets the target to `configured`.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/BackupJobInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/BackupJob"}}}}
        "422": {description: "Validation (cron, timezone, credential.*, destination_id, ...)"}
  /backup/jobs/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [backups]
      responses:
        "200": {description: Job, content: {application/json: {schema: {$ref: "#/components/schemas/BackupJob"}}}}
    patch:
      tags: [backups]
      summary: Partial update. target_id cannot change. A new credential replaces (and deletes) the old one. Enabling or changing the schedule restarts it from now.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/BackupJobInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/BackupJob"}}}}
    delete:
      tags: [backups]
      summary: Delete the job (soft delete; runs and blobs are kept, the job's credential is removed, queued runs fail).
      responses: {"204": {description: Deleted}}
  /backup/jobs/{id}/run:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [backups]
      summary: Queue a manual run, or a dry run with trigger=test (small test backup, e.g. schema-only for Postgres).
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {trigger: {type: string, enum: [manual, test], default: manual}}}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {$ref: "#/components/schemas/BackupRun"}}}}
        "409": {description: A run of this job is already queued or running, or the target is gone}
  /backup/clusters:
    get:
      tags: [backups]
      summary: Per-cluster backup summary.
      responses:
        "200":
          description: One row per cluster in read scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        targets: {type: integer}
                        candidates: {type: integer, description: targets without a job}
                        jobs: {type: integer}
                        jobs_enabled: {type: integer}
                        last_24h: {type: object, properties: {succeeded: {type: integer}, failed: {type: integer}, missed: {type: integer}}}
                        last_success_at: {type: [string, "null"], format: date-time}
                        bytes_30d: {type: integer}
  /backup/runs:
    get:
      tags: [backups]
      parameters:
        - {name: job_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        "200":
          description: Runs newest first
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/BackupRun"}}}}}}
  /backup/runs/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [backups]
      responses:
        "200": {description: Run, content: {application/json: {schema: {$ref: "#/components/schemas/BackupRun"}}}}
  /backup/test-connection:
    post:
      tags: [backups]
      summary: >-
        Real connection check through the tunnel (operator on the target's cluster). Shows version, TLS and privileges.
        Never echoes the password. Records the target's detected_version/tls_ok and opens or resolves its tls.missing finding.
        The cluster's agent must be connected to the replica serving the request (else error "agent_offline").
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: {type: string}
                credential: {$ref: "#/components/schemas/CredentialInput"}
                credential_id: {type: string, description: "Existing credential of a job on this same target (instead of credential)"}
                engine_options: {type: object, description: Same as BackupJobInput.engine_options}
      responses:
        "200": {description: Result, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectionTest"}}}}
  /backup/schedule-preview:
    get:
      tags: [backups]
      parameters:
        - {name: cron, in: query, required: true, schema: {type: string}}
        - {name: timezone, in: query, schema: {type: string, default: UTC}}
        - {name: count, in: query, schema: {type: integer, default: 5}}
      responses:
        "200":
          description: Next run times (count max 50)
          content: {application/json: {schema: {type: object, properties: {next: {type: array, items: {type: string, format: date-time}}, description: {type: string}}}}}
        "422": {description: "Invalid cron (fields.cron) or time zone (fields.timezone)"}

  # ------------------------------------------------------------ vaults (M3)
  /vaults:
    get:
      tags: [vaults]
      responses:
        "200":
          description: Discovered and configured vaults in scope
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Vault"}}}}}}
  /vaults/search:
    get:
      tags: [vaults]
      summary: Find vaults and secret paths across every vault the caller can read (name, cluster, namespace, provider, indexed paths).
      parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 2}}]
      responses:
        "200":
          description: Matches, vault matches first, max 50
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        match: {type: string, enum: [vault, path]}
                        vault_id: {type: string}
                        vault_name: {type: string}
                        provider: {type: string}
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        namespace: {type: string}
                        mount: {type: string, description: "path matches only"}
                        path: {type: string, description: "path matches only"}
                        keys: {type: integer}
  /vaults/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [vaults]
      responses:
        "200": {description: Vault, content: {application/json: {schema: {$ref: "#/components/schemas/Vault"}}}}
  /vaults/{id}/inspect:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [vaults]
      summary: "Admin. Before configure, list KV mounts using the pasted root token (token used once, never stored). TLS only."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [root_token]
              properties:
                root_token: {type: string, writeOnly: true}
                ca_bundle: {type: string, description: "Optional PEM bundle to verify the vault's TLS certificate (e2e-tls mode), not stored by inspect"}
      responses:
        "200":
          description: Mounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  sealed: {type: boolean}
                  storage_type: {type: string, description: "e.g. raft (required for snapshot backups)"}
                  mounts: {type: array, items: {$ref: "#/components/schemas/KVMount"}}
        "400": {description: Root token sent over plain HTTP}
        "403": {description: Not admin on the vault's cluster}
        "422": {description: Token rejected by Vault, or invalid CA bundle}
        "502": {description: Vault unreachable through the tunnel}
  /vaults/{id}/configure:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [vaults]
      summary: "Admin. Creates policy `olympos` + AppRole `olympos`, stores secret_id in Key Vault, verifies login, discards the root token."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [root_token, mounts]
              properties:
                root_token: {type: string, writeOnly: true}
                mounts: {type: array, items: {type: string}, description: 'KV v2 mount paths to manage, e.g. "secret/". KV v1 mounts are rejected (read-only, keys not listed).'}
                ca_bundle: {type: string, description: "Optional PEM bundle stored on the vault and used to verify its certificate end-to-end (not secret)"}
      responses:
        "200": {description: Configured, content: {application/json: {schema: {$ref: "#/components/schemas/Vault"}}}}
        "400": {description: Root token sent over plain HTTP}
        "403": {description: Not admin on the vault's cluster}
        "409": {description: Vault sealed/uninitialized, gone, or approle/ path used by another auth method}
        "422": {description: "Invalid mounts (`fields.mounts`), token rejected, invalid CA bundle"}
        "502": {description: A Vault step failed (safe message)}
  /vaults/{id}/refresh:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [vaults]
      summary: Refresh the secret index (and drift detection) now. operator, vault-maker or vault-approver in scope.
      responses:
        "202": {description: Started}
        "403": {description: Viewer}
        "409": {description: Vault not configured}
  /vaults/{id}/tree:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [vaults]
      parameters: [{name: mount, in: query, schema: {type: string}}]
      responses:
        "200":
          description: Indexed secret paths (from vault_secret_index)
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/SecretSummary"}}}}}}
  /vaults/{id}/secrets/{path}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: path, in: path, required: true, schema: {type: string}, description: "Secret path below the mount, may contain slashes"}
      - {name: mount, in: query, required: true, schema: {type: string}}
    get:
      tags: [vaults]
      summary: Keys and versions only (from the index; key names come from KV v2 subkeys). Values are never returned.
      responses:
        "404": {description: Not indexed, or vault outside scope}
        "200": {description: Secret, content: {application/json: {schema: {$ref: "#/components/schemas/SecretDetail"}}}}

  # ------------------------------------------------------------ change requests (M3)
  /change-requests:
    get:
      tags: [approvals]
      parameters:
        - {name: mine, in: query, schema: {type: boolean}}
        - {name: waiting_for_me, in: query, schema: {type: boolean}}
        - {name: status, in: query, schema: {type: string}}
        - {name: vault_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 200}}
      responses:
        "200":
          description: Change requests in read scope, newest first (items without events)
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ChangeRequest"}}}}}}
    post:
      tags: [approvals]
      summary: "vault-maker in scope. New values are sealed at submit (envelope, AAD change_items:<id>); only HMAC fingerprints are ever shown. Expires after changeRequests.ttl (default 72h)."
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequestInput"}}}}
      responses:
        "201": {description: Opened, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: Not vault-maker on the vault's cluster}
        "404": {description: Vault missing or outside scope}
        "409": {description: Vault not configured}
        "422": {description: "Validation: justification >= 10 chars, managed KV v2 mount, key required (except destroy_history), value required for create/replace and forbidden for delete/destroy_history, versions for destroy_history only, one base_version per path"}
  /change-requests/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [approvals]
      responses:
        "200": {description: Change request with trail, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
  /change-requests/{id}/approve:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: "vault-approver in scope, maker ≠ checker by (tenant_id, object_id) (no bypass, admin included), never a guest. Applies immediately: items on one path → one PATCH (merge-patch, options.cas = base_version); new path → POST cas 0; destroy_history → POST destroy."
      requestBody: {content: {application/json: {schema: {type: object, properties: {comment: {type: string}}}}}}
      responses:
        "200": {description: Approved (status applied or failed; failure has a safe message such as a check-and-set conflict), content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: 'Own request ("You opened this request"), guest, or not an approver'}
        "404": {description: Missing or outside scope}
        "409": {description: Already decided or expired}
  /change-requests/{id}/reject:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: Same rules as approve. A comment is required.
      requestBody: {content: {application/json: {schema: {type: object, required: [comment], properties: {comment: {type: string}}}}}}
      responses:
        "200": {description: Rejected, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: Own request, guest, or not an approver}
        "409": {description: Already decided or expired}
        "422": {description: Comment missing}
  /change-requests/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [approvals]
      summary: Maker withdraws a pending request.
      responses:
        "200": {description: Cancelled, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeRequest"}}}}
        "403": {description: Not the maker}
        "409": {description: Not pending}

  # ------------------------------------------------------------ audit (M4)
  /audit/schedules:
    get:
      tags: [audit]
      summary: List audit schedules (any role). `clusters` and `last_run` only count clusters the caller can read.
      responses:
        "200":
          description: Schedules
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditSchedule"}}}}}}
    post:
      tags: [audit]
      summary: Create a schedule (operator with scope all — schedules are global objects). `tool` is required.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/AuditScheduleInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/AuditSchedule"}}}}
        "403": {description: Not operator with scope all}
        "422": {description: "Validation (`fields`: tool, frameworks, scope_selector, cron, timezone, notify_channel_id)"}
  /audit/schedules/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    patch:
      tags: [audit]
      summary: Update a schedule (operator with scope all). Omitted fields are kept; `notify_channel_id` null clears it. `tool` cannot change (422). Changing cron/timezone or re-enabling restarts the schedule from now.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/AuditScheduleInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/AuditSchedule"}}}}
        "403": {description: Not operator with scope all}
        "422": {description: Validation}
    delete:
      tags: [audit]
      summary: Delete a schedule (operator with scope all). Run history is kept (schedule_id becomes null); queued runs fail with "schedule deleted".
      responses: {"204": {description: Deleted}}
  /audit/schedules/{id}/run:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [audit]
      summary: |
        Queue a manual run. With `cluster_id`: operator on that cluster (404 outside scope, 403 if only viewer).
        Without: every cluster in the schedule scope on which the caller is operator. kube-bench only runs on clusters
        whose agent advertised the bench capability (422 otherwise). A pending run for the same schedule and cluster is
        returned instead of queuing a duplicate.
      requestBody: {content: {application/json: {schema: {type: object, properties: {cluster_id: {type: string, description: "Only this cluster (default: every cluster in the schedule scope)"}}}}}}
      responses:
        "202":
          description: Queued runs
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditRun"}}}}}}
        "403": {description: Visible cluster but not operator}
        "404": {description: Unknown schedule, or cluster outside the caller's scope}
        "422": {description: "Cluster not enrolled, kube-bench not enabled on the agent, or no eligible cluster"}
  /audit/clusters:
    get:
      tags: [audit]
      summary: Per-cluster audit summary (latest run per tool, open findings by severity).
      responses:
        "200":
          description: One row per cluster in read scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        provider: {type: string}
                        bench_enabled: {type: boolean}
                        last_runs:
                          type: array
                          items: {type: object, properties: {tool: {type: string}, run_id: {type: string}, status: {type: string}, score: {type: [number, "null"]}, finished_at: {type: [string, "null"], format: date-time}, new_findings: {type: integer}}}
                        open_findings: {type: object, properties: {critical: {type: integer}, high: {type: integer}, medium: {type: integer}, low: {type: integer}}}
  /audit/runs:
    get:
      tags: [audit]
      summary: Runs on clusters the caller can read, newest first.
      parameters:
        - {name: schedule_id, in: query, schema: {type: string}}
        - {name: cluster_id, in: query, schema: {type: string}}
        - {name: tool, in: query, schema: {type: string, enum: [kubescape, polaris, kube-bench]}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 500}}
      responses:
        "200":
          description: Runs newest first
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditRun"}}}}}}
  /audit/runs/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      tags: [audit]
      responses:
        "200": {description: "Run incl. kube-bench node results and `log`", content: {application/json: {schema: {$ref: "#/components/schemas/AuditRun"}}}}
        "404": {description: Unknown run or cluster outside the caller's scope}
  /findings:
    get:
      tags: [audit]
      summary: Findings on clusters the caller can read; most severe and newest first. A `cluster` outside scope yields an empty list.
      parameters:
        - {name: source, in: query, schema: {type: string, enum: [kubescape, polaris, kube-bench, kyverno, netpol, tls, vault-drift, transfer]}}
        - {name: status, in: query, schema: {type: string, enum: [open, resolved]}}
        - {name: cluster, in: query, schema: {type: string, description: Cluster id or name}}
        - {name: run_id, in: query, schema: {type: string, description: Findings first seen in this run ("new")}}
        - {name: limit, in: query, schema: {type: integer, default: 200, maximum: 1000}}
      responses:
        "200":
          description: Findings
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Finding"}}}}}}

  # ------------------------------------------------------------ security (M5)
  /images:
    get:
      tags: [security]
      description: |
        Running images deduplicated by digest. Only images used in clusters the caller can read are listed;
        `clusters`/`workloads` count only those clusters.
      parameters:
        - {name: cluster, in: query, schema: {type: string}, description: Cluster ID or name (out of scope → empty list)}
        - {name: severity, in: query, schema: {type: string, enum: [critical, high]}, description: "critical: critical > 0; high: critical + high > 0"}
        - {name: status, in: query, schema: {type: string, enum: [pending, scanning, scanned, missing_credential, failed]}}
        - {name: q, in: query, schema: {type: string}, description: Substring of repo or tag, or digest prefix}
      responses:
        "200":
          description: Images by digest in scope
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Image"}}}}}}
        "422": {description: Invalid filter}
  /images/scan:
    post:
      tags: [security]
      summary: Queue a rescan of every running image now (Security › Scan now; operator).
      responses: {"202": {description: Queued}}
  /images/{digest}:
    parameters: [{name: digest, in: path, required: true, schema: {type: string}, description: "sha256:..."}]
    get:
      tags: [security]
      responses:
        "200": {description: Image with usage (visible clusters only) and vulnerabilities, content: {application/json: {schema: {$ref: "#/components/schemas/ImageDetail"}}}}
        "404": {description: Unknown digest, or not running in any cluster the caller can read}
  /images/{digest}/scan:
    parameters: [{name: digest, in: path, required: true, schema: {type: string}}]
    post:
      tags: [security]
      description: Queue a rescan. Requires operator on at least one cluster running the image.
      responses:
        "202": {description: Queued, content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [queued]}}}}}}
        "403": {description: Visible but the role does not allow scans}
        "404": {description: Unknown or out of scope}
  /security/kyverno:
    get:
      tags: [security]
      parameters: [{name: cluster, in: query, schema: {type: string}, description: Cluster ID or name}]
      responses:
        "200":
          description: Kyverno policies per cluster (most failures first) and Kyverno install state per cluster
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KyvernoPolicy"}}
                  clusters: {type: array, items: {$ref: "#/components/schemas/KyvernoCluster"}}
  /security/netpol:
    get:
      tags: [security]
      parameters: [{name: cluster, in: query, schema: {type: string}, description: Cluster ID or name}]
      responses:
        "200":
          description: NetworkPolicy default-deny status per namespace
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/NetpolNamespace"}}}}}}
  /security/clusters:
    get:
      tags: [security]
      summary: Per-cluster security summary (cluster overview of the Security page).
      responses:
        "200":
          description: One row per cluster in read scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster_id: {type: string}
                        cluster_name: {type: string}
                        provider: {type: string}
                        status: {type: string}
                        images: {type: integer}
                        workloads: {type: integer}
                        critical: {type: integer, description: critical CVEs across the cluster's images}
                        high: {type: integer}
                        images_with_critical: {type: integer}
                        not_scanned: {type: integer}
                        kyverno_installed: {type: boolean}
                        kyverno_policies: {type: integer}
                        kyverno_failures: {type: integer}
                        namespaces: {type: integer}
                        namespaces_without_default_deny: {type: integer}
  /security/kyverno/policy:
    get:
      tags: [security]
      summary: One Kyverno policy with its spec and current violations.
      parameters:
        - {name: cluster, in: query, required: true, schema: {type: string}}
        - {name: kind, in: query, required: true, schema: {type: string}}
        - {name: namespace, in: query, schema: {type: string}}
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KyvernoPolicy"
                  - type: object
                    properties:
                      spec: {type: [object, "null"], description: "The policy spec as stored in the cluster (metadata trimmed). null when the agent did not send it (older agent, or spec_omitted)"}
                      yaml: {type: string, description: "The whole object as YAML (apiVersion, kind, name, namespace, policies.kyverno.io/* annotations, spec); empty when spec is null"}
                      spec_omitted: {type: boolean, description: "The policy object exceeded the agent's size cap (64 KiB per policy, 8 MiB per report) and was not sent"}
                      violations:
                        type: array
                        description: "Non-passing results (fail, error, warn) in the current policy reports, fails first, at most 2000"
                        items: {type: object, properties: {rule: {type: string}, result: {type: string}, severity: {type: string}, message: {type: string}, resource_kind: {type: string}, resource_namespace: {type: string}, resource_name: {type: string}}}
        "404": {description: "Unknown policy or kind, missing parameter, or cluster outside the caller's read scope"}
  /security/netpol/namespace:
    get:
      tags: [security]
      summary: NetworkPolicies of one namespace with specs, plus labels for the policy simulator.
      parameters:
        - {name: cluster, in: query, required: true, schema: {type: string}}
        - {name: namespace, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Namespace
          content:
            application/json:
              schema:
                type: object
                properties:
                  cluster_id: {type: string}
                  cluster_name: {type: string}
                  namespace: {type: string}
                  namespace_labels: {type: object, additionalProperties: {type: string}}
                  default_deny: {type: boolean}
                  excluded: {type: boolean}
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        spec: {type: [object, "null"], description: "networking.k8s.io/v1 NetworkPolicySpec as in the cluster; null when the agent did not send it (older agent, or larger than 32 KiB)"}
                        yaml: {type: string, description: "The whole NetworkPolicy as YAML; empty when spec is null"}
                  workloads:
                    type: array
                    description: "Workloads in the namespace with their pod template labels (example data for the simulator)"
                    items: {type: object, properties: {kind: {type: string, enum: [Deployment, StatefulSet, DaemonSet]}, name: {type: string}, labels: {type: object, additionalProperties: {type: string}}, ports: {type: array, items: {type: integer}, description: container ports}}}
                  other_namespaces:
                    type: array
                    description: "Other namespaces of the cluster with labels (namespaceSelector examples)"
                    items: {type: object, properties: {name: {type: string}, labels: {type: object, additionalProperties: {type: string}}}}
        "404": {description: "Unknown namespace, missing parameter, or cluster outside the caller's read scope"}
  /registries:
    get:
      tags: [security]
      description: |
        Readable by every signed-in user with a grant. `images` and `unmatched` only consider images running in
        clusters the caller can read. Passwords are never returned.
      responses:
        "200":
          description: Registry credentials (no secrets) and unmatched registries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Registry"}}
                  unmatched: {type: array, items: {$ref: "#/components/schemas/UnmatchedRegistry"}}
    post:
      tags: [security]
      description: Admin with scope `all`. Requeues images in missing_credential/failed for a scan.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Registry"}}}}
        "403": {description: Not a global admin}
        "422": {description: Validation (incl. duplicate host_pattern)}
  /registries/test:
    post:
      tags: [security]
      summary: Test an unsaved registry credential with a manifest pull (Test pull). Never echoes the password.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string}}}}}}
  /registries/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    patch:
      tags: [security]
      description: |
        Admin with scope `all`. Omitted fields are unchanged. `password` replaces the credential
        (`{"source": "none"}` removes it); `username` alone renames the existing credential.
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/RegistryInput"}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Registry"}}}}
        "404": {description: Not found}
        "422": {description: Validation}
    delete:
      tags: [security]
      description: Admin with scope `all`. Deletes the registry and its credential.
      responses: {"204": {description: Deleted}, "404": {description: Not found}}

  # ------------------------------------------------------------ activity
  /activity:
    get:
      tags: [activity]
      parameters:
        - {name: action, in: query, schema: {type: string}, description: "Prefix, e.g. backup. or cr."}
        - {name: object_type, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string}, description: "Go duration, e.g. 24h, 168h"}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: Cursor (at of last item)}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200":
          description: Entries newest first
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ActivityEntry"}}}}}}

components:
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}

  schemas:
    Role: {type: string, enum: [viewer, operator, vault-maker, vault-approver, admin]}

    Principal:
      type: object
      properties:
        id: {type: string}
        tenant_id: {type: string}
        object_id: {type: string}
        upn: {type: string}
        display_name: {type: string}
        user_type: {type: string}
        account_enabled: {type: boolean}

    Me:
      type: object
      properties:
        principal: {$ref: "#/components/schemas/Principal"}
        is_guest: {type: boolean}
        roles: {type: array, items: {$ref: "#/components/schemas/Role"}}
        grants: {type: array, items: {type: object, properties: {role: {$ref: "#/components/schemas/Role"}, scope: {type: string}}}}
        permissions:
          type: object
          description: Booleans that decide which controls are rendered (hidden, not disabled).
          properties:
            read: {type: boolean}
            operate: {type: boolean}
            operate_global: {type: boolean}
            vault_make: {type: boolean}
            vault_approve: {type: boolean}
            admin: {type: boolean}
            admin_global: {type: boolean}
        csrf_token: {type: string}
        dev_mode: {type: boolean}

    Grant:
      type: object
      properties:
        id: {type: string}
        principal: {$ref: "#/components/schemas/Principal"}
        is_guest: {type: boolean}
        role: {$ref: "#/components/schemas/Role"}
        scope: {type: string}
        granted_by: {type: [string, "null"]}
        granted_by_name: {type: string}
        granted_at: {type: string, format: date-time}
        stale: {type: boolean}

    DirectoryUser:
      type: object
      properties:
        object_id: {type: string}
        display_name: {type: string}
        upn: {type: string}
        mail: {type: string}
        user_type: {type: string}
        account_enabled: {type: boolean}
        is_guest: {type: boolean}

    Cluster:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        labels: {type: object, additionalProperties: {type: string}, description: "Always includes the reserved, read-only olympos.io/cluster=<name>. Other olympos.io/ keys are refused (422)."}
        provider: {type: string, enum: ["", azure, aws, gcp, oracle, huawei, onprem]}
        provider_label: {type: string, example: Azure}
        provider_override: {type: string}
        region: {type: string}
        api_version: {type: string, example: v1.31.4}
        status: {type: string, enum: [pending, online, offline, revoked]}
        last_seen_at: {type: [string, "null"], format: date-time}
        agent_version: {type: string}
        bench_enabled: {type: boolean}
        transfer_mode: {type: string, enum: [e2e-tls, compressed]}
        egress_rate_per_gb: {type: [number, "null"]}
        cert_expires_at: {type: [string, "null"], format: date-time}
        nodes: {type: integer}
        nodes_ready: {type: integer}
        cpu_milli: {type: integer}
        mem_bytes: {type: integer}
        min_kubelet: {type: string}
        version_skew: {type: boolean}
        eol: {type: boolean}
        inventory_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        zones: {type: array, items: {type: string}, description: "Optional. Distinct node zones (dashboard Region / zones column)."}
        instance_types:
          type: array
          description: "Optional. Node count per instance type (dashboard Node sizes column)."
          items: {type: object, properties: {instance_type: {type: string}, count: {type: integer}}}
        backup_wire_bytes_30d: {type: integer, description: "Optional. Wire bytes of backup runs in the last 30 days (Settings › Clusters egress estimate)."}
        backup_bytes_30d: {type: integer, description: "Optional. Uncompressed bytes of the same runs (shows the compression gain)."}
    ClusterList:
      type: object
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Cluster"}}
    InstallResponse:
      type: object
      properties:
        cluster: {$ref: "#/components/schemas/Cluster"}
        command: {type: string, description: "Multi-line helm command containing the one-time token"}
        expires_at: {type: string, format: date-time}
    Node:
      type: object
      properties:
        name: {type: string}
        provider_id: {type: string}
        kubelet_version: {type: string}
        region: {type: string}
        zone: {type: string}
        instance_type: {type: string}
        cpu_milli: {type: integer}
        mem_bytes: {type: integer}
        roles: {type: array, items: {type: string}}
        ready: {type: boolean}
        seen_at: {type: string, format: date-time}
    Target:
      type: object
      properties:
        id: {type: string, description: 32 hex chars}
        cluster_id: {type: string}
        cluster_name: {type: string}
        namespace: {type: string}
        service: {type: string}
        port: {type: integer}
        port_name: {type: string}
        engine: {type: string, enum: ["", postgresql, clickhouse, vault]}
        vault_provider: {type: string, enum: ["", hashicorp, openbao]}
        tls_server_name: {type: string}
        detected_version: {type: string}
        tls_ok: {type: [boolean, "null"], description: null = not probed yet}
        status: {type: string, enum: [candidate, configured, gone]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}

    Dashboard:
      type: object
      properties:
        attention:
          type: array
          description: Needs-attention strip; hide the section when empty.
          items:
            type: object
            properties:
              kind: {type: string, enum: [agent_offline, backup_failed, backup_missed, approvals, eol, critical_cves]}
              severity: {type: string, enum: [crit, warn]}
              label: {type: string}
              detail: {type: string}
              link: {type: string, description: SPA path}
        totals:
          type: object
          properties:
            clusters: {type: integer}
            agents_online: {type: integer}
            nodes: {type: integer}
            cpu_milli: {type: integer}
            mem_bytes: {type: integer}
            versions: {type: integer}
            version_min: {type: string}
            version_max: {type: string}
            skew_clusters: {type: integer}
            offline_agents: {type: integer}
            offline_detail: {type: string}
        version_matrix:
          type: array
          items: {type: object, properties: {minor: {type: string, example: "1.31"}, clusters: {type: integer}, eol: {type: boolean}}}
        providers:
          type: array
          items: {type: object, properties: {provider: {type: string}, label: {type: string}, clusters: {type: integer}, nodes: {type: integer}}}
        clusters: {type: array, items: {$ref: "#/components/schemas/Cluster"}}
        refreshed_at: {type: [string, "null"], format: date-time}

    # ---------------------------------------------------- notifications
    Channel:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [slack]}
        name: {type: string, example: "#platform-alerts"}
        slack_channel_id: {type: string, example: C0123ABCD}
        routes: {type: array, items: {type: string}, description: Event types routed here}
        created_at: {type: string, format: date-time}
    ChannelInput:
      type: object
      required: [name, slack_channel_id]
      properties:
        name: {type: string}
        slack_channel_id: {type: string}
    Route:
      type: object
      properties:
        event_type: {type: string}
        channel_ids: {type: array, items: {type: string}}
    Routes:
      type: object
      properties:
        catalog:
          type: array
          items:
            type: object
            properties:
              event_type: {type: string, example: backup.failed}
              description: {type: string}
              opt_in: {type: boolean, description: true for backup.succeeded}
        routes: {type: array, items: {$ref: "#/components/schemas/Route"}}

    # ---------------------------------------------------- destinations
    SecretSourceInput:
      type: object
      description: Either a Key Vault reference (recommended) or a value stored envelope-encrypted in Olympos.
      required: [source]
      properties:
        source: {type: string, enum: [keyvault_ref, stored]}
        ref: {type: string, example: "kv://kv-platform-weu/backup-sas"}
        value: {type: string, writeOnly: true}
    DestinationInput:
      type: object
      description: |
        One of three kinds (SPEC §10.3, extended — docs/spec-changes.md). `kind` defaults to azure_blob.
        - **azure_blob**: account, container, prefix, auth managed_identity | sas_token (+ sas), endpoint_override
          (Azurite, sovereign clouds, private DNS names; e.g. http://azurite.olympos.svc:10000/devstoreaccount1).
        - **s3**: bucket, region, prefix, endpoint_override (any S3-compatible service: MinIO, Ceph RGW, Wasabi,
          NetApp StorageGRID…; empty = AWS), path_style, auth access_key with access_key_id + secret_key.
        - **nfs**: path — a directory below one of the server's mounted volumes (`GET /destinations/mounts`),
          prefix. The server process can delete there; the test reports can_delete=true (use storage-side
          snapshots / WORM for retention protection).
        PATCH is partial: omitted fields are unchanged; `kind` cannot change.
      required: [name]
      properties:
        name: {type: string}
        kind: {type: string, enum: [azure_blob, s3, nfs], default: azure_blob}
        prefix: {type: string}
        endpoint_override: {type: string, description: "azure_blob and s3: custom endpoint URL (http or https)"}
        # azure_blob
        account: {type: string, example: stolymposbackups}
        container: {type: string}
        auth: {type: string, enum: [managed_identity, sas_token, access_key, none], description: "azure_blob: managed_identity | sas_token; s3: access_key; nfs: none"}
        sas: {$ref: "#/components/schemas/SecretSourceInput"}
        # s3
        bucket: {type: string}
        region: {type: string, example: eu-central-1, description: "s3: default us-east-1"}
        path_style: {type: boolean, description: "s3: path-style addressing (most S3-compatible services need it)"}
        access_key_id: {type: string, description: "s3: not secret, shown in the UI"}
        secret_key: {$ref: "#/components/schemas/SecretSourceInput"}
        # nfs
        path: {type: string, example: /var/lib/olympos/nfs/backup-nas/olympos}
    Destination:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [azure_blob, s3, nfs]}
        prefix: {type: string}
        endpoint_override: {type: string}
        account: {type: string}
        container: {type: string}
        auth: {type: string, enum: [managed_identity, sas_token, access_key, none]}
        sas_source: {type: string, enum: ["", keyvault_ref, stored]}
        sas_ref: {type: string}
        sas_expires_at: {type: [string, "null"], format: date-time}
        sas_permissions: {type: string, example: rcwt}
        bucket: {type: string}
        region: {type: string}
        path_style: {type: boolean}
        access_key_id: {type: string}
        secret_key_source: {type: string, enum: ["", keyvault_ref, stored]}
        secret_key_ref: {type: string}
        path: {type: string}
        last_test_at: {type: [string, "null"], format: date-time}
        last_test_ok: {type: [boolean, "null"]}
        last_test: {$ref: "#/components/schemas/DestinationTest"}
        jobs: {type: integer}
        created_at: {type: string, format: date-time}
        warnings: {type: array, items: {type: string}, description: "Only on create/patch responses: things the admin must see (credential can delete, account SAS, expiry < 14 days)"}
    DestinationMount:
      type: object
      description: A volume mounted into the server for NFS destinations (Helm value nfsMounts).
      properties:
        name: {type: string, example: backup-nas}
        path: {type: string, example: /var/lib/olympos/nfs/backup-nas}
        writable: {type: boolean}
    DestinationTest:
      type: object
      properties:
        ok: {type: boolean, description: Write/read/tag succeeded}
        can_delete: {type: boolean, description: true = WARNING, credential can delete blobs}
        steps:
          type: array
          items:
            type: object
            properties:
              name: {type: string, enum: [write, read, tag, delete_refused, sas_permissions, sas_expiry, endpoint, path]}
              ok: {type: boolean}
              detail: {type: string}
        sas:
          type: [object, "null"]
          properties:
            permissions: {type: string}
            expires_at: {type: [string, "null"], format: date-time}
            missing: {type: array, items: {type: string}, description: "required of r,c,w,t not granted"}
            extra: {type: array, items: {type: string}, description: "e.g. d, l"}
            scope: {type: string, enum: [container, account, service, unknown]}
            user_delegation: {type: boolean, description: User delegation SAS (works with allowSharedKeyAccess=false)}
            stored_policy: {type: string, description: Stored access policy name (si) when used}
            notes: {type: array, items: {type: string}}
        error: {type: string}
        probe_path: {type: string, description: "{prefix}/.olympos-probe/<uuid>"}
    DestinationTestFailed:
      type: object
      properties:
        error: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        test: {$ref: "#/components/schemas/DestinationTest"}

    # ---------------------------------------------------- backups
    CredentialInput:
      type: object
      required: [source, username]
      properties:
        source: {type: string, enum: [keyvault_ref, stored]}
        ref: {type: string, description: "kv://<vault>/<secret>; the secret holds the password"}
        username: {type: string}
        password: {type: string, writeOnly: true}
    Retention:
      type: object
      properties:
        daily: {type: integer, default: 7}
        weekly: {type: integer, default: 4}
        monthly: {type: integer, default: 12}
    BackupJobInput:
      type: object
      properties:
        target_id: {type: string}
        credential: {$ref: "#/components/schemas/CredentialInput"}
        destination_id: {type: string}
        engine_options:
          type: object
          description: "postgresql: {databases: [..] (empty = all), globals: true, tls_ca_pem: PEM bundle to verify the target (default system roots)}; clickhouse: {databases: [..], tables: [..]}; vault: {}"
        cron: {type: string, example: "0 2 * * *"}
        timezone: {type: string, example: Europe/Istanbul}
        retention: {$ref: "#/components/schemas/Retention"}
        notify_on_success: {type: boolean, description: "Send backup.succeeded for this job (default false; routed like other events, job channel overrides)"}
        enabled: {type: boolean}
        notify_channel_id: {type: [string, "null"]}
        notify_on_success: {type: boolean, description: "Also send backup.succeeded for this job (wizard step 3)."}
    BackupJob:
      type: object
      properties:
        id: {type: string}
        target: {$ref: "#/components/schemas/Target"}
        engine: {type: string}
        credential: {type: object, properties: {id: {type: string}, source: {type: string}, ref: {type: string}, username: {type: string}}}
        destination: {type: object, properties: {id: {type: string}, name: {type: string}}}
        engine_options: {type: object}
        cron: {type: string}
        timezone: {type: string}
        retention: {$ref: "#/components/schemas/Retention"}
        enabled: {type: boolean}
        paused_reason: {type: string, description: "e.g. target_gone"}
        notify_channel_id: {type: [string, "null"]}
        notify_on_success: {type: boolean}
        next_run_at: {type: [string, "null"], format: date-time}
        last_run: {oneOf: [{$ref: "#/components/schemas/BackupRun"}, {type: "null"}]}
        estimated_monthly_bytes: {type: integer, description: wire bytes of recent runs × frequency}
        estimated_monthly_cost: {type: [number, "null"], description: "estimated_monthly_bytes / GiB x cluster egress_rate_per_gb (when set)"}
        created_at: {type: string, format: date-time}
    BackupRun:
      type: object
      properties:
        id: {type: string}
        job_id: {type: string}
        target_service: {type: string}
        cluster_name: {type: string}
        engine: {type: string}
        trigger: {type: string, enum: [schedule, manual, test]}
        status: {type: string, enum: [queued, running, succeeded, failed, missed]}
        scheduled_for: {type: [string, "null"], format: date-time}
        tier: {type: string, enum: ["", daily, weekly, monthly, test], description: "GFS tier = blob index tag olympos-tier (test for dry runs)"}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        bytes: {type: integer}
        wire_bytes: {type: integer}
        blob_path: {type: string}
        sha256: {type: string}
        error: {type: string, description: "Secrets scrubbed; agent_offline when the cluster's agent is offline"}
        created_at: {type: string, format: date-time}
    ConnectionTest:
      type: object
      properties:
        ok: {type: boolean}
        server_version: {type: string}
        tls: {type: boolean}
        privileges: {type: array, items: {type: object, properties: {name: {type: string}, ok: {type: boolean}, detail: {type: string}}}}
        databases: {type: array, items: {type: string}}
        error: {type: string}

    # ---------------------------------------------------- vaults
    KVMount:
      type: object
      properties:
        path: {type: string, example: "secret/"}
        version: {type: integer, enum: [1, 2]}
        managed: {type: boolean}
        description: {type: string}
    Vault:
      type: object
      properties:
        id: {type: string}
        target: {$ref: "#/components/schemas/Target"}
        cluster_labels: {type: object, additionalProperties: {type: string}, description: Olympos labels of the vault's cluster (filtering)}
        provider: {type: string, enum: [hashicorp, openbao]}
        version: {type: string}
        status: {type: string, enum: [discovered, configured, error, gone]}
        kv_mounts: {type: array, items: {$ref: "#/components/schemas/KVMount"}}
        configured_by_name: {type: string}
        configured_at: {type: [string, "null"], format: date-time}
        secret_id_rotated_at: {type: [string, "null"], format: date-time}
        last_index_at: {type: [string, "null"], format: date-time}
        secrets: {type: integer}
        drift: {type: integer, description: open vault-drift findings}
        last_error: {type: string}
        tls_server_name: {type: string, description: "Name verified in the vault's certificate (default <svc>.<ns>.svc)"}
        transfer_mode: {type: string, enum: [e2e-tls, compressed]}
        ca_bundle_set: {type: boolean}
    SecretSummary:
      type: object
      properties:
        mount: {type: string}
        path: {type: string}
        keys: {type: integer}
        current_version: {type: integer}
        updated_time: {type: [string, "null"], format: date-time}
        managed: {type: boolean, description: false = latest version not written by Olympos (drift)}
    SecretDetail:
      type: object
      properties:
        mount: {type: string}
        path: {type: string}
        keys: {type: array, items: {type: string}}
        current_version: {type: integer}
        updated_time: {type: [string, "null"], format: date-time}
        managed: {type: boolean}
        versions:
          type: array
          items:
            type: object
            properties:
              version: {type: integer}
              created_time: {type: string, format: date-time}
              deletion_time: {type: string}
              destroyed: {type: boolean}
              by_olympos: {type: boolean}
              keys: {type: integer, description: "Optional. Number of keys in that version (destroy-history dialog)."}
        pending_change_requests: {type: integer}
        updated_by_name: {type: string, description: "Optional. Who wrote the current version (maker of the applied CR, or 'outside Olympos')."}
        key_info:
          type: array
          description: "Optional. Per-key metadata for the keys table. Never contains values."
          items:
            type: object
            properties:
              key: {type: string}
              version: {type: integer, description: Version in which the key last changed}
              updated_time: {type: [string, "null"], format: date-time}
              pending_cr_id: {type: [string, "null"]}
              pending_cr_label: {type: string}
              last_cr_id: {type: [string, "null"]}
              last_cr_label: {type: string}
    ChangeItemInput:
      type: object
      required: [mount, path, op]
      properties:
        mount: {type: string}
        path: {type: string}
        key: {type: string, description: Required except for destroy_history}
        op: {type: string, enum: [create, replace, delete, destroy_history]}
        value: {type: string, writeOnly: true, description: create/replace only}
        base_version: {type: integer, description: "Version the maker saw (cas); 0 for a new secret path"}
        versions: {type: array, items: {type: integer}, description: destroy_history only}
    ChangeRequestInput:
      type: object
      required: [vault_id, justification, items]
      properties:
        vault_id: {type: string}
        justification: {type: string, minLength: 10}
        items: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ChangeItemInput"}}
    ChangeRequest:
      type: object
      properties:
        id: {type: string}
        number: {type: string, description: "Optional. Short display number, e.g. CR-0142."}
        vault: {type: object, properties: {id: {type: string}, name: {type: string}, cluster_name: {type: string}, provider: {type: string}, version: {type: string}}}
        maker: {$ref: "#/components/schemas/Principal"}
        checker: {oneOf: [{$ref: "#/components/schemas/Principal"}, {type: "null"}]}
        justification: {type: string}
        status: {type: string, enum: [pending, approved, applied, rejected, expired, failed, cancelled]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        decision_comment: {type: string}
        applied_at: {type: [string, "null"], format: date-time}
        failure: {type: string}
        can_approve: {type: boolean, description: Caller may approve/reject}
        approve_disabled_reason: {type: string, description: 'e.g. "You opened this request"'}
        can_cancel: {type: boolean}
        eligible_approvers: {type: integer, description: "Optional. People with vault-approver in scope, excluding the maker."}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              mount: {type: string}
              path: {type: string}
              key: {type: [string, "null"]}
              op: {type: string}
              base_version: {type: integer}
              versions: {type: array, items: {type: integer}}
              fingerprint: {type: string, example: "hm:3f9a·c210·77be"}
        events:
          type: array
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              kind: {type: string, enum: [opened, notified, approved, rejected, applied, failed, expired, cancelled], description: "notified = Slack link sent (details.channel)"}
              actor_name: {type: string}
              details: {type: object}

    # ---------------------------------------------------- audit
    AuditScheduleInput:
      type: object
      properties:
        tool: {type: string, enum: [kubescape, polaris, kube-bench]}
        frameworks:
          type: array
          items: {type: string, enum: [nsa, cis, mitre]}
          description: kubescape only (default all three). "cis" maps to kubescape's CIS framework for the cluster's provider (AKS, EKS, else generic).
        scope_selector: {type: string, default: all, description: '"all" or a label selector over cluster labels, e.g. env=prod'}
        cron: {type: string, description: 5-field cron or @daily etc.}
        timezone: {type: string, default: UTC, description: IANA zone}
        enabled: {type: boolean, default: true}
        notify_channel_id: {type: [string, "null"], description: Overrides routing for audit.new_findings}
    AuditSchedule:
      allOf:
        - $ref: "#/components/schemas/AuditScheduleInput"
        - type: object
          properties:
            id: {type: string}
            next_run_at: {type: [string, "null"], format: date-time}
            clusters: {type: integer, description: clusters currently matched by scope (and visible to the caller; kube-bench counts only bench-enabled clusters)}
            last_run: {oneOf: [{$ref: "#/components/schemas/AuditRun"}, {type: "null"}]}
            created_at: {type: string, format: date-time}
    AuditRun:
      type: object
      properties:
        id: {type: string}
        schedule_id: {type: [string, "null"], description: null once the schedule was deleted}
        tool: {type: string, enum: [kubescape, polaris, kube-bench]}
        cluster_id: {type: string}
        cluster_name: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        scheduled_for: {type: [string, "null"], format: date-time, description: null for manual runs}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        score: {type: [number, "null"], description: "0–100: kubescape compliance score, polaris score, kube-bench pass/(pass+fail)"}
        new_findings: {type: integer}
        resolved_findings: {type: integer}
        raw_blob_path: {type: string, description: "Blob path of the raw JSON report ({prefix}/audit/{cluster}/{tool}/{run_id}.json); empty when not stored"}
        error: {type: string, description: 'Short reason, e.g. "agent_offline" or "kubescape failed: framework ''cis-v1.23-t1.0.1'' not found"'}
        log: {type: string, description: "Run detail (GET /audit/runs/{id}) only: captured console output of a failed kubescape/polaris run (redacted, last 256 KiB); empty otherwise. Absent in lists."}
        details:
          type: object
          description: >-
            trigger (schedule|manual), frameworks, summary, findings_total, raw_report (why it was not stored),
            nodes_succeeded/nodes_failed/partial and control_plane ("Control plane N/A · managed") for kube-bench
        created_at: {type: string, format: date-time}
        bench_nodes:
          type: array
          description: kube-bench only (run detail)
          items:
            type: object
            properties:
              node_name: {type: string}
              benchmark: {type: string, example: aks-1.8}
              state: {type: string, enum: [pending, accepted, rejected, running, succeeded, failed]}
              pass: {type: integer}
              fail: {type: integer}
              warn: {type: integer}
              info: {type: integer}
              control_plane_na: {type: boolean, description: 'Managed cluster: show "Control plane N/A · managed" (control plane checks are never counted as failed or missing)'}
              message: {type: string}
              cluster_name: {type: string, description: "Optional. Set when one run covers several clusters."}
              duration_s: {type: number, description: "Optional. Job duration."}
              checks:
                type: array
                description: Every kube-bench result for the node (control plane sections are omitted on managed clusters)
                items:
                  type: object
                  properties:
                    id: {type: string, example: "4.2.1"}
                    section: {type: string, example: "4.2"}
                    section_text: {type: string, example: Kubelet}
                    node_type: {type: string, example: node}
                    description: {type: string}
                    status: {type: string, enum: [PASS, FAIL, WARN, INFO]}
                    scored: {type: boolean}
                    remediation: {type: string}
                    actual_value: {type: string}
                    expected_result: {type: string}
                    reason: {type: string}
    Finding:
      type: object
      properties:
        id: {type: string}
        source: {type: string}
        cluster_id: {type: string}
        cluster_name: {type: string}
        control_id: {type: string, description: 'kubescape "C-0016", polaris check ID, kube-bench "<benchmark>:<test>" e.g. "cis-1.12:4.2.6"'}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        resource_ref: {type: string, description: '"<ns>/<Kind>/<name>", "<Kind>/<name>" (cluster-scoped), polaris adds "/container:<name>", kube-bench "node/<name>"'}
        title: {type: string}
        details: {type: object}
        status: {type: string, enum: [open, resolved]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
        first_seen_run_id: {type: [string, "null"]}

    # ---------------------------------------------------- security
    Image:
      type: object
      properties:
        digest: {type: string}
        repo: {type: string, description: "Normalized repository, e.g. docker.io/library/nginx"}
        tags: {type: array, items: {type: string}}
        clusters: {type: integer}
        workloads: {type: integer}
        critical: {type: integer, description: distinct CVEs}
        high: {type: integer}
        medium: {type: integer}
        low: {type: integer}
        fixable: {type: integer, description: critical/high CVEs with a fixed version}
        scan_status: {type: string, enum: [pending, scanning, scanned, missing_credential, unavailable, failed], description: "unavailable = the digest is not in the registry (locally built or retagged, e.g. kind node images); failed = transient error, retried automatically (scan_attempts, next_retry_at)"}
        scan_error: {type: string, description: "Why the last scan did not succeed (also on list items)"}
        scan_attempts: {type: integer}
        scanned_by: {type: string, enum: ["", digest, tag], description: "tag = the running digest is not in the registry; the registry's image with the same tag was scanned instead (results may differ from what runs). vuln.critical events are emitted for digest scans only."}
        scan_note: {type: string, description: "Set with scanned_by=tag, e.g. \"Scanned by tag v1.37.0 — the running digest is not in the registry (built or retagged locally), so results are for the registry's image with that tag.\""}
        next_retry_at: {type: [string, "null"], format: date-time}
        last_scanned_at: {type: [string, "null"], format: date-time}
        registry: {type: string, description: "Matching registry host_pattern, \"public\" (anonymous pull), or \"\" (no credential)"}
    ImageDetail:
      allOf:
        - $ref: "#/components/schemas/Image"
        - type: object
          properties:
            usage:
              type: array
              items: {type: object, properties: {cluster_id: {type: string}, cluster_name: {type: string}, namespace: {type: string}, workload_kind: {type: string}, workload_name: {type: string}, container: {type: string}, image: {type: string, description: image string from the pod spec}}}
            vulns:
              type: array
              items: {type: object, properties: {cve_id: {type: string}, severity: {type: string, enum: [critical, high, medium, low, unknown]}, package: {type: string}, installed: {type: string}, fixed_in: {type: string}, title: {type: string}}}
            scan_error: {type: string}
    KyvernoPolicy:
      type: object
      properties:
        cluster_id: {type: string}
        cluster_name: {type: string}
        kind: {type: string, enum: [ClusterPolicy, Policy, ValidatingPolicy, NamespacedValidatingPolicy, ImageValidatingPolicy, NamespacedImageValidatingPolicy]}
        namespace: {type: string, description: empty = ClusterPolicy}
        name: {type: string}
        mode: {type: string, enum: [Enforce, Audit], description: Enforce when any validate rule (or namespace override) enforces}
        rules: {type: integer}
        rule_names: {type: array, items: {type: string}}
        fail_count: {type: integer}
        ready: {type: boolean}
    KyvernoCluster:
      type: object
      properties:
        cluster_id: {type: string}
        cluster_name: {type: string}
        installed: {type: boolean, description: false when the Kyverno CRDs are absent}
        policies: {type: integer}
        fail_count: {type: integer}
        reported_at: {type: string, format: date-time}
    NetpolNamespace:
      type: object
      properties:
        cluster_id: {type: string}
        cluster_name: {type: string}
        namespace: {type: string}
        policy_count: {type: integer}
        default_deny: {type: boolean, description: "a policy selects all pods, policyTypes include Ingress, no ingress rules"}
        excluded: {type: boolean, description: system namespace}
    RegistryInput:
      type: object
      description: "POST requires host_pattern. username and password go together."
      properties:
        host_pattern:
          type: string
          example: "*.azurecr.io"
          description: >
            Registry host ("acr.contoso.io", "*.azurecr.io") or host/path ("ghcr.io/contoso/*"). The most specific
            match wins. A wildcard host must end in a registry domain ("*" and "*.io" are rejected).
        username: {type: string}
        password:
          type: object
          description: Write-only registry password or token. Either a Key Vault reference or a value stored envelope-encrypted.
          required: [source]
          properties:
            source: {type: string, enum: [keyvault_ref, stored, none], description: "none (PATCH only) removes the credential"}
            ref: {type: string, example: "kv://kv-platform-weu/acr-pull"}
            value: {type: string, writeOnly: true}
    Registry:
      type: object
      properties:
        id: {type: string}
        host_pattern: {type: string}
        username: {type: string}
        credential_source: {type: string, enum: ["", keyvault_ref, stored], description: '"" = anonymous pull'}
        credential_ref: {type: string, description: kv:// reference (keyvault_ref only)}
        images: {type: integer, description: running images (in the caller's scope) matched by this registry}
        created_at: {type: string, format: date-time}
    UnmatchedRegistry:
      type: object
      properties:
        host: {type: string}
        images: {type: integer, description: images in missing_credential}
        example_repo: {type: string}

    ActivityEntry:
      type: object
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        actor_id: {type: [string, "null"]}
        actor_name: {type: string}
        actor_kind: {type: string, enum: [user, system, agent]}
        action: {type: string, example: cr.approved}
        object_type: {type: string}
