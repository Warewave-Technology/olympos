<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olympos — Sign in to Olympos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#1d2021}
a{color:#83a598}a:hover{color:#8ec07c}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:7px;color:#bdae93;text-decoration:none;font-size:14px;min-height:20px}
.nav a:hover{background:#32302f;color:#ebdbb2}
.nav a.on{background:#3c3836;color:#fbf1c7}
.card{background:#282828;border:1px solid #3c3836;border-radius:10px}
.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:#a89984;padding:10px 14px;border-bottom:1px solid #3c3836;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid #3c3836;color:#ebdbb2;white-space:nowrap}
.t tr.sel td{background:#32302f}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.ok{background:#2f3317;color:#b8bb26}.warn{background:#3d3014;color:#fabd2f}.crit{background:#3c1f1e;color:#fc7f6f}.info{background:#273436;color:#83a598}.mute{background:#3c3836;color:#d5c4a1}
.btn{font:inherit;font-size:13px;font-weight:500;padding:9px 16px;border-radius:7px;border:1px solid #504945;background:#3c3836;color:#ebdbb2;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
.btn:hover{color:#fbf1c7}
.btn.pri{background:#d79921;border-color:#d79921;color:#1d2021}
.btn.danger{background:#351a19;border-color:#cc241d;color:#fc7f6f}
.btn.sm{min-height:32px;padding:5px 11px;font-size:12.5px}
.in{font:inherit;font-size:13px;background:#1d2021;border:1px solid #504945;border-radius:7px;color:#ebdbb2;padding:10px 12px;box-sizing:border-box;min-height:40px;width:100%}
.lbl{display:block;font-size:12px;color:#a89984;margin-bottom:6px}
.muted{color:#a89984}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #504945;border-radius:8px;font-size:13px;cursor:pointer}
.opt.on{border-color:#d79921;background:#32302f}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:8px;font-size:13px}
.step.on{background:#3c3836}
.num{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid #504945;color:#bdae93}
.done .num{background:#2f3317;border-color:#98971a;color:#b8bb26}
.on .num{background:#d79921;border-color:#d79921;color:#1d2021}
.side a{display:block;padding:9px 12px;border-radius:7px;color:#bdae93;text-decoration:none;font-size:14px}
.side a.on{background:#3c3836;color:#fbf1c7}
.chip{display:inline-block;padding:2px 8px;border-radius:5px;background:#3c3836;font-family:'JetBrains Mono',monospace;font-size:12px;color:#d5c4a1;margin:2px 4px 2px 0}
.code{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;background:#1d2021;border:1px solid #3c3836;border-radius:8px;padding:14px 16px;color:#ebdbb2;white-space:pre-wrap;word-break:break-all;margin:0}
.chk{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;border:1px solid #504945;font-size:12.5px;color:#d5c4a1;background:#282828;font-family:inherit;cursor:pointer;min-height:32px}
.pill.on{border-color:#d79921;color:#fabd2f;background:#32302f}
.dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px 16px;font-size:13px;margin:0}
.dl dt{color:#a89984}.dl dd{margin:0}
.note{padding:14px 16px;border-radius:8px;background:#1d2021;border:1px solid #3c3836;font-size:12.5px;line-height:1.55;color:#a89984}
.note.warn{border-color:#d79921;background:#2b2516;color:#d5c4a1}
.note.crit{border-color:#cc241d;background:#2a1a19;color:#d5c4a1}
</style>
</head>
<body>
<div style="min-height: 1100px; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #ebdbb2; background: #1d2021">
<main style="width: 440px; max-width: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px">

</div>
<section class="card" style="width: 100%; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 18px; font-weight: 600">Sign in</h1>
<button class="btn pri" style="width: 100%; min-height: 48px; font-size: 14px"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1" width="7.5" height="7.5" fill="#1d2021"/><rect x="9.5" y="1" width="7.5" height="7.5" fill="#1d2021"/><rect x="1" y="9.5" width="7.5" height="7.5" fill="#1d2021"/><rect x="9.5" y="9.5" width="7.5" height="7.5" fill="#1d2021"/></svg>Sign in with Microsoft</button>
<p class="muted" style="margin: 0; font-size: 12.5px; line-height: 1.55">Only accounts from <span class="mono">contoso.onmicrosoft.com</span> that an Olympos admin has granted access can sign in.</p>
</section>
<p class="muted" style="margin: 0; font-size: 12px">Olympos 0.1.0 · self-hosted</p>
</main>
</div>
</body>
</html>
